<!DOCTYPE html>
<html data-theme="light" lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>BookLoom — High-Fidelity Mockup</title>
    <style>
        /* ============================================================
   DESIGN TOKENS  (mirror JavaFX ".root" looked-up colors)
   Palette: Slate #b2babd · Sand Dollar #e7d6c0 · Cognac #a58075 · Charcoal #3a4a52
   ============================================================ */
        :root {
            --slate: #b2babd;
            --sand: #e7d6c0;
            --cognac: #a58075;
            --charcoal: #3a4a52;
            /* spacing (8px base) */
            --s1: 4px;
            --s2: 8px;
            --s3: 12px;
            --s4: 16px;
            --s5: 24px;
            --s6: 32px;
            --r-sm: 4px;
            --r: 6px;
            --r-lg: 9px;
            --r-pill: 999px;
            --fs-xs: 11px;
            --fs-sm: 12px;
            --fs-base: 13.5px;
            --fs-md: 15px;
            --fs-lg: 18px;
            --fs-xl: 22px;
            --fs-2xl: 28px;
        }

        :root[data-theme="light"] {
            --bg: #f4f1ea;
            --surface: #ffffff;
            --surface-2: #f6f1e8;
            --surface-alt: #fbf9f4;
            --border: #ddd5c8;
            --border-cool: #cdd2d3;
            --divider: #eae4d8;
            --text: #2c3941;
            --text-strong: #22303a;
            --muted: #5d686d;
            --muted-2: #6f6c65;
            --primary: #a58075;
            --primary-hover: #b58f83;
            --primary-press: #c39e92;
            --primary-fg: #241c19;
            --primary-soft: #f0e5dd;
            --sand-soft: #f2e9db;
            --sand-strong: #dcc4a3;
            --selected: #f0e6d6;
            --nav-bg: #3a4a52;
            --nav-bg-2: #324148;
            --nav-fg: #cdd5d8;
            --nav-fg-muted: #b0b9bd;
            --nav-active-bg: rgba(231, 214, 192, .13);
            --nav-active-fg: #f3ede3;
            --nav-accent: #c99a86;
            --title-bg: #324148;
            --title-fg: #dfe4e6;
            --ok: #5f8a6b;
            --ok-bg: #e7efe8;
            --ok-bd: #bcd4c1;
            --warn: #bd863a;
            --warn-bg: #f6ecd8;
            --warn-bd: #e4cfa2;
            --err: #b0574c;
            --err-bg: #f7e4df;
            --err-bd: #e4b6ad;
            --info: #4d6b78;
            --info-bg: #e5edf0;
            --info-bd: #b7cbd2;
            --nav-accent-fg: #1c2429;
            --title-ok-fg: #9cc4a6;
            --title-warn-fg: #e0b56f;
            --input-border: #988462;
            --ok-fg: #4a6c54;
            --warn-fg: #835d27;
            --err-fg: #a04f45;
            --info-fg: #4d6b78;
            --shadow-sm: 0 1px 2px rgba(58, 74, 82, .10);
            --shadow: 0 3px 10px rgba(58, 74, 82, .12);
            --shadow-lg: 0 12px 34px rgba(35, 45, 50, .22);
            --focus: #3d6b80;
            --nav-focus: #9fd0e4;
        }

        :root[data-theme="dark"] {
            --bg: #283237;
            --surface: #33424a;
            --surface-2: #2e3b41;
            --surface-alt: #38474f;
            --border: #48585f;
            --border-cool: #48585f;
            --divider: #3c4a51;
            --text: #e6ebed;
            --text-strong: #f4f7f8;
            --muted: #bdc9cd;
            --muted-2: #a2afb4;
            --primary: #c4917e;
            --primary-hover: #d4a593;
            --primary-press: #b47e6b;
            --primary-fg: #241c19;
            --primary-soft: #3f3733;
            --sand-soft: #3a3a37;
            --sand-strong: #6d5f4a;
            --selected: rgba(231, 214, 192, .12);
            --nav-bg: #20292e;
            --nav-bg-2: #1c2429;
            --nav-fg: #cdd6da;
            --nav-fg-muted: #8d9ea6;
            --nav-active-bg: rgba(231, 214, 192, .10);
            --nav-active-fg: #f3ede3;
            --nav-accent: #c99a86;
            --title-bg: #1c2429;
            --title-fg: #dfe4e6;
            --ok: #7faa8a;
            --ok-bg: #2b3a33;
            --ok-bd: #3f5a49;
            --warn: #d0a25a;
            --warn-bg: #3a3327;
            --warn-bd: #5c4d31;
            --err: #cc7a6f;
            --err-bg: #3b2b28;
            --err-bd: #5e3f39;
            --info: #7a9dab;
            --info-bg: #293940;
            --info-bd: #3d525b;
            --nav-accent-fg: #1c2429;
            --title-ok-fg: #9cc4a6;
            --title-warn-fg: #e0b56f;
            --input-border: #7d949e;
            --ok-fg: #b0d0b7;
            --warn-fg: #e6c086;
            --err-fg: #edbbb4;
            --info-fg: #b3cbd4;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);
            --shadow: 0 4px 14px rgba(0, 0, 0, .35);
            --shadow-lg: 0 16px 40px rgba(0, 0, 0, .5);
            --focus: #8cc0d6;
            --nav-focus: #9fd0e4;
        }

        /* ============================================================
           BASE  (everything below uses only the token roles above)
           ============================================================ */
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg); color: var(--text); font-size: var(--fs-base); line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        h1, h2, h3, h4 { margin: 0; color: var(--text-strong); font-weight: 600; }
        p { margin: 0; }
        .muted { color: var(--muted); }
        .small { font-size: var(--fs-sm); }
        .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: var(--fs-sm); }
        a { color: var(--primary); }

        /* G3 — scrollbars: 12px, visible thumb with a contrasting track, shown whenever content overflows
           (JavaFX: .scroll-bar { -fx-pref-width: 12 } + .thumb { -fx-background-color: -color-muted-2 }) */
        * { scrollbar-width: auto; scrollbar-color: var(--muted-2) var(--surface-2); }
        ::-webkit-scrollbar { width: 12px; height: 12px; }
        ::-webkit-scrollbar-track { background: var(--surface-2); border-left: 1px solid var(--divider); }
        ::-webkit-scrollbar-thumb { background: var(--muted-2); border-radius: 6px; border: 2px solid var(--surface-2); min-height: 40px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
        .sidebar::-webkit-scrollbar-track { background: var(--nav-bg-2); border: 0; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--nav-fg-muted); border-color: var(--nav-bg-2); }

        /* ============================================================ WINDOW FRAME */
        .window { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .titlebar {
            height: 38px; flex: none; background: var(--title-bg); color: var(--title-fg);
            display: flex; align-items: center; justify-content: space-between; padding: 0 12px; user-select: none; gap: 12px;
        }
        .titlebar .left, .titlebar .right { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .titlebar .left { flex: none; }
        .titlebar .right { flex: 1; justify-content: flex-end; overflow: hidden; }
        /* the run status gives way by priority at narrow widths (TitleBarFitTest) */
        @media (max-width: 1280px) { .runstatus .p3 { display: none; } }
        @media (max-width: 1060px) { .runstatus .p2 { display: none; } }
        .traffic { display: flex; gap: 7px; }
        .traffic i { width: 12px; height: 12px; border-radius: 50%; display: block; }
        .traffic .r { background: #e06c60; } .traffic .y { background: #e6b04b; } .traffic .g { background: #68b05a; }
        .titlebar .app { font-weight: 600; font-size: 12.5px; letter-spacing: .2px; }
        .runstatus { display: flex; align-items: center; gap: 12px; font-size: 12px; white-space: nowrap; overflow: hidden; }
        .runstatus b { color: var(--title-fg); font-weight: 600; }
        .runstatus .ok { color: var(--title-ok-fg); } .runstatus .warn { color: var(--title-warn-fg); }
        .tbtn {
            background: transparent; border: none; color: var(--title-fg); opacity: .85; cursor: pointer;
            font-size: 12px; padding: 4px 8px; border-radius: 6px; display: flex; align-items: center; gap: 5px;
        }
        .tbtn:hover { opacity: 1; background: rgba(255, 255, 255, .08); }
        .conn { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: var(--r-pill); background: rgba(255,255,255,.07); cursor: pointer; }
        .conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--title-ok-fg); }
        .conn.wait i { background: var(--title-warn-fg); }
        .body { flex: 1; display: flex; min-height: 0; }

        /* ============================================================ SIDEBAR NAV */
        .sidebar { width: 236px; flex: none; background: var(--nav-bg); color: var(--nav-fg); display: flex; flex-direction: column; overflow-y: auto; }
        .nav-brand { padding: 14px 16px 10px; display: flex; align-items: center; gap: 10px; }
        .nav-brand .logo { width: 26px; height: 26px; border-radius: 7px; background: var(--cognac); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 13px; }
        .nav-brand .t { font-weight: 600; color: var(--nav-active-fg); font-size: 13.5px; }
        .nav-brand .s { font-size: 12px; color: var(--nav-fg-muted); }
        .nav-group { padding: 8px 10px 2px; }
        .nav-label { font-size: 12px; text-transform: uppercase; letter-spacing: .9px; color: var(--nav-fg-muted); padding: 6px 8px 4px; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; cursor: pointer; color: var(--nav-fg); border-left: 3px solid transparent; margin: 1px 0; font-size: 13px; }
        .nav-item:hover { background: rgba(255, 255, 255, .05); }
        .nav-item.locked { color: var(--nav-fg-muted); opacity: .55; cursor: not-allowed; }
        .nav-item.locked:hover { background: transparent; }
        .nav-item.active { background: var(--nav-active-bg); color: var(--nav-active-fg); border-left-color: var(--nav-accent); font-weight: 600; }
        .nav-item .ico { width: 16px; text-align: center; opacity: .85; }
        .nav-item .step { width: 18px; height: 18px; border-radius: 50%; font-size: 11px; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, .09); color: var(--nav-fg-muted); flex: none; }
        .nav-item.active .step { background: var(--nav-accent); color: var(--nav-accent-fg); font-weight: 700; }
        .nav-item.done .step { background: var(--ok); color: #fff; }
        .nav-hint { font-size: 11.5px; color: var(--nav-fg-muted); padding: 2px 10px 6px 12px; }
        .nav-spacer { flex: 1; }
        .nav-foot { padding: 10px 14px; border-top: 1px solid rgba(255, 255, 255, .07); font-size: 12px; color: var(--nav-fg-muted); display: flex; align-items: center; gap: 8px; }
        .dot-ok { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; }
        .nav-item:focus-visible, .titlebar button:focus-visible { outline: 2px solid var(--nav-focus); outline-offset: 2px; }

        /* ============================================================ MAIN */
        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .toolbar { height: 50px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--border); gap: 12px; }
        .crumbs { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .crumbs b { color: var(--text-strong); font-weight: 600; }
        .content { flex: 1; overflow: auto; padding: 22px 26px 40px; }
        .page-h { font-size: var(--fs-xl); margin-bottom: 4px; }
        .page-sub { color: var(--muted); margin-bottom: 16px; max-width: 900px; }
        .row { display: flex; gap: 16px; align-items: flex-start; }
        .col { flex: 1; min-width: 0; }
        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
        .stack > * + * { margin-top: 14px; }
        .between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .gap8 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .gap4 { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
        .grow { flex: 1; }
        .mt1 { margin-top: 4px; } .mt2 { margin-top: 8px; } .mt3 { margin-top: 12px; } .mt4 { margin-top: 16px; }
        .demo { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; padding: 6px 10px; border: 1px dashed var(--border-cool); border-radius: var(--r); background: var(--surface-alt); font-size: 12px; color: var(--muted); }
        .demo b { color: var(--muted); font-weight: 600; }

        /* ============================================================ CARD */
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); min-width: 0; }
        .card.pad { padding: 14px 16px; }
        .card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px 10px; border-bottom: 1px solid var(--divider); flex-wrap: wrap; }
        .card-h h3 { font-size: 14px; }
        .card-purpose { font-size: 12.5px; color: var(--muted); padding: 8px 16px 0; }
        .card-b { padding: 12px 16px 14px; }
        .card.warm { background: var(--sand-soft); border-color: var(--sand-strong); }

        /* ============================================================ BUTTONS */
        .btn { font: inherit; font-size: 13px; border-radius: var(--r); padding: 6px 12px; cursor: pointer; border: 1px solid transparent; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; line-height: 1.3; }
        .btn:focus-visible, .switch:focus-visible, .seg span:focus-visible, .chip:focus-visible, .input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
        .btn-primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-primary:active { background: var(--primary-press); }
        .btn-secondary { background: var(--surface); color: var(--text); border-color: var(--border-cool); }
        .btn-secondary:hover { background: var(--surface-2); }
        .btn-ghost { background: transparent; color: var(--text); }
        .btn-ghost:hover { background: var(--surface-2); }
        .btn-danger { background: var(--err); color: #fff; }
        .btn-danger-outline { background: transparent; color: var(--err-fg); border-color: var(--err-bd); }
        .btn-danger-outline:hover { background: var(--err-bg); }
        .btn-sm { font-size: 12px; padding: 4px 9px; }
        .btn-lg { font-size: 14px; padding: 8px 16px; }
        .btn[disabled] { opacity: .5; cursor: not-allowed; }
        .btn .spin { width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: rot 1s linear infinite; }
        @keyframes rot { to { transform: rotate(360deg); } }
        .linkbtn { background: none; border: 0; padding: 0; color: var(--primary); cursor: pointer; font: inherit; font-size: 12.5px; }

        /* ============================================================ FORMS */
        label.fld { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-strong); margin-bottom: 4px; }
        .input, select.input, textarea.input { font: inherit; font-size: 13px; width: 100%; padding: 6px 9px; border: 1px solid var(--input-border); border-radius: var(--r); background: var(--surface); color: var(--text); }
        .input:focus { outline: 2px solid var(--focus); outline-offset: 0; }
        .input[disabled] { background: var(--surface-2); color: var(--muted); border-style: dashed; }
        textarea.input { resize: vertical; }
        .input.err-field { border-color: var(--err); }
        .field-err { color: var(--err-fg); font-size: 12px; margin-top: 3px; }
        .field { margin-bottom: 12px; }
        .hint { font-size: 12px; color: var(--muted); margin-top: 3px; }
        .input-group { display: flex; gap: 6px; }
        .seg { display: inline-flex; border: 1px solid var(--border-cool); border-radius: var(--r); overflow: hidden; background: var(--surface); }
        .seg span { padding: 5px 11px; font-size: 12.5px; cursor: pointer; border-right: 1px solid var(--border-cool); user-select: none; }
        .seg span:last-child { border-right: 0; }
        .seg span.on { background: var(--selected); color: var(--text-strong); font-weight: 600; }
        .seg span.dis { color: var(--muted-2); cursor: not-allowed; }
        .seg.warm span.on { background: var(--sand-strong); }
        .switch { width: 34px; height: 19px; border-radius: 999px; background: var(--toggle-off, var(--muted-2)); position: relative; flex: none; cursor: pointer; display: inline-block; vertical-align: middle; }
        .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: #fff; transition: left .12s; }
        .switch.on { background: var(--primary); }
        .switch.on::after { left: 17px; }
        .toggle-row { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; }
        .toggle-row .tx { flex: 1; }
        .toggle-row .tx small { display: block; color: var(--muted); font-size: 12px; }
        .chk { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; }
        input[type=range] { width: 100%; accent-color: var(--primary); }

        /* ============================================================ BADGES · CHIPS · MARKERS */
        .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; padding: 1px 8px; border-radius: var(--r-pill); border: 1px solid var(--border); background: var(--surface-2); color: var(--text); white-space: nowrap; }
        .b-ok { background: var(--ok-bg); border-color: var(--ok-bd); color: var(--ok-fg); }
        .b-warn { background: var(--warn-bg); border-color: var(--warn-bd); color: var(--warn-fg); }
        .b-err { background: var(--err-bg); border-color: var(--err-bd); color: var(--err-fg); }
        .b-info, .b-run { background: var(--info-bg); border-color: var(--info-bd); color: var(--info-fg); }
        .b-sand { background: var(--sand-soft); border-color: var(--sand-strong); color: var(--text); }
        .b-neutral { background: var(--surface-2); }
        .b-dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
        .chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: var(--r-pill); background: var(--sand-soft); border: 1px solid var(--sand-strong); font-size: 12px; }
        .chip .x { cursor: pointer; opacity: .7; }
        /* placeholder token ⟦gN⟧ rendered as a chip (G5, T12) */
        .tok { display: inline-block; font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; padding: 0 5px; margin: 0 1px; border-radius: 4px; background: var(--info-bg); border: 1px solid var(--info-bd); color: var(--info-fg); vertical-align: 1px; }
        /* per-segment state marker (T4, decision 4) — colour + glyph + word, never colour alone */
        .mk { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; white-space: nowrap; padding: 0 7px; border-radius: var(--r-pill); border: 1px solid var(--border); }
        .mk::before { font-size: 10px; }
        .mk.wait { color: var(--muted); background: var(--surface-2); } .mk.wait::before { content: "○"; }
        .mk.run { color: var(--info-fg); background: var(--info-bg); border-color: var(--info-bd); } .mk.run::before { content: "◐"; }
        .mk.done { color: var(--ok-fg); background: var(--ok-bg); border-color: var(--ok-bd); } .mk.done::before { content: "✓"; }
        .mk.flag { color: var(--warn-fg); background: var(--warn-bg); border-color: var(--warn-bd); } .mk.flag::before { content: "⚑"; }
        .mk.fail { color: var(--err-fg); background: var(--err-bg); border-color: var(--err-bd); } .mk.fail::before { content: "✕"; }
        .mk.keep { color: var(--text); background: var(--sand-soft); border-color: var(--sand-strong); } .mk.keep::before { content: "="; }

        /* ============================================================ TABLES (G9: borders, resizable columns) */
        .tbl-wrap { overflow: auto; border: 1px solid var(--border); border-radius: var(--r); }
        table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
        table.tbl th { position: sticky; top: 0; z-index: 1; text-align: left; font-weight: 600; font-size: 12px; color: var(--text-strong); background: var(--surface-2); padding: 6px 10px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); resize: horizontal; overflow: hidden; white-space: nowrap; }
        table.tbl th:last-child { border-right: 0; resize: none; }
        table.tbl th .rz { float: right; color: var(--muted-2); cursor: col-resize; margin-right: -4px; }
        table.tbl td { padding: 6px 10px; border-bottom: 1px solid var(--divider); border-right: 1px solid var(--divider); vertical-align: top; overflow-wrap: anywhere; }
        table.tbl td:last-child { border-right: 0; }
        table.tbl tr:last-child td { border-bottom: 0; }
        table.tbl tr.sel td { background: var(--selected); }
        table.tbl tr.changed td:first-child { box-shadow: inset 3px 0 0 var(--primary); }
        table.tbl td .input { padding: 3px 7px; }
        table.tbl tr.clickable { cursor: pointer; }
        table.tbl tr.clickable:hover td { background: var(--surface-alt); }

        /* ============================================================ LISTS · PROGRESS · TABS · STATS · BANNERS */
        .list { border: 1px solid var(--border); border-radius: var(--r); overflow: auto; background: var(--surface); }
        .li { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 10px; border-bottom: 1px solid var(--divider); cursor: pointer; font-size: 12.5px; }
        .li:last-child { border-bottom: 0; }
        .li:hover { background: var(--surface-alt); }
        .li.sel { background: var(--selected); box-shadow: inset 3px 0 0 var(--primary); }
        .li .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .bar { height: 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--divider); overflow: hidden; }
        .bar > span { display: block; height: 100%; background: var(--primary); border-radius: 999px; }
        .bar.thin { height: 5px; }
        .bar.indet > span { width: 30%; animation: indet 1.4s ease-in-out infinite; }
        @keyframes indet { from { margin-left: -30%; } to { margin-left: 100%; } }
        .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 14px; flex-wrap: wrap; }
        .tab { padding: 7px 14px; cursor: pointer; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }

        .banner { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border-radius: var(--r); border: 1px solid var(--info-bd); background: var(--info-bg); color: var(--text); }

        .banner-err { background: var(--err-bg); border-color: var(--err-bd); } .banner-err .ico { color: var(--err-fg); }

        .kv { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; border-bottom: 1px dashed var(--divider); font-size: 12.5px; }

        .empty { text-align: center; padding: 28px 16px; color: var(--muted); }

        .cover { width: 84px; height: 118px; border-radius: 5px; background: var(--sand-soft); border: 1px solid var(--sand-strong); display: flex; align-items: center; justify-content: center; flex-direction: column; color: var(--muted); font-size: 12px; text-align: center; flex: none; }
        .divider { height: 1px; background: var(--divider); margin: 12px 0; }

        .tag-note { font-size: 11px; color: var(--muted-2); font-family: ui-monospace, Menlo, monospace; }
        .req { font-size: 10.5px; color: var(--info-fg); background: var(--info-bg); border: 1px solid var(--info-bd); border-radius: 4px; padding: 0 4px; font-family: ui-monospace, Menlo, monospace; vertical-align: 1px; }
        .tree .node { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 5px; cursor: pointer; font-size: 12.5px; }
        .tree .node:hover { background: var(--surface-alt); }

        .tree .tw { width: 12px; color: var(--muted); }

        .log { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }

        .log .tm { color: var(--muted); } .log .lv { width: 38px; color: var(--info-fg); } .log .lv.w { color: var(--warn-fg); } .log .lv.e { color: var(--err-fg); }

        /* ============================================================ IMPORT — 3-pane structure browser (I3) */
        .browser { display: grid; grid-template-columns: minmax(200px, 1fr) minmax(280px, 1.5fr) minmax(260px, 1.4fr); height: 430px; border-top: 1px solid var(--divider); }

        .browser > .pane3:last-child { border-right: 0; }
        .pane3 .ph3 { padding: 8px 12px; font-size: 12px; font-weight: 600; color: var(--text-strong); background: var(--surface-2); border-bottom: 1px solid var(--divider); display: flex; justify-content: space-between; gap: 8px; align-items: center; }
        .pane3 .pf { padding: 8px 10px; border-bottom: 1px solid var(--divider); display: flex; gap: 6px; }
        .pane3 .pb3 { flex: 1; overflow: auto; padding: 6px; }
        .segrow { display: grid; grid-template-columns: 74px 1fr auto; gap: 8px; padding: 6px 8px; border-radius: 5px; cursor: pointer; font-size: 12.5px; border-bottom: 1px solid var(--divider); }
        .segrow:hover { background: var(--surface-alt); }
        .segrow.sel { background: var(--selected); }
        .segrow .loc { color: var(--muted); font-size: 11.5px; }
        .segrow .tx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .segrow .meta { display: flex; gap: 4px; align-items: center; }

        /* ============================================================ COMPARE / IO (T3: visual division, borders) */
        .io { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
        .io > div { padding: 8px 10px; border-right: 1px solid var(--border); min-width: 0; }

        .io > .c { border-bottom: 1px solid var(--divider); max-height: 180px; overflow: auto; }
        .io > .c.last { border-bottom: 0; }

        .edit { min-height: 90px; padding: 8px 10px; border: 1px solid var(--input-border); border-radius: var(--r); background: var(--surface); outline: none; }
        .edit.ro { background: var(--surface-2); border-color: var(--border); }

        /* ============================================================ PARSED PROMPT (G5) */
        .msg { border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 8px; background: var(--surface); }
        .msg > .mh { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 5px 10px; background: var(--surface-2); border-bottom: 1px solid var(--border); font-size: 12px; }
        .msg > .mh .role { font-weight: 700; letter-spacing: .6px; font-size: 11px; color: var(--info-fg); }
        .msg > .mh .role.user { color: var(--warn-fg); }

        details.sec { border-bottom: 1px dashed var(--divider); padding: 4px 0; }
        details.sec:last-child { border-bottom: 0; }
        details.sec > summary { cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--text-strong); list-style: none; display: flex; gap: 6px; align-items: center; }
        details.sec > summary::before { content: "▸"; color: var(--muted); font-size: 10px; }
        details.sec[open] > summary::before { content: "▾"; }
        details.sec > summary .cnt { font-weight: 400; color: var(--muted); font-size: 12px; }
        details.sec ul { margin: 4px 0 4px 18px; padding: 0; font-size: 12.5px; }
        details.sec .secbody { padding: 4px 0 4px 14px; font-size: 12.5px; }
        .raw { white-space: pre-wrap; font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r); padding: 8px 10px; max-height: 260px; overflow: auto; margin: 0; }

        /* ============================================================ DIALOGS (G1: in-window modal, ≤ 90% of window) */
        .scrim { position: fixed; inset: 0; background: rgba(28, 36, 41, .45); display: none; align-items: center; justify-content: center; z-index: 50; padding: 4vh 4vw; }
        .scrim.show { display: flex; }
        .dialog { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow-lg); width: 480px; max-width: 100%; max-height: 92vh; display: flex; flex-direction: column; border: 1px solid var(--border); min-height: 0; }
        .dialog.wide { width: 720px; }
        .dialog.xl { width: min(1180px, 92vw); height: min(820px, 90vh); }
        .dialog-h { display: flex; gap: 12px; align-items: flex-start; padding: 16px 18px 12px; border-bottom: 1px solid var(--divider); flex: none; }
        .dialog-h .di { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex: none; font-weight: 700; }
        .di.ok { background: var(--ok-bg); color: var(--ok-fg); } .di.warn { background: var(--warn-bg); color: var(--warn-fg); }
        .di.err { background: var(--err-bg); color: var(--err-fg); } .di.info { background: var(--info-bg); color: var(--info-fg); }
        .di.brand { background: var(--primary-soft); color: var(--primary); }
        .dialog-h h3 { font-size: 16px; }
        .dialog-h .sub { color: var(--muted); font-size: 12.5px; }
        .dialog-h .x { margin-left: auto; }
        .dialog-b { padding: 14px 18px; overflow: auto; flex: 1; min-height: 0; }
        .dialog-f { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--divider); flex: none; }
        .dialog-f .left { margin-right: auto; display: flex; gap: 8px; align-items: center; }

        /* G4 — the shared progress dialog */
        .pd-head { padding: 10px 18px 12px; border-bottom: 1px solid var(--divider); flex: none; }
        .pd-head .figs { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
        .pd-head .figs b { color: var(--text-strong); font-weight: 600; }
        .pd-body { flex: 1; display: grid; grid-template-columns: 290px 1fr; min-height: 0; }
        .pd-list { border-right: 1px solid var(--divider); overflow: auto; min-height: 0; }
        .pd-list .li { align-items: flex-start; flex-direction: column; gap: 3px; }
        .pd-list .li .top { display: flex; width: 100%; justify-content: space-between; gap: 8px; align-items: center; }
        .pd-list .li .res { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
        .pd-list .group { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); padding: 8px 10px 4px; background: var(--surface-alt); border-bottom: 1px solid var(--divider); }
        .pd-detail { overflow: auto; padding: 12px 16px; min-height: 0; }
