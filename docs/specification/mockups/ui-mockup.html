        .pd-detail .state { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
        .info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 14px; font-size: 12.5px; margin: 10px 0; }
        .info-grid div span { display: block; font-size: 11.5px; color: var(--muted); }
        .clockbar { width: 120px; display: inline-block; vertical-align: middle; }

        /* review desk (decision 5) */
        .rv-body { flex: 1; display: grid; grid-template-columns: 300px 1fr; min-height: 0; }

        /* ============================================================ TOASTS (G2: bottom-right stack) */
        .toasts { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 60; width: 360px; max-width: calc(100vw - 36px); }
        .toast { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--info); border-radius: var(--r); box-shadow: var(--shadow); animation: tin .18s ease-out; }
        @keyframes tin { from { transform: translateX(20px); opacity: 0; } to { transform: none; opacity: 1; } }
        .toast .tb { flex: 1; } .toast .tt { font-weight: 600; font-size: 13px; } .toast .td { font-size: 12.5px; color: var(--muted); }
        .toast .tx { cursor: pointer; color: var(--muted); }
        .fnote { font-size: 12.5px; margin-right: auto; padding-left: 8px; }
        .fnote.ok { color: var(--ok-fg); } .fnote.warn { color: var(--warn-fg); } .fnote.err { color: var(--err-fg); } .fnote.info { color: var(--info-fg); }
        .toast.ok { border-left-color: var(--ok); } .toast.warn { border-left-color: var(--warn); } .toast.err { border-left-color: var(--err); }

        .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
        .sw { width: 150px; border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; background: var(--surface); }
        .sw .c { height: 44px; } .sw .m { padding: 6px 8px; font-size: 12px; } .sw .m b { display: block; }
        .tt-bub { display: inline-block; background: var(--charcoal); color: #f3ede3; font-size: 12px; padding: 4px 8px; border-radius: 5px; }


        /* ============================================================
           LAYOUT LAYER (final review, L1–L8) — mirrors the JavaFX LayoutClass helper:
           width classes come from the CONTENT width (not the window), with 16 px hysteresis:
           compact < 1040 · regular 1040–1439 · wide ≥ 1440.  JS sets .lc-compact / .lc-regular / .lc-wide on .main.
           ============================================================ */
        .sidebar { width: 236px; }
        @media (max-width: 1199px) { .sidebar { width: 200px; } }          /* window < 1200: narrower nav (no rail) */
        /* pinned banner slot between the toolbar and the scrolling content (L2) */
        .banner-slot { flex: none; padding: 0 20px; background: var(--surface); }
        .banner-slot:empty { display: none; }
        .banner-slot .banner { margin: 10px 0; }
        .toolbar .crumbs { min-width: 0; }
        .toolbar #toolbarActions { flex-wrap: nowrap; }
        .lc-compact .toolbar .btn .lbl-long { display: none; }              /* "‹ Back" instead of "‹ Back to Names & style" */
        .toolbar .btn .lbl-short { display: none; }
        .lc-compact .toolbar .btn .lbl-short { display: inline; }
        /* content caps (L3): form/list screens 1320 px, prose 680 px; dashboards (Translating) use the full width */
        .page { max-width: 1320px; }
        .page.full { max-width: none; }
        .prose { max-width: 680px; }
        .w-num { width: 120px !important; } .w-name { max-width: 360px; } .w-url { max-width: 640px; } .w-model { max-width: 480px; }
        /* two-column card layouts collapse by the region's own width (TwoColumns), here: compact → one column */
        .lc-compact .row { flex-direction: column; } .lc-compact .row > .col { width: 100%; }
        .lc-compact .grid2.collapse { grid-template-columns: 1fr; }
        .lc-compact .stats { grid-template-columns: 1fr 1fr; }
        /* links: always underlined, --info-fg passes 4.5:1 on every surface (L7) */
        a, .linkbtn { color: var(--info-fg); text-decoration: underline; text-underline-offset: 2px; }
        /* selected segment: a 2 px bar in --text-strong (≥ 3:1 against --selected in both themes) besides the fill */
        .seg span.on { box-shadow: inset 0 -2px 0 var(--text-strong); }
        /* fill-the-window screens (Translating, Import browser, Names tables) — AppShellView "fills-viewport" opt-out */
        .content.fill { display: flex; flex-direction: column; }
        .content.fill > .page { flex: 1; display: flex; flex-direction: column; min-height: 520px; }
        .grow-card { flex: 1; display: flex; flex-direction: column; min-height: 460px; overflow: hidden; }
        .grow-card > .card-b { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        /* Translating: summary strip (C1) */
        .strip { display: grid; grid-template-columns: 1fr auto; gap: 6px 18px; align-items: center; padding: 12px 16px; }
        .strip .left-big { font-size: 18px; font-weight: 600; color: var(--text-strong); }
        .strip .facts { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
        .strip .facts b { color: var(--text-strong); font-weight: 600; }
        .strip .bar { grid-column: 1 / -1; }
        /* live panel = list | detail split that fills the height (C1); the split never stacks */
        .split { display: grid; grid-template-columns: minmax(240px, 34%) 1fr; flex: 1; min-height: 300px; border-top: 1px solid var(--divider); }
        .split > .side { border-right: 1px solid var(--divider); overflow: auto; min-height: 0; }
        .split > .main-pane { overflow: auto; padding: 12px 14px; min-height: 0; }
        .split .list { border: 0; border-radius: 0; }
        .lc-compact .split { grid-template-columns: 240px 1fr; }
        .callline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 14px; font-size: 12.5px; }
        /* Detailed: Input | Output side by side when the detail is wide, tabs when narrow (< 760 px) */
        .io-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
        .lc-compact .io-pair { grid-template-columns: 1fr; }
        /* clock bar: its own small layout box so a tick never re-lays out the panel */
        .clockbar { display: inline-block; width: 90px; vertical-align: middle; }
        .clockbar .bar { height: 5px; }
        /* Settings: master | detail never stacks; the form column is capped and its footer is pinned (H1) */
        .settings-wrap { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 16px; align-items: start; }
        .lc-compact .settings-wrap { grid-template-columns: 200px minmax(0, 1fr); }
        .form-card { display: flex; flex-direction: column; min-height: 0; height: 100%; }
        .settings-fill { flex: 1; min-height: 380px; display: flex; flex-direction: column; }
        .settings-fill .settings-wrap { flex: 1; min-height: 0; align-items: stretch; }
        .settings-fill .settings-wrap > .card:first-child { align-self: start; }
        .form-card > .card-b { overflow: auto; flex: 1; }
        .form-foot { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--divider); background: var(--surface); border-radius: 0 0 var(--r-lg) var(--r-lg); }
        .form-foot .dirty { margin-right: auto; font-size: 12.5px; color: var(--warn-fg); }
        .fold { border: 1px solid var(--border); border-radius: var(--r); margin-top: 12px; }
        .fold > summary { padding: 9px 12px; cursor: pointer; font-weight: 600; list-style: none; display: flex; gap: 8px; align-items: center; }
        .fold > summary::before { content: "▸"; color: var(--muted); font-size: 11px; }
        .fold[open] > summary::before { content: "▾"; }
        .fold > .fold-b { padding: 4px 12px 12px; }
        .summary-card { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 14px; border: 1px solid var(--ok-bd); background: var(--ok-bg); border-radius: var(--r); }
        .summary-card.bad { border-color: var(--err-bd); background: var(--err-bg); }
        /* Names: two term cards side by side only when regular or wide; tables fill the height */
        .terms-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; flex: 1; min-height: 0; }
        .lc-compact .terms-grid, .lc-regular .terms-grid { grid-template-columns: 1fr; }   /* side by side only when wide (≥ 1440 px of content) */
        .terms-grid .card { display: flex; flex-direction: column; min-height: 320px; }
        .terms-grid .tbl-wrap { flex: 1; min-height: 160px; }
        /* Import: browser fills the remaining height (min 360) */
        .browser { height: auto; flex: 1; min-height: 360px; grid-template-columns: minmax(160px, 1fr) minmax(240px, 1.5fr) minmax(220px, 1.4fr); }
        .lc-compact .browser { grid-template-columns: minmax(160px, 1fr) minmax(240px, 1.6fr); grid-template-rows: 1fr 200px; }
        .lc-compact .browser > .pane3:last-child { grid-column: 1 / -1; border-top: 1px solid var(--divider); border-right: 0; }
        /* Review desk: editors | tabs in a vertical split that grows with the dialog (F1) */
        .rv-detail { display: flex; flex-direction: column; min-height: 0; overflow: hidden; padding: 0; }
        .rv-editors { flex: 1 1 45%; min-height: 150px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 16px; overflow: auto; }
        .rv-editors textarea, .rv-editors .edit { height: 100%; min-height: 110px; resize: none; font: inherit; font-size: 13.5px; line-height: 1.55; }
        .rv-tabs { flex: 1 1 55%; min-height: 140px; overflow: auto; padding: 0 16px 12px; border-top: 1px solid var(--divider); }
        .rv-divider { height: 6px; cursor: row-resize; background: var(--surface-2); border-top: 1px solid var(--divider); border-bottom: 1px solid var(--divider); flex: none; }
        .tokstrip { font-size: 12px; margin-top: 4px; }
        .menu { position: relative; display: inline-block; }
        .menu > .menu-list { display: none; position: absolute; bottom: 110%; right: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); min-width: 230px; z-index: 5; padding: 4px; }
        .menu.open > .menu-list { display: block; }
        .menu-list button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 7px 10px; border-radius: 5px; font: inherit; font-size: 13px; color: var(--text); cursor: pointer; }
        .menu-list button:hover { background: var(--surface-2); }
        .menu-list .sub { display: block; font-size: 11.5px; color: var(--muted); }
        .inline-panel { border: 1px solid var(--info-bd); background: var(--info-bg); border-radius: var(--r); padding: 10px 12px; margin: 0 16px 10px; }
        /* progress dialog: fixed height so the footer never moves (E1) */
        .dialog.xl { height: min(820px, 90vh); }
        .pd-body { grid-template-columns: minmax(220px, 30%) 1fr; }
        .say { font-size: 13.5px; padding: 8px 10px; border-left: 3px solid var(--info); background: var(--surface-alt); border-radius: 0 var(--r) var(--r) 0; margin-bottom: 10px; }
        /* activity chip for hidden work (E1) */
        .actchip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: var(--r-pill); background: rgba(255,255,255,.12); cursor: pointer; font-size: 12px; }
        .actchip .bar { width: 46px; height: 5px; display: inline-block; background: rgba(255,255,255,.18); border: 0; }
        .actchip .bar > span { background: var(--title-ok-fg); }
        /* how-it-works list on the empty Projects screen */
        .steps-how { counter-reset: s; list-style: none; padding: 0; margin: 12px auto; max-width: 520px; text-align: left; }
        .steps-how li { counter-increment: s; display: flex; gap: 10px; padding: 6px 0; }
        .steps-how li::before { content: counter(s); width: 22px; height: 22px; border-radius: 50%; background: var(--primary-soft); color: var(--text-strong); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex: none; }
        .readonly-note { font-size: 12.5px; }
        @media (max-width: 1100px) { .grid3 { grid-template-columns: 1fr 1fr; } }
        .conn.idle i { background: var(--nav-fg-muted); }
        .conn.bad i { background: var(--err); box-shadow: 0 0 0 2px rgba(255,255,255,.25); }
        table.tbl.ro th { resize: none; }
    </style>
</head>
<body>
<div class="window">
    <!-- TITLE BAR — AppShellView #shell-title-bar: product name · activity chip (hidden work) · run status (RunStatusBar) · theme · About -->
    <div class="titlebar">
        <div class="left">
            <div class="traffic"><i class="r"></i><i class="y"></i><i class="g"></i></div>
            <span class="app">BookLoom</span>
            <span id="actChip"></span>
        </div>
        <div class="right">
            <div class="runstatus" id="runStatus"></div>
            <button class="tbtn" id="themeBtn" onclick="toggleTheme()">◐ Dark</button>
            <button class="tbtn" onclick="openDialog('about')">ⓘ About</button>
        </div>
    </div>

    <div class="body">
        <!-- SIDEBAR — NavColumn: brand · workflow steps (locked until a project is open, G6) · Settings · AI-model footer -->
        <div class="sidebar">
            <div class="nav-brand">
                <div class="logo">BL</div>
                <div><div class="t">BookLoom</div><div class="s">offline translator</div></div>
            </div>
            <div class="nav-group"><div class="nav-label">Workflow</div><div id="navWorkflow"></div></div>
            <div class="nav-group"><div class="nav-label">Application</div><div id="navApp"></div></div>
            <div class="nav-group"><div class="nav-label">Mockup reference</div><div id="navRef"></div><div class="nav-hint">Not shipped — design sheets only.</div></div>
            <div class="nav-spacer"></div>
            <div class="nav-foot" id="navFoot" title="The AI model every translation request goes to — the one network destination"></div>
        </div>

        <!-- MAIN — toolbar (breadcrumb + the step's actions, always visible) · pinned banner slot · scrolling content -->
        <div class="main" id="main">
            <div class="toolbar">
                <div class="crumbs" id="crumbs"></div>
                <div class="gap8" id="toolbarActions"></div>
            </div>
            <div class="banner-slot" id="bannerSlot"></div>
            <div class="content" id="content"></div>
        </div>
    </div>
</div>

<!-- BusyHost layer: progress dialogs for model work (G4/E1). Below ModalHost, so a question or error opens above it without losing it. -->
<div class="scrim" id="workScrim" style="z-index:45"><div id="workHost"></div></div>
<!-- ModalHost: one in-window modal at a time, scrim keeps focus (G1) -->
<div class="scrim" id="scrim" onclick="if(event.target===this && DLG_SOFT.has(curDialog))closeDialog()"><div id="modalHost"></div></div>
<!-- ToastStack: bottom-right, newest at the bottom (G2) -->
<div class="toasts" id="toasts"></div>

<script>
/* ============================================================ STATE (demo switches) */
const ST = {
    projectOpen: true,          // G6: false locks steps 1–5
    projects: 'list',           // list | empty
    model: 'found',             // first launch: found | none (looked for once, automatically — owner decision 13)
    importState: 'ok',          // ok | inspecting | known | mismatch | drm | corrupt | unsupported
    run: 'running',             // see RUN below
    liveMode: 'simple', liveTab: 'live', autoShow: true, liveSel: 1, liveManual: false,
    providerKind: 'ollama', providerAuth: 'none', customHeaders: false, customModels: false, dirty: false, connOpen: false,
    tech: false,
    temp: 'app',                // Models › Temperature: app | mine | none
    refused: false,             // demo: a model that refused some settings                // Settings › Appearance › Show technical details: every Simple view opens as Detailed
    exported: false,
    settingsTab: 'providers',
    namesEmpty: false,
    hidden: null,               // a progress dialog continued in the background: {id, label, pct, screen}
    helpClosed: false,
};
/* ============================================================ SAMPLE DATA FIXTURE (A) — every figure comes from here
   Field names follow the view models (RunFigures / TranslatingFigures) so conformance tests can reuse them. */
const D = {
    book: 'Earth Gravity: A Practical Introduction', file: 'earth-gravity.md', fmt: 'Markdown', chapters: 5, words: '4,100',
    provider: 'Ollama', model: 'gemma4:e4b', dial: 'Balanced', mode: 'Unattended',
    total: 142, kept: 20, autoAccepted: 36, repaired: 12, flagged: 6,           // decided = kept + auto + repaired + flagged = 74
    get decided() { return this.kept + this.autoAccepted + this.repaired + this.flagged; },
    get left() { return this.total - this.decided; },
    steps: {draft: [142, 74], review: [122, 54], repair: [12, 12]},             // planned, done — G10
    get stepsTotal() { return Object.values(this.steps).reduce((a, [p]) => a + p, 0); },
    get stepsDone() { return Object.values(this.steps).reduce((a, [, d]) => a + d, 0); },
    get pct() { return Math.round(100 * this.stepsDone / this.stepsTotal); },
    reviewed: 0, exportFixes: 3,
    elapsed: '1 h 12 min', timeLeft: 'about 1 h 10 min', took: '2 h 25 min', speed: '9.4 tok/s', estimate: 'about 2 h 30 min',
    chapter: 'Chapter 2 of 5', call: 42,
};
console.assert(D.decided === 74 && D.left === 68 && D.stepsTotal === 276 && D.stepsDone === 140, 'fixture sums');

const WORKFLOW = [
    {id: 'projects', t: 'Projects', ico: '▤'},
    {id: 'import', t: 'Import book', step: 1},
    {id: 'brief', t: 'Book Brief', step: 2},
    {id: 'names', t: 'Names & style', step: 3},
    {id: 'translating', t: 'Translating', step: 4},
    {id: 'export', t: 'Export', step: 5},
];
const APPNAV = [{id: 'settings', t: 'Settings', ico: '⚙'}];
const REF = [{id: 'components', t: 'Component library', ico: '◈'}, {id: 'dialogs', t: 'Dialogs', ico: '▭'}, {id: 'toasts_ref', t: 'Notifications', ico: '◔'}, {id: 'runstates', t: 'Run states', ico: '▦'}];
const STEPS = WORKFLOW.filter(w => w.step);
const DONE = new Set(['import', 'brief', 'names']);
let current = 'translating';

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
/* ⟦gN⟧ → token chip — only in detail panes (G5); one-line rows use plain marks (toksPlain) */
const toks = s => esc(s).replace(/⟦([a-z]?)(\d+)⟧/g, '<span class="tok" title="A formatting mark (bold, link…) kept exactly">$2</span>');
const toksPlain = s => esc(s).replace(/⟦([a-z]?)(\d+)⟧/g, '');
const markText = s => s.replace(/⟦[a-z]?(\d+)⟧/g, '⟦$1⟧');
/* state marker = icon + word (G, Ikonli in the app); one colour per meaning: blue working · green done · amber needs you · red failed · grey waiting · sand kept */
const MK = {wait: 'waiting', run: 'translating…', done: 'translated', flag: 'to review', fail: 'translated again alone', keep: 'kept as is', ok: 'done', cancel: 'cancelled'};
const mk = (kind, word) => `<span class="mk ${kind === 'ok' ? 'done' : kind === 'cancel' ? 'wait' : kind}">${word || MK[kind]}</span>`;
const req = (...ids) => ids.map(i => `<span class="req" title="Requirement ${i} — see README">${i}</span>`).join(' ');
const sw = (on, extra = '') => `<span class="switch ${on ? 'on' : ''}" tabindex="0" role="switch" ${extra}></span>`;
const seg = (opts, on, extra = '') => `<span class="seg" ${extra}>${opts.map((o, i) => `<span class="${i === on ? 'on' : ''}" tabindex="0">${o}</span>`).join('')}</span>`;
const demo = html => `<div class="demo"><b>Mockup preview ·</b> ${html}</div>`;
const demoSeg = (opts, val, fn) => `<span class="seg">${opts.map(([v, t]) => `<span class="${v === val ? 'on' : ''}" onclick="${fn}('${v}')">${t}</span>`).join('')}</span>`;
const isRunning = () => ['running', 'stuck', 'pausing', 'stopping'].includes(ST.run);
const busyModel = () => isRunning() || !!ST.hidden;   // one model request at a time (single-flight, N-7)
const hasProgress = () => !['ready', 'cannot'].includes(ST.run);
const isFinished = () => ['finished', 'finishednone'].includes(ST.run);

/* ============================================================ LAYOUT CLASS (L1) — from the content width, 16 px hysteresis */
let LC = 'regular';
function layoutClass() {
    const w = $('#main').clientWidth, h = 16;
    const next = LC === 'compact' ? (w >= 1040 + h ? (w >= 1440 ? 'wide' : 'regular') : 'compact')
        : LC === 'wide' ? (w < 1440 - h ? (w < 1040 ? 'compact' : 'regular') : 'wide')
        : (w < 1040 - h ? 'compact' : w >= 1440 + h ? 'wide' : 'regular');
    if (next !== LC || !$('#main').classList.contains('lc-' + next)) { LC = next; $('#main').className = 'main lc-' + LC; document.body.classList.toggle('lc-compact-dlg', window.innerWidth < 1100); }
}
new ResizeObserver(layoutClass).observe(document.documentElement);

/* ============================================================ NAV */
function navItem(it) {
    const locked = it.step && !ST.projectOpen;
    const done = DONE.has(it.id) && ST.projectOpen && it.id !== current;
    const cls = ['nav-item', it.id === current ? 'active' : '', done ? 'done' : '', locked ? 'locked' : ''].join(' ');
    const lead = it.step ? `<span class="step">${done ? '✓' : it.step}</span>` : `<span class="ico">${it.ico}</span>`;
    const tip = locked ? 'Open or create a project first — the workflow steps work on the open project.' : '';
    return `<div class="${cls}" tabindex="0" title="${tip}" onclick="${locked ? "toast('info','Open a project first','Pick one in Projects, or start a new translation.')" : `go('${it.id}')`}">${lead}<span>${it.t}</span></div>`;
}
function buildNav() {
    $('#navWorkflow').innerHTML = navItem(WORKFLOW[0]) + STEPS.map(navItem).join('') + (ST.projectOpen ? '' : `<div class="nav-hint">Steps unlock when a project is open.</div>`);
    $('#navApp').innerHTML = APPNAV.map(navItem).join('');
    $('#navRef').innerHTML = REF.map(navItem).join('');
}
function crumbs(id) {
    const w = WORKFLOW.find(x => x.id === id);
    if (w && w.step) return `Workflow / <b>${w.t}</b> · step ${w.step} of 5`;
    if (w) return `Workflow / <b>${w.t}</b>`;
    const a = [...APPNAV, ...REF].find(x => x.id === id);
    return `${APPNAV.includes(a) ? 'Application' : 'Mockup reference'} / <b>${a ? a.t : id}</b>`;
}
/* toolbar = the one action bar (L2): navigation on the left of the group, the step's main action last.
   Long labels shorten in compact ("‹ Back"); the full label is the tooltip. */
const back = (to, t) => `<button class="btn btn-ghost" title="Back to ${t}" onclick="go('${to}')">‹ <span class="lbl-long">Back to ${t}</span><span class="lbl-short">Back</span></button>`;
const RUNBTNS = () => {
    const r = RUN[ST.run];
    return (r.tb || []).map(b => TB[b]()).join('');
};
const TB = {
    start: () => `<button class="btn btn-primary" onclick="setRun('running')" title="Starts translating the book">▶ Start translation</button>`,
    startOff: () => `<button class="btn btn-primary" disabled title="Choose an AI model in Settings first">▶ Start translation</button>`,
    cont: () => `<button class="btn btn-primary" onclick="setRun('running')" title="Continues at the first segment not done">▶ Continue translation</button>`,
    pause: () => `<button class="btn btn-primary" onclick="setRun('paused')" title="Take a break. The segments being translated now are translated again when you resume.">⏸ Pause</button>`,
    pauseWait: () => `<button class="btn btn-secondary" onclick="setRun('pausedErr')" title="Stop trying by itself — stay paused until you resume">⏸ Pause</button>`,
    pauseOff: () => `<button class="btn btn-primary" disabled title="Pausing…">⏸ Pause</button>`,
    stopOff: () => `<button class="btn btn-secondary" disabled>■ Stop</button>`,
    resume: () => `<button class="btn btn-primary" onclick="setRun('running')" title="Continue where the translation paused">▶ Resume</button>`,
    retry: () => `<button class="btn btn-primary" onclick="setRun('running')">↻ Try again now</button>`,
    stop: () => `<button class="btn btn-secondary" onclick="openDialog('confirmStop')" title="End translating for now — for example, to close the project. Finished segments are saved; Continue translation picks up later.">■ Stop</button>`,
    review: () => `<button class="btn btn-secondary" onclick="openDialog('review')" title="Opens the review desk">Review (${D.flagged})</button>`,
    export: () => `<button class="btn btn-primary" onclick="go('export')">Continue to Export ›</button>`,
};
const ACTIONS = {
    import: () => `<button class="btn btn-primary" onclick="go('brief')">Continue to Book Brief ›</button>`,
    brief: () => `${back('import', 'Import')}<button class="btn btn-primary" onclick="go('names')">Continue to Names &amp; style ›</button>`,
    names: () => `${back('brief', 'Book Brief')}${ST.hidden ? `<button class="btn btn-primary" disabled title="Wait until the names pass ends">▶ Start translation</button>` : hasProgress() ? `<button class="btn btn-primary" onclick="go('translating')">Go to Translating ›</button>` : `<button class="btn btn-primary" onclick="startRun()">▶ Start translation</button>`}`,
    translating: () => `${back('names', 'Names & style')}${RUNBTNS()}`,
    export: () => `${back('translating', 'Translating')}${!hasProgress() ? `<button class="btn btn-primary" disabled title="Nothing is translated yet">⬇ Export book</button>` : ST.exported ? `<button class="btn btn-secondary">Open folder</button><button class="btn btn-primary">Open book</button>` : isRunning() ? `<button class="btn btn-primary" disabled title="Pause or stop the translation to export">⬇ Export book</button>` : `<button class="btn btn-primary" onclick="openWork('exportRun')">⬇ Export book</button>`}`,
    projects: () => ST.projects === 'list' ? `<button class="btn btn-primary" onclick="newProject()">＋ New translation</button>` : '',
};
const FILL = new Set(['translating', 'import', 'names', 'settings']);   // AppShellView "fills-viewport" screens
function go(id) {
    if (WORKFLOW.find(w => w.id === id && w.step) && !ST.projectOpen) return;
    current = id;
    buildNav();
    $('#crumbs').innerHTML = crumbs(id);
    $('#toolbarActions').innerHTML = (ACTIONS[id] || (() => ''))();
    $('#content').className = 'content' + (FILL.has(id) ? ' fill' : '');
    $('#content').innerHTML = S[id]();
    $('#content').scrollTop = 0;
    renderRunStatus();
    renderBanners();
    (AFTER[id] || (() => {}))();
    layoutClass();
}
const AFTER = {};
function rerender() { const t = $('#content').scrollTop; go(current); $('#content').scrollTop = t; }
function newProject() { ST.projectOpen = true; DONE.clear(); ST.run = 'ready'; go('import'); toast('ok', 'Project created', 'Import a book to start.'); }

/* ============================================================ RUN STATES (A) — one row per state; README "Run states" mirrors it.
   code = RunState (+ recovery / call detail) · title = title-bar text · chip = connection chip [class, text] · tb = toolbar buttons
   banner = pinned banner (shown on every screen) · line = live panel line in Simple · inCall = marker of the segments of the current call */
const RUN = {
    ready:        {code: 'IDLE', title: 'Ready', chip: ['', 'AI model ready'], tb: ['start'], line: 'Nothing translated yet.', inCall: 'wait', clock: false},
    cont:         {code: 'IDLE · stored progress', title: `Ready · ${D.pct} % done`, chip: ['', 'AI model ready'], tb: ['cont', 'review'], banner: ['info', '↺', `Welcome back — ${D.decided} of ${D.total} segments are done.`, 'Continue translation picks up at Chapter 2, segment 5.', []], line: 'Continues at Chapter 2, segment 5.', inCall: 'wait'},
    cannot:       {code: 'IDLE · MissingInput', title: 'Ready', chip: ['bad', 'No AI model'], tb: ['startOff'], banner: ['err', '⛔', 'Cannot start yet — no AI model is chosen.', 'Choose one in Settings › Providers, or let BookLoom find it.', [['Open settings', "go('settings')"]]], line: '—', inCall: 'wait'},
    running:      {code: 'RUNNING', title: `${D.pct} % done · ${D.timeLeft} left`, chip: ['', 'Model answering'], tb: ['pause', 'stop', 'review'], line: 'Now translating: Chapter 2, segments 5–8', inCall: 'run', clock: true},
    pausing:      {code: 'PAUSING', title: 'Pausing…', chip: ['', 'Model answering'], tb: ['pauseOff', 'stop'], line: 'Pausing… segments 5–8 are translated again when you resume.', inCall: 'run'},
    stopping:     {code: 'STOPPING', title: 'Stopping…', chip: ['', 'Model answering'], tb: ['pauseOff', 'stopOff'], line: 'Stopping… segments 5–8 are translated next time.', inCall: 'run'},
    paused:       {code: 'PAUSED', title: `Paused at ${D.pct} %`, chip: ['idle', 'Model idle'], tb: ['resume', 'stop', 'review'], line: 'Paused. Segments 5–8 are translated again when you resume.', inCall: 'wait'},
    waitprov:     {code: 'PAUSED + recovery waiting', title: `Waiting for ${D.provider}`, chip: ['bad', `Cannot reach ${D.provider}`], tb: ['pauseWait', 'stop'], banner: ['err', '⛔', `BookLoom cannot reach ${D.provider}`, `Is the ${D.provider} app open? BookLoom tries again by itself in 0:12.`, [['Try again now', "setRun('running')"], ['Skip these 4 segments', "toast('info','4 segments skipped','They stay untranslated and wait for your review.')"], ['Open settings', "go('settings')"]]], line: `Waiting for ${D.provider}. Segments 5–8 are sent again when it answers.`, inCall: 'wait'},
    pausedErr:    {code: 'PAUSED · recovery held', title: `Paused at ${D.pct} %`, chip: ['bad', `Cannot reach ${D.provider}`], tb: ['resume', 'stop'], banner: ['warn', '⏸', `Paused. ${D.provider} could not be reached.`, `Open ${D.provider}, then press Resume.`, [['Open settings', "go('settings')"]]], line: 'Paused. Segments 5–8 are translated again when you resume.', inCall: 'wait'},
    gaveup:       {code: 'PAUSED · recovery gave up', title: `Paused at ${D.pct} %`, chip: ['bad', `${D.provider}: no answer for 12 h`], tb: ['retry', 'stop'], banner: ['err', '⛔', `${D.provider} has not answered for 12 hours`, `BookLoom stopped trying by itself. Open ${D.provider}, then press Try again now.`, [['Try again now', "setRun('running')"]]], line: 'Paused. Segments 5–8 are translated again when you resume.', inCall: 'wait'},
    modelmissing: {code: 'PAUSED · model unloaded', title: `Paused at ${D.pct} %`, chip: ['bad', 'Model missing'], tb: ['retry', 'stop'], banner: ['err', '⛔', `The AI model ${D.model} is not available`, `Open ${D.provider} and check that the model is installed, then press Try again now.`, [['Try again now', "setRun('running')"], ['Choose another model…', "go('settings')"]]], line: 'Paused. Segments 5–8 are translated again when you resume.', inCall: 'wait'},
    stuck:        {code: 'RUNNING · call past its usual time', title: `${D.pct} % done · ${D.timeLeft} left`, chip: ['slow', 'No answer for 3:40'], tb: ['pause', 'stop', 'review'], banner: ['warn', '⏳', 'The model is taking longer than usual (3:40)', 'BookLoom tries again by itself at 6:00. You do not need to do anything.', [['Try again now', "setRun('running')"], ['Skip these 4 segments', "toast('info','4 segments skipped','They stay untranslated and wait for your review.')"]]], line: 'The model is taking longer than usual with segments 5–8.', inCall: 'run', clock: true},
    stopped:      {code: 'STOPPED', title: `Stopped at ${D.pct} %`, chip: ['idle', 'Model idle'], tb: ['cont', 'review'], line: 'Stopped. Continues at Chapter 2, segment 5.', inCall: 'wait'},
    finished:     {code: 'COMPLETED', title: 'Finished', chip: ['idle', 'Model idle'], tb: ['review', 'export'], banner: ['ok', '✓', `Translation finished. ${D.flagged} segments need your review.`, 'You can export the book now and review later.', [[`Review ${D.flagged} segments`, "openDialog('review')"]]], line: 'All segments translated.', inCall: 'done'},
    finishednone: {code: 'COMPLETED · 0 flagged', title: 'Finished', chip: ['idle', 'Model idle'], tb: ['export'], banner: ['ok', '✓', 'Translation finished. Nothing needs your review.', '', []], line: 'All segments translated.', inCall: 'done'},
    failed:       {code: 'FAILED', title: 'Did not finish', chip: ['bad', 'Error'], tb: ['cont', 'review'], banner: ['err', '⛔', 'The translation stopped because of an error.', 'Finished segments are saved.', [['Show details', "openDialog('err')"]]], line: 'Stopped by an error at Chapter 2, segment 5.', inCall: 'wait'},
};
function setRun(v) {
    ST.run = v;
    if (current === 'translating' || current === 'export' || current === 'brief' || current === 'names') rerender(); else { renderRunStatus(); renderBanners(); $('#toolbarActions').innerHTML = (ACTIONS[current] || (() => ''))(); }
    if (v === 'finished') setTimeout(() => openWhenFree('review'), 350);   // the desk opens by itself (decision 5)
}
function startRun() { DONE.add('names'); setRun('running'); go('translating'); toast('info', 'Translation started', 'Progress is saved as it goes — you can close the app and continue later.'); }

/* RunStatusBar — title text · chip · elapsed / speed (give way by priority) */
function renderRunStatus() {
    const r = RUN[ST.run];
    if (!ST.projectOpen || ST.run === 'ready' && current === 'projects') { $('#runStatus').innerHTML = ''; renderNavFoot(); return; }
    const chipCls = {'': '', idle: 'idle', bad: 'bad', slow: 'wait'}[r.chip[0]];
    const ticking = ['running', 'stuck'].includes(ST.run);
    $('#runStatus').innerHTML = `<span class="p2" title="The open project">${PNAME}</span><b title="Share of all the work, checks included (G10)">${r.title}</b><span class="p3">${D.dial} · ${D.mode}</span>${ticking ? `<span class="p3">${D.elapsed} elapsed</span><span class="p3" title="How fast the model writes">${D.speed}</span>` : ''}<span class="conn ${chipCls}" onclick="go('settings')" title="The AI model's state — click for Settings"><i></i>${r.chip[1]}</span>${ticking ? `<button class="tbtn" onclick="setRun('paused')">Pause</button>` : ['paused', 'pausedErr'].includes(ST.run) ? `<button class="tbtn" onclick="setRun('running')">Resume</button>` : ''}`;
    renderActChip();
    renderNavFoot();
}
/* sidebar footer = the same source as the title-bar chip (N-2) */
function renderNavFoot() {
    const bad = (ST.projects === 'empty' && ST.model === 'none') || (ST.projectOpen && RUN[ST.run].chip[0] === 'bad');
    const txt = ST.projects === 'empty' && ST.model === 'none' ? 'No AI model found' : bad ? `${D.provider} · ${RUN[ST.run].chip[1]}` : `${D.provider} · ${D.model}`;
    $('#navFoot').innerHTML = `<span class="dot-ok" style="${bad ? 'background:var(--err)' : ''}"></span> ${txt}`;
}
/* pinned banner slot (L2) — run banners show on every screen while they apply */
function renderBanners() {
    const r = RUN[ST.run], b = r.banner;
    let html = '';
    if (ST.projectOpen && b && !(ST.run === 'finished' && current !== 'translating')) {
        const [kind, ico, title, text, acts] = b;
        const go2 = current !== 'translating' && !['finished', 'finishednone'].includes(ST.run) ? [['Go to Translating', "go('translating')"]] : [];
        html += `<div class="banner ${kind === 'info' ? '' : 'banner-' + kind}"><span class="ico">${ico}</span><div class="grow"><b>${title}</b>${text ? `<div class="small">${text}</div>` : ''}${[...acts, ...go2].length ? `<div class="gap8 mt1">${[...acts, ...go2].map(([t, f], i) => `<button class="btn ${i ? 'btn-ghost' : 'btn-secondary'} btn-sm" onclick="${f}">${t}</button>`).join('')}</div>` : ''}</div></div>`;
    }
    if (ST.hidden && ST.hidden.screen === current) html += `<div class="banner"><span class="ico">◔</span><div class="grow"><b>${ST.hidden.label} is running in the background</b><div class="small">This screen is read-only until it ends, so its results and your edits do not overwrite each other.</div></div><button class="btn btn-secondary btn-sm" onclick="showWork()">Show progress</button></div>`;
    $('#bannerSlot').innerHTML = html;
}

/* ============================================================ THEME */
function setTheme(t) { document.documentElement.setAttribute('data-theme', t); $('#themeBtn').textContent = t === 'dark' ? '☀ Light' : '◐ Dark'; }
function toggleTheme() { setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); }

/* ============================================================ TOASTS (G2) — while a dialog is open its feedback is a footer line */
function toast(type, title, desc, action) {
    const foot = (curDialog && $('#modalHost .dialog-f')) || (!curDialog && curWork && $('#workHost .dialog-f'));
    if (foot) {
        foot.querySelectorAll('.fnote').forEach(n => n.remove());
        const n = document.createElement('span');
        n.className = 'fnote ' + type;
        n.textContent = ({ok: '✓ ', warn: '⚠ ', err: '⛔ ', info: 'ℹ '}[type]) + title + (desc ? ' — ' + desc : '');
        const left = foot.querySelector('.left');
        left ? left.appendChild(n) : foot.prepend(n);
        setTimeout(() => n.remove(), 6000);
        return;
    }
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    const ico = {ok: '✓', warn: '⚠', err: '⛔', info: 'ℹ'}[type];
    el.innerHTML = `<span>${ico}</span><div class="tb"><div class="tt">${title}</div>${desc ? `<div class="td">${desc}</div>` : ''}${action ? `<button class="linkbtn mt1" onclick="${action[1]};this.closest('.toast').remove()">${action[0]}</button>` : ''}</div><span class="tx" title="Close" onclick="this.parentElement.remove()">✕</span>`;
    const host = $('#toasts');
    host.appendChild(el);
    while (host.children.length > 4) host.firstChild.remove();
    setTimeout(() => el.remove(), type === 'err' || type === 'warn' || action ? 12000 : 5000);
}

/* ============================================================ DIALOG HOST (G1) + WORK LAYER (E1)
   Rules (JX-G3): one modal at a time; model work lives in the layer below, so a confirmation or error opens above it;
   an unsolicited dialog (the review desk at run end) waits until no dialog or visible work is open (openWhenFree). */
const DLG = {}, WORK = {};
const DLG_SOFT = new Set(['about']);
const ESC_BACK = {retryNote: 'review'};
let curDialog = null, curWork = null, waiting = [];
function openDialog(id, ...args) {
    curDialog = id;
    $('#modalHost').innerHTML = DLG[id](...args);
    $('#scrim').classList.add('show');
    const f = $('#modalHost').querySelector('[data-autofocus]') || $('#modalHost').querySelector('.btn-primary:not([disabled]), .btn');
    if (f) f.focus();
    (DLG_AFTER[id] || (() => {}))();
}
const DLG_AFTER = {};
function closeDialog() { $('#scrim').classList.remove('show'); $('#modalHost').innerHTML = ''; curDialog = null; flushWaiting(); }
function openWhenFree(id) { if (curDialog || curWork) waiting.push(id); else openDialog(id); }
function flushWaiting() { if (!curDialog && !curWork && waiting.length) openDialog(waiting.shift()); }
function openWork(id, ...args) {
    if (ST.hidden && ST.hidden.id !== id) { toast('info', `${ST.hidden.label} is still running`, 'Wait for it, or open it from the title bar.', ['Show progress', 'showWork()']); return; }
    curWork = id; ST.hidden = null; renderActChip();
    $('#workHost').innerHTML = WORK[id](...args);
    $('#workScrim').classList.add('show');
}
function closeWork() { $('#workScrim').classList.remove('show'); $('#workHost').innerHTML = ''; curWork = null; ST.hidden = null; renderActChip(); renderBanners(); flushWaiting(); }
/* E1 — long work continues in the background: the dialog collapses into the title-bar chip */
function hideWork(label, screen) { const pct = PDPCT[curWork] || 0; ST.hidden = {id: curWork, label, pct, screen}; $('#workScrim').classList.remove('show'); $('#workHost').innerHTML = ''; curWork = null; renderActChip(); renderBanners(); flushWaiting(); }
function showWork() { if (ST.hidden) openWork(ST.hidden.id); }
function finishHidden() { const h = ST.hidden; ST.hidden = null; renderActChip(); renderBanners(); toast('ok', `${h.label} finished`, 'Nothing changed until you look at the results.', ['Review the results', h.id === 'names' ? "NAMES.finished=true;openWork('names')" : `openWork('${h.id}')`]); }
const PDPCT = {};
function renderActChip() { $('#actChip').innerHTML = ST.hidden ? `<span class="actchip" title="Work running in the background — click to open it" onclick="showWork()"><span class="bar"><span style="width:${ST.hidden.pct}%"></span></span>${ST.hidden.label} · ${ST.hidden.pct} % · open</span>` : ''; }
function redrawDialog(...args) {
    const host = curDialog ? $('#modalHost') : $('#workHost'), fn = curDialog ? DLG[curDialog] : WORK[curWork];
    if (!fn) return;
    const b = host.querySelector('.pd-detail, .dialog-b, .rv-tabs'); const t = b ? b.scrollTop : 0;
    host.innerHTML = fn(...args);
    const nb = host.querySelector('.pd-detail, .dialog-b, .rv-tabs'); if (nb) nb.scrollTop = t;
}
document.addEventListener('keydown', e => {
    const host = curDialog ? '#modalHost' : curWork ? '#workHost' : null;
    if (!host) return;
    if (e.key === 'Escape') { if (curDialog) { ESC_BACK[curDialog] ? openDialog(ESC_BACK[curDialog]) : closeDialog(); } else (WORK_ESC[curWork] || (() => {}))(); }
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey || !['TEXTAREA', 'BUTTON', 'SUMMARY'].includes(document.activeElement.tagName))) {
        const p = $(host + ' .dialog-f .btn-primary:not([disabled])'); if (p) { e.preventDefault(); p.click(); }
    }
    if (e.key === 'Tab') {
        const f = [...$(host).querySelectorAll('button, [tabindex="0"], input, select, textarea, summary')].filter(x => !x.disabled);
        if (!f.length) return;
        if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
        else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    }
});
const WORK_ESC = {};   // Esc on a progress dialog: hide long work, ask before cancelling export, close short work
const dlgHead = (ico, cls, title, sub, closeFn = 'closeDialog()') => `<div class="dialog-h"><div class="di ${cls}">${ico}</div><div><h3>${title}</h3>${sub ? `<div class="sub">${sub}</div>` : ''}</div><button class="btn btn-ghost btn-sm x" title="Close (Esc)" onclick="${closeFn}">✕</button></div>`;

/* ============================================================ PARSED PROMPT RENDERER (G5) — Detailed views only */
function renderSection(s) {
    let body;
    if (s.kind === 'list') body = `<ul>${s.lines.map(l => `<li>${toks(l)}</li>`).join('')}</ul>`;
    else if (s.kind === 'terms') body = gridTable(['Term', 'Rendering', 'Note'], s.lines.map(([a, b, c]) => [esc(a), esc(b), `<span class="muted">${esc(c || '')}</span>`]));
    else if (s.kind === 'pairs') body = `<div class="io">${['Source', 'Translation'].map(h => `<div class="h">${h}</div>`).join('')}${s.lines.map(([a, b], i) => `<div class="c ${i === s.lines.length - 1 ? 'last' : ''}">${toks(a)}</div><div class="c ${i === s.lines.length - 1 ? 'last' : ''}">${toks(b)}</div>`).join('')}</div>`;
    else if (s.kind === 'items') body = gridTable(['Id', 'Segment', 'Text sent'], s.lines.map(([id, loc, t]) => [id, `<span class="muted">${loc}</span>`, toks(t)]), ['44px', '96px']);
    else body = `<div class="secbody">${s.lines.map(toks).join('<br>')}</div>`;
    return `<details class="sec" ${s.open ? 'open' : ''}><summary>${esc(s.h)} <span class="cnt">${s.cnt || ''}</span></summary>${body}</details>`;
}
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
function parsedPrompt(sys, user, opts = {}) {
    const raw = opts.raw ? `<details class="sec mt2"><summary>Raw messages, exactly as sent <span class="cnt">for diagnostics</span></summary><div class="gap8 mt1"><button class="btn btn-secondary btn-sm" onclick="toast('ok','Copied','Both messages are on the clipboard.')">Copy both</button></div><pre class="raw mt1">${esc(opts.raw)}</pre></details>` : '';
    return `<div class="msg"><div class="mh"><span class="role">SYSTEM</span><span class="muted">${plural(sys.length, 'part', 'parts')} · ${opts.sysTok || '1,240'} tokens</span><button class="btn btn-ghost btn-sm" onclick="toast('ok','Copied','System message copied.')">Copy</button></div><div class="mb">${sys.map(renderSection).join('')}</div></div>
<div class="msg"><div class="mh"><span class="role user">USER</span><span class="muted">${plural(user.length, 'part', 'parts')} · ${opts.userTok || '860'} tokens</span><button class="btn btn-ghost btn-sm" onclick="toast('ok','Copied','User message copied.')">Copy</button></div><div class="mb">${user.map(renderSection).join('')}</div></div>${raw}`;
}
/* read-only grid (GridPane with grid lines, G9 kind 2): not resizable */
function gridTable(head, rows, widths = []) {
    return `<div class="tbl-wrap"><table class="tbl ro">${'<tr>' + head.map((h, i) => `<th style="resize:none;${widths[i] ? 'width:' + widths[i] : ''}">${h}</th>`).join('') + '</tr>'}${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
}
function replyTable(rows) { return gridTable(['Id', 'Segment', 'Translation returned', 'Result'], rows.map(([id, loc, t, m]) => [id, `<span class="muted">${loc}</span>`, t ? toks(t) : '<span class="muted">— missing in the reply —</span>', m]), ['44px', '96px', '', '150px']); }

/* ============================================================ SHARED PROGRESS DIALOG (G4, E1)
   cfg = {id, ico, title, sub, overall:[done,total,about], left, extra:[[l,v]], steps, sel, detail(step,mode,i), footer, long:{label,screen}, cancelSays} */
const PD = {};
function progressDialog(cfg) {
    const st = PD[cfg.id] = PD[cfg.id] || {sel: cfg.sel ?? 0, mode: ST.tech ? 'detailed' : 'simple', follow: true};
    const [done, total, about] = cfg.overall, pct = Math.round(100 * done / total);
    PDPCT[cfg.id] = pct;
    let lastGroup = null;
    const list = cfg.steps.map((s, i) => {
        const g = s.group && s.group !== lastGroup ? `<div class="group">${s.group}</div>` : '';
        lastGroup = s.group || lastGroup;
        return `${g}<div class="li ${i === st.sel ? 'sel' : ''}" tabindex="0" title="${esc(s.name)}" onclick="PD['${cfg.id}'].sel=${i};PD['${cfg.id}'].follow=false;redrawDialog()"><div class="top"><span class="t">${s.name}</span>${s.state}</div>${s.res ? `<div class="res" title="${esc(s.res)}">${s.res}</div>` : ''}</div>`;
    }).join('');
    const modeSw = `<span class="seg" title="Simple: what went in and what came out, in plain words. Detailed: adds the technical figures and the messages sent to the model."><span class="${st.mode === 'simple' ? 'on' : ''}" onclick="PD['${cfg.id}'].mode='simple';redrawDialog()">Simple</span><span class="${st.mode === 'detailed' ? 'on' : ''}" onclick="PD['${cfg.id}'].mode='detailed';redrawDialog()">Detailed</span></span>`;
    const follow = cfg.follow === false ? '' : `<label class="gap4 small muted" title="Selects the step the work is on. Clicking a step turns it off."><span class="switch ${st.follow ? 'on' : ''}" onclick="PD['${cfg.id}'].follow=!PD['${cfg.id}'].follow;redrawDialog()"></span>Follow current step</label>`;
    return `<div class="dialog xl" role="dialog" aria-modal="true">
${dlgHead(cfg.ico || '◔', 'brand', cfg.title, cfg.sub, cfg.long ? `hideWork('${cfg.long.label}','${cfg.long.screen}')` : 'closeWork()')}
<div class="pd-head"><div class="between"><div class="grow"><div class="bar" title="${done} of ${about ? 'about ' : ''}${total} steps of the whole operation (G10)"><span style="width:${pct}%"></span></div></div><div class="gap8" style="margin-left:14px">${modeSw}${follow}</div></div>
<div class="figs"><span><b>${pct} %</b> · ${done} of ${about ? 'about ' : ''}${total} steps</span>${cfg.left ? `<span>Left <b>${cfg.left}</b></span>` : ''}${st.mode === 'detailed' ? (cfg.extra || []).map(([l, v]) => `<span>${l} <b>${v}</b></span>`).join('') : ''}</div></div>
<div class="pd-body"><div class="pd-list">${list}</div><div class="pd-detail">${cfg.detail(cfg.steps[st.sel], st.mode, st.sel)}</div></div>
<div class="dialog-f"><div class="left">${cfg.long ? `<button class="btn btn-ghost" onclick="hideWork('${cfg.long.label}','${cfg.long.screen}')" title="Keeps working; the title bar shows its progress. ${cfg.long.screenName} stays read-only until it ends.">Continue in background</button>` : ''}<span class="small muted">${cfg.cancelSays || ''}</span></div>${cfg.footer}</div></div>`;
}
const callInfo = (o) => `<div class="info-grid">${Object.entries(o).map(([k, v]) => `<div><span>${k}</span>${v}</div>`).join('')}</div>`;
const clock = (pct, txt) => `<span class="clockbar"><span class="bar"><span style="width:${pct}%"></span></span></span> <span class="small muted">${txt}</span>`;
</script>

function strip() {
    const r = ST.run, fin = isFinished();
    const big = fin ? `Finished in ${D.took}` : r === 'running' || r === 'stuck' ? `${D.timeLeft} left` : ['ready', 'cannot'].includes(r) ? `${D.estimate} for this book (estimate)` : RUN[r].title;
    const done = fin ? D.total : ['ready', 'cannot'].includes(r) ? 0 : D.decided, pct = fin ? 100 : ['ready', 'cannot'].includes(r) ? 0 : D.pct;
    return `<div class="card strip">
  <div class="left-big" title="${['running', 'stuck'].includes(r) ? 'Time per step measured over the whole run, per kind of step (G10)' : ''}">${big}</div>
  <div class="gap8">${!fin && hasProgress() ? `<button class="btn btn-secondary btn-sm" onclick="openDialog('review')" title="Open the review desk">${D.flagged} to review</button>` : fin && ST.run === 'finished' ? `<button class="btn btn-secondary btn-sm" onclick="openDialog('review')">${D.flagged} to review</button>` : ''}</div>
  <div class="bar" title="${pct} % of all the work — ${fin ? D.stepsTotal : D.stepsDone} of ${D.stepsTotal} steps, checks included (G10)"><span style="width:${pct}%"></span></div>
  <div class="facts" style="grid-column:1/-1"><span><b>${done} of ${D.total}</b> segments done</span>${hasProgress() ? `<span>${fin ? D.total - D.kept - D.repaired - D.flagged : D.autoAccepted} translated</span><span>${D.repaired} fixed automatically</span><span>${D.flagged} to review</span><span>${D.kept} kept as is</span>` : ''}${['running', 'stuck'].includes(r) ? `<span>${D.chapter}</span><span>${D.elapsed} elapsed</span>` : ''}
    <details class="sec" style="border:0;padding:0"><summary class="small" style="font-weight:400">ⓘ How progress is counted</summary>
      ${gridTable(['Kind of step', 'Planned', 'Done', 'Time per step'], [['Translate a segment <span class="muted small">(kept-as-is ones count as done at once)</span>', D.steps.draft[0], fin ? D.steps.draft[0] : D.steps.draft[1], '14 s'], ['Check a segment <span class="muted small">(Balanced: one per translated segment)</span>', D.steps.review[0], fin ? D.steps.review[0] : D.steps.review[1], '9 s'], ['Fix after a failed check <span class="muted small">(added as found)</span>', `+${D.steps.repair[0]}`, D.steps.repair[1], '11 s'], ['<b>All steps</b>', `<b>${D.stepsTotal}</b>`, `<b>${fin ? D.stepsTotal : D.stepsDone}</b>`, '<span class="muted small">time left = steps left × time per step</span>']])}
      <div class="hint">The bar never moves back: a fix that is added joins the total, and the bar waits until the work catches up. ${req('G10')}</div></details></div>
</div>`;
}

    return `
${demo(runDemo())}
<div class="page full" style="display:flex;flex-direction:column;flex:1;min-height:0">

  ${ST.liveManual ? `<button class="btn btn-ghost btn-sm" onclick="ST.liveManual=false;rerender()">Follow again</button>` : ''}
  <button class="btn btn-ghost btn-sm" onclick="openWork('calls')" title="Every call of this run, newest first">All calls…</button>${r === 'running' ? `<button class="btn btn-ghost btn-sm" title="Mockup only" onclick="simulateReply()">Mockup: reply arrives</button>` : ''}</div>` : `<span class="seg"><span class="on">All</span><span>Problems only</span></span>`}</div>

    <div class="banner mt3"><span class="ico">≡</span><div class="small"><b>Scene summary</b> · Chapter 2 introduces orbits; a cannon on a mountain follows. <span class="muted">Updated every 20 segments. On Max quality the model also writes one at the end of each chapter.</span> ${req('T5')}</div></div></div></div>` : `
  <div class="card-b log" style="overflow:auto">
    <div class="ln"><span class="tm">11:41:05</span><span class="lv">info</span><span>Segments 1–4 of chapter 2 translated in one reply · 3 accepted · 1 to review (name in the wrong form)</span></div>

    <div class="ln"><span class="tm">10:31:12</span><span class="lv w">warn</span><span>The model refused the setting “temperature” — BookLoom stopped sending it and repeated the request (see Settings › Models)</span></div>
    ${ST.tech ? '<div class="ln"><span class="tm">11:41:05</span><span class="lv">debug</span><span>call 41 · draft-batch-json · 4 items · ok=3 flagged=1 · 6.2 s · 2,100/212 tokens</span></div>' : ''}
  </div>`}
</div></div>`;
};

DLG.genders = () => simple('?', 'info', 'Characters without a gender', '2 names in the glossary have no gender yet.', gridTable(['Name', 'What the book shows', 'Gender'], [['Galileo Galilei', '<span class="muted">“he” 2 times (likely)</span>', seg(['woman', 'man', 'not known'], 1)], ['Ada', '<span class="muted">no he/she nearby</span>', seg(['woman', 'man', 'not known'], 2)]]), `${closeBtn('Skip')}<button class="btn btn-primary" onclick="closeDialog()">Save and start</button>`, true);
DLG.confirmStop = () => simple('■', 'warn', 'Stop translating?', '', `${D.decided} of ${D.total} segments are done and saved. The 4 being translated now are translated next time. For a short break, use Pause.`, `<button class="btn btn-ghost" onclick="closeDialog()">Keep translating</button><button class="btn btn-secondary" onclick="closeDialog();setRun('stopped')">■ Stop</button>`);
DLG.confirmCancelExport = () => simple('■', 'warn', 'Cancel the export?', '', `No file is written. The ${D.exportFixes} fixes made so far are not kept.`, `<button class="btn btn-ghost" onclick="closeDialog()">Keep exporting</button><button class="btn btn-danger" onclick="closeDialog();closeWork()">Cancel export</button>`);
DLG.skipCheck = () => simple('⬇', 'info', 'Write the file now?', '', `The last check stops here: 6 of 18 segments were reread and 1 was fixed. The file is written with that fix; the other 12 stay as they are.`, `<button class="btn btn-ghost" onclick="closeDialog()">Keep checking</button><button class="btn btn-primary" onclick="closeDialog();closeWork();ST.exported=true;openDialog('exported')">Write the file now</button>`);
DLG.unsaved = (to = 'models') => simple('●', 'warn', 'Save the changes to Ollama?', 'You changed the provider settings.', '', `<button class="btn btn-ghost" onclick="closeDialog()">Keep editing</button><button class="btn btn-secondary" onclick="ST.dirty=false;closeDialog();ST.settingsTab='${to}';rerender()">Discard</button><button class="btn btn-primary" onclick="ST.dirty=false;closeDialog();ST.settingsTab='${to}';rerender();toast('ok','Saved','Used from the next request.')">Save</button>`);
DLG.changeDuringRun = () => simple('⚠', 'warn', 'Use LM Studio for the rest of this book?', `This book has been translated with ${D.provider} · ${D.model} so far.`, `Using the same AI model keeps the style even. Segments already done keep their translation; the change applies to the segments not translated yet.`, `<button class="btn btn-ghost" onclick="closeDialog()">Keep ${D.provider}</button><button class="btn btn-primary" onclick="closeDialog();toast('ok','LM Studio is now used','For the segments not translated yet.')">Use LM Studio</button>`, true);
DLG.confirmDelete = () => simple('🗑', 'err', 'Delete “LM Studio”?', '', `Its settings are removed. Projects that used it ask for another AI model when they continue. LM Studio itself is not touched.`, `${closeBtn()}<button class="btn btn-danger" onclick="closeDialog()">Delete</button>`);
DLG.confirmRemove = () => simple('🗑', 'err', 'Remove “Earth Gravity · EN → PL”?', '', `This project’s saved work — brief, glossary, translations — is deleted from BookLoom. The book file, exported files and the book’s other projects stay.`, `${closeBtn()}<button class="btn btn-danger" onclick="closeDialog()">Remove project</button>`);
DLG.replaceRun = () => simple('⚠', 'warn', 'Open another book?', '', `This project is translating “${D.file}” (${D.pct} % done). Open the new book as a new project — this one stays as it is.`, `${closeBtn()}<button class="btn btn-danger-outline" onclick="closeDialog()">Replace and delete this translation</button><button class="btn btn-primary" onclick="closeDialog();newProject()">Open as a new project</button>`, true);
DLG.leave = () => simple('⚠', 'warn', 'Names are still being prepared', '', `Leaving does not stop it: it continues in the background and Names & style stays read-only until it ends.`, `<button class="btn btn-ghost" onclick="closeDialog()">Stay</button><button class="btn btn-primary" onclick="closeDialog()">Continue in background</button>`);
DLG.exported = () => simple('✓', 'ok', 'Export complete', '', `<div class="kv"><span class="k">Saved as</span><span style="text-align:right;overflow-wrap:anywhere">Books ▸ earth-gravity.uk.md</span></div><div class="kv"><span class="k">Check</span><span>✓ opens, nothing missing</span></div><div class="kv"><span class="k">Size</span><span>41 KB</span></div><div class="kv"><span class="k">Also saved</span><span>glossary.csv · report.md</span></div><div class="kv"><span class="k">Last check</span><span>18 segments reread · 1 fixed</span></div>`, `${closeBtn('Close')}<button class="btn btn-secondary">Open folder</button><button class="btn btn-primary" onclick="closeDialog();if(current==='export')rerender()">Open book</button>`, true);
DLG.err = () => simple('⛔', 'err', 'This file cannot be read', 'Frankenstein.epub', `The file looks damaged. Try downloading it again.<details class="sec mt2"><summary>Details for support</summary><pre class="raw">code: unsupportedFormat\nentry: META-INF/container.xml → OEBPS/content.opf (missing)</pre></details>`, `<button class="btn btn-secondary" onclick="toast('ok','Copied','Details copied.')">Copy details</button><button class="btn btn-primary" onclick="closeDialog()">Close</button>`, true);
DLG.bindUnavailable = () => simple('⚠', 'warn', 'LM Studio is not answering', '“Earth Gravity · EN → PL” was translated with LM Studio · lapa-v0.1.2-instruct.', `Is the LM Studio app open, with the model loaded? Open it and press Try again. Or continue with another AI model — finished segments stay as they are.`, `${closeBtn('Not now')}<button class="btn btn-secondary" onclick="closeDialog()">Use another AI model…</button><button class="btn btn-primary" onclick="closeDialog()">Try again</button>`, true);
DLG.bindChanged = () => simple('⚠', 'warn', 'A different AI model is chosen now', 'This book was translated with gemma4:26b so far; gemma4:e4b is chosen now.', `Using the same model keeps the style even. Segments already done keep their translation.`, `${closeBtn()}<button class="btn btn-secondary" onclick="closeDialog()">Continue with gemma4:e4b</button><button class="btn btn-primary" onclick="closeDialog()">Use gemma4:26b</button>`, true);
DLG.about = () => simple('BL', 'brand', 'BookLoom', 'Offline book translator · version 0.16', `Translates whole books with an AI model on your computer. Nothing leaves it except the requests to the AI model you choose.<div class="gap8 mt3"><button class="btn btn-secondary btn-sm">Save a diagnostic bundle…</button><button class="btn btn-secondary btn-sm">Open log folder</button></div>`, `<button class="btn btn-primary" onclick="closeDialog()">Close</button>`);

/* ============================================================ PROJECT NAMES (PN) */
const TAKEN = BOOKS.flatMap(b => b.tr.map(t => t.name.toLowerCase()));
function nameCheck(inp, errId, btnSel, touched) {
    const v = inp.value.trim(), taken = TAKEN.includes(v.toLowerCase());
    const msg = !v ? (touched ? 'Enter a name — this book already has a project with these languages.' : '') : taken ? 'Another project already has this name.' : '';
    inp.classList.toggle('err-field', !!msg);
    $('#' + errId).textContent = msg;
    const b = $(btnSel); if (b) b.disabled = !v || taken;
}
const suggestChips = (base) => `<div class="gap4 mt1"><span class="small muted">Add:</span>${['26b', 'Max quality', 'thinking low', 'formal', 'v2'].map(x => `<button class="badge b-neutral" style="cursor:pointer" onclick="const i=$('#pname');i.value=(i.value.trim()||'${base}')+' · ${x}';nameCheck(i,i.dataset.err,i.dataset.btn,true)">${x}</button>`).join('')}</div>`;
DLG.samePair = (lang = 'Polish', code = 'PL') => simple('⧉', 'warn', `This book already has a ${lang} translation`, 'Two projects of one book can share languages only if the new one has its own name.',
    `${gridTable(['Project', 'AI model · quality', 'Progress'], [[`<b>Earth Gravity · EN → ${code}</b>`, 'LM Studio lapa-v0.1.2 · Balanced', '12 % · cannot reach LM Studio']])}
    <div class="chk mt3"><input type="radio" name="sp" onclick="$('#spName').style.display='none';$('#spGo').textContent='Open that project';$('#spGo').disabled=false"> <span><b>Open that project</b> — continue the existing translation. This one stays in Ukrainian.</span></div>
    <div class="chk"><input type="radio" name="sp" checked onclick="$('#spName').style.display='';$('#spGo').textContent='Use ${lang} with this name';nameCheck($('#pname'),'pnErr','#spGo')"> <span><b>Make a second ${lang} translation</b> — for example with another AI model or quality.</span></div>
    <div id="spName" style="margin:6px 0 0 26px"><label class="fld">Name for this project</label><input id="pname" data-err="pnErr" data-btn="#spGo" class="input w-name" data-autofocus placeholder="e.g. Earth Gravity · EN → ${code} · second try" oninput="nameCheck(this,'pnErr','#spGo',true)"><div class="field-err" id="pnErr"></div>${suggestChips('Earth Gravity · EN → ' + code)}<div class="hint">The name stays as you write it; it no longer follows the languages.</div></div>`,
    `<button class="btn btn-ghost" onclick="closeDialog()">Keep Ukrainian</button><button class="btn btn-primary" id="spGo" disabled onclick="closeDialog();toast('ok','Translating into ${lang}','The project is now “'+($('#pname')?.value||'')+'”.')">Use ${lang} with this name</button>`, true);
DLG.rename = (name = PNAME, auto = true) => simple('✎', 'brand', 'Rename the project', auto ? 'Now the name is automatic: book title · from → into. It follows the languages until you change it.' : 'Named by you.',
    `<label class="fld">Name</label><input id="pname" data-err="rnErr" data-btn="#rnGo" class="input" data-autofocus value="${name}" oninput="nameCheck(this,'rnErr','#rnGo',true)"><div class="field-err" id="rnErr"></div>${suggestChips(name)}
    <div class="mt2">${auto ? '' : `<button class="linkbtn" onclick="$('#pname').value='Earth Gravity · EN → UK';nameCheck($('#pname'),'rnErr','#rnGo',true)">Use the automatic name again</button> <span class="small muted">— only when no other project of this book has the same languages</span>`}</div>`,
    `<div class="left"><button class="btn btn-danger-outline btn-sm" onclick="openDialog('confirmRemove')">Remove project…</button></div>${closeBtn()}<button class="btn btn-primary" id="rnGo" onclick="closeDialog();toast('ok','Renamed','The project keeps this name.')">Rename</button>`, true);
DLG_AFTER.rename = () => { $('#pname').select(); };
DLG.translateAgain = (title = D.book) => simple('＋', 'brand', 'Translate into another language', `${title} — a new project for the same book. Nothing is imported again.`,
    `<div class="grid2"><div class="field"><label class="fld">Translate into</label><select class="input" id="taLang" onchange="taUpdate()"><option value="DE">German</option><option value="FR">French</option><option value="UK">Ukrainian — already in 2 projects</option><option value="PL">Polish — already in 1 project</option></select></div>
    <div class="field"><label class="fld">From</label><div class="input" style="background:var(--surface-2)">English (as in this book’s projects)</div></div></div>
    <div class="field"><label class="fld">Project name</label><input id="pname" data-err="taErr" data-btn="#taGo" class="input" oninput="nameCheck(this,'taErr','#taGo',true)"><div class="field-err" id="taErr"></div><div id="taHint" class="hint"></div><div id="taChips"></div></div>
    <label class="fld">Start from</label>
    <div class="chk"><input type="checkbox" checked> The brief — tone, how to translate, narrator, quality</div>
    <div class="chk"><input type="checkbox" checked> Glossary and recurring terms — the entries, kinds and genders; translations left empty</div>
    <div class="chk"><input type="checkbox"> The AI model of the latest project</div>`,
    `${closeBtn()}<button class="btn btn-primary" id="taGo" onclick="closeDialog();ST.projectOpen=true;go('brief');toast('ok','Project created','“'+$('#pname')?.value+'” — check the brief, then continue.')">Create and open the brief</button>`, true);
function taUpdate() {
    const code = $('#taLang').value, used = ['UK', 'PL'].includes(code), auto = 'Earth Gravity · EN → ' + code;
    const i = $('#pname');
    i.value = used ? '' : auto;
    i.placeholder = used ? 'e.g. ' + auto + ' · second try' : '';
    $('#taHint').textContent = used ? 'This book already has a project with these languages — give this one its own name.' : 'Automatic: book title · from → into. It follows the languages until you rename it.';
    $('#taChips').innerHTML = used ? suggestChips(auto) : '';
    nameCheck(i, 'taErr', '#taGo', false);
}
DLG_AFTER.translateAgain = taUpdate;

/* ============================================================ BOOT */
buildNav();
go('translating');
renderNavFoot();
console.assert(FLAGGED.length === D.flagged, 'review desk count = flagged figure');
</script>
</body>
