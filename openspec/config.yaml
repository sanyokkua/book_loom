schema: spec-driven

context: |
  # BookLoom

  A local-first, offline JavaFX desktop application that translates whole books (EPUB, FB2, Markdown, TXT)
  with a general-purpose LLM the user runs locally (Ollama / LM Studio) or any OpenAI-compatible endpoint.
  Each book is parsed into a structured XML/AST *skeleton* plus an ordered list of *segments*; only visible
  text is translated, so structure, images, fonts and IDs survive a structure-and-text-preserving
  (canonical-equal) round trip. A tiered pipeline (draft -> deterministic QA -> LLM-as-judge -> self-heal
  repair) runs automatically end to end; only chunks it cannot clear are flagged for optional side-by-side
  review.

  ## Authoritative documents

  - `docs/specification/**` is the reference for requirements, architecture and decisions. It is editable:
    when the shipped code legitimately differs from a clause, fix the clause in the same change. It holds
    the FR-*/NFR-*/DD-*/EC-* ids, the prompt catalog, the SQLite DDL, the theming palette, the mermaid
    diagrams, and `docs/specification/mockups/ui-mockup.html` (the binding visual reference for every UI
    screen, state, dialog, and the standalone "Component library" screen). Cite it by file and anchor.
  - `docs/adr/ADR-NNNN-*.md` holds architecture decisions. ADR-0016 governs this delivery process;
    ADR-0017 governs the delivery order. A decision that is costly to reverse becomes an ADR; a clause
    that is simply wrong is edited.
  - `docs/implementation_plan/CHANGE_BACKLOG.md` is the ordered change backlog (names and order only).
  - `docs/implementation_plan/01_MODULE_INVENTORY.md` is the canonical module/package map.
  - `AGENTS.md` carries the Definition of Done: the gate green AND the change exercised in the running app.

  ## Stack

  Java 25 (LTS) - JavaFX 25 (LTS) - Gradle (Kotlin DSL) + version catalog (`gradle/libs.versions.toml`)
  + dependency locking - Guice DI (constructor injection only) - SQLite (sqlite-jdbc, WAL) + Flyway
  (additive `V{ver}__desc.sql` migrations) + JDBI 3 (no ORM) - JDOM2/dom4j + jsoup + `java.util.zip`
  (documents) + a CommonMark library (Markdown) - `java.net.http` + Jackson (LLM HTTP/JSON) - Lingua +
  ICU4J (language detect / segmentation) - SLF4J 2 + Logback 1.5 - Spotless (Palantir, 120 col) +
  Error Prone/NullAway (JSpecify `@NullMarked`) + Checkstyle + SpotBugs/FindSecBugs + ArchUnit - Lefthook -
  JUnit 5 + AssertJ + WireMock + TestFX (JavaFX 26 built-in headless) - jpackage (unsigned, per-OS; Windows is a
  portable app-image zip, never an installer). MIT license; permissive dependencies only
  (Apache-2.0/MIT/BSD plus recorded EPL-1.0 / ICU / JDOM exceptions; GPL/LGPL/AGPL/SSPL banned).

  ## Modules (Gradle subprojects = JPMS modules; base package `ua.bookloom.<module>`)

  Allowed dependency edges only - the graph is a single inward-pointing DAG with no cycles:

      :app         -> :ui :pipeline :document :llm :persistence :api :util
      :ui          -> :pipeline :api :util   (+ javafx.*)
      :pipeline    -> :document :llm :persistence :api :util
      :document    -> :api :util
      :llm         -> :api :util
      :persistence -> :api :util
      :util        -> :api
      :api         -> (nothing internal; framework-free contract floor)

  `:api` holds contracts only: interfaces, records/DTOs, `Result`/`AppError`/`ErrorCode`. Only `:ui` and
  `:app` may `requires javafx.*`. Only `:llm` may import `java.net.http..`. Only `:persistence` may import
  `java.sql..`/`org.jdbi..`/`org.flywaydb..`. Every layering claim is backed by an ArchUnit test in the
  shared `arch-test` source set.

  ## Non-negotiable invariants (true after every change)

  - **FX-free core.** No class in `:api/:util/:document/:llm/:pipeline/:persistence` imports `javafx..`.
  - **Skeleton is never regenerated.** Only text nodes change; structure/IDs/images/fonts survive a
    canonical-equal round trip (TXT is exact bytes, DD-43). Inline tags and locked terms mask to `gN`
    placeholders, are validated as a tag-multiset hard gate on return, then unmasked.
  - **Uniform error envelope.** Boundaries return `Result<T>{data,error}` with one typed
    `AppError{code,title,message,details,retryable,cause}` + `ErrorCode`. No exception crosses a module
    edge. `details` is built only from the safe-details allowlist and never contains secrets. Partial
    results carry both data and error.
  - **Records for data, Lombok on services.** Data carriers are Java `records` (never `@Data`/`@Value`);
    services may use `@RequiredArgsConstructor`/`@Slf4j`/`@Builder` (DD-05, ADR-0014). `Optional` as a
    return type only. `Objects.requireNonNull` at public boundaries. No checked exceptions in application
    code. No `synchronized` in new code.
  - **Credentials are a reference, never a secret.** Persist an env-var name or an OS-keychain reference;
    resolve just before the call; never store or log the secret.
  - **Single-flight inference.** One `InferenceGate` (`Semaphore(1)`, `tryAcquire`) guards all inference,
    real runs and diagnostics alike. The gate is released across backoff/`Retry-After` sleeps. Retry is
    service-owned, keyed on typed retryable errors, with a fresh timeout per attempt.
  - **Token-only theming.** Looked-up colors on `.root`; light + dark from one token set; stylesheets
    attached at Scene level; never `node.setStyle(...)`.
  - **Offline.** No background, scheduled, or unsolicited network call; no telemetry. The only outbound
    traffic ever is user-triggered provider communication (inference, model discovery, verification) with
    the configured provider. All assets are bundled.
  - **Acceptance model.** The review-mode dial (Unattended/Assisted/Manual) is the sole owner of the trust
    threshold tau; the quality dial (Fast/Balanced/Max) owns mechanics only. Accept = hard gates pass AND
    confidence >= tau AND (judge off OR judge score >= tau_judge) (DD-45).
  - **UI thread discipline.** Scene graph only on the JavaFX Application Thread; long work in `Task`/
    `Service` on an injected daemon executor; `Platform.runLater` (via the singleton state mirror) to
    bridge; virtual threads for I/O fan-out.
  - **Persistence.** SQLite (WAL) via JDBI, Flyway additive migrations, a generic typed KV settings table,
    atomic per-chunk commits (process-crash-safe and forced-quit-safe; NOT power-loss-proof, DD-20). The
    single-instance lock `bookloom.lock` is acquired pre-injector by `:app`/`:util`, never by
    `:persistence`.
  - **Paths first.** A `:util` resolver picks the per-OS data/log dirs and runs BEFORE logging and SQLite
    (DD-39, ADR-0015).
  - **Green gate, no exceptions.** Every change leaves `./gradlew clean build check spotlessCheck` green
    project-wide. A red mechanical check is never excused as "pre-existing".

  ## Delivery process (ADR-0016)

  An `openspec/changes/<name>/` directory IS the unit of work. There are no story files and no generated
  traceability: `docs/stories/`, `docs/traceability.yaml`, `./gradlew trace` and `./gradlew traceCheck` do
  not exist and must never be reintroduced. A test's name and its one-line comment say what it proves;
  there is no requirement-id marker and no coverage script (ADR-0032). The tests are the evidence.

  `openspec/specs/` starts EMPTY and grows: each change ADDs only what it actually implements, and
  `openspec archive` folds it in. So `openspec/specs/` always means "what is actually built", while
  `docs/specification/` means "what is ultimately intended". A `Source:` pointer to the spec file and anchor
  is the bridge between them.

  ## The authoring standard (R1-R4, from ADR-0016 as amended by ADR-0032)

  Every artifact must be understandable WITHOUT opening another file. IDs are citations, never payloads.
  A bare id such as `FR-DOC-04` or `DD-14` standing alone as the content of a requirement, a scenario, or a
  task is a defect. Restate what it says in plain words, then cite it.

  ## Capabilities (16), mapped from the FR areas

  Use these exact kebab-case names:

  | Capability             | FR area                        |
  |------------------------|--------------------------------|
  | `book-import`          | fr-import                      |
  | `document-round-trip`  | fr-doc                         |
  | `book-brief`           | fr-brief                       |
  | `llm-provider`         | fr-prov, fr-model              |
  | `inference`            | fr-infer                       |
  | `translation-pipeline` | fr-algo                        |
  | `quality-gates`        | fr-qa                          |
  | `review-queue`         | fr-review                      |
  | `glossary`             | fr-gloss                       |
  | `export`               | fr-export                      |
  | `local-storage`        | fr-persist                     |
  | `resume`               | fr-resume                      |
  | `settings`             | fr-settings                    |
  | `app-shell`            | fr-ui (FR-UI-01..04, FR-UI-09) |
  | `theming`              | fr-ui (FR-UI-05) + **fr-theme (FR-THEME-01..10)** |
  | `localization`         | fr-ui (FR-UI-06, FR-UI-08) + **fr-i18n (FR-I18N-01..09)** |
  | `notifications`        | fr-notif (incl. the FR-NOTIF-03a..06c refinements) |

  Do not invent a capability outside this list without recording an ADR first.

  ## Requirement-id form (ADR-0018)

  Canonical: `FR-<AREA>-<NN>[<letter>]`, `NFR-<AREA>-<NN>`, `EC-<AREA>-<N>` — zero-padded to two
  digits. Cite `FR-THEME-01`, not `FR-THEME-1`. The spec writes four families unpadded
  (`FR-THEME-1..10`, `FR-I18N-1..9`, `FR-A11Y-1..8`, and the `FR-NOTIF-3a..6c` refinements), so
  both spellings exist. A lettered suffix marks a
  sub-clause refining its parent (`FR-NOTIF-03a` refines `FR-NOTIF-03`) — cite the refinement,
  it is the concrete testable statement.

  **`FR-A11Y-*` and `NFR-A11Y-*` are advisory and never a merge gate.** They have no capability
  owner and are excluded from coverage; accessibility is a best-effort review item on `:ui`
  changes, never a blocking requirement.

  When grepping these ids, anchor the prefix (`(^|[^A-Z0-9])`) — an unanchored `FR-[A-Z]+-[0-9]+`
  matches inside `NFR-...` and invents phantom ids.

rules:
  proposal:
    - Describe each capability in words, not just its kebab-case name. "`document-round-trip` NEW - parsing
      a book into an immutable skeleton plus an ordered segment list, and writing translated text back into
      the same nodes so the file re-opens identically" beats "`document-round-trip` NEW".
    - Use only the 16 capability names listed in the project context, and check `openspec/specs/` before
      calling one NEW - if the folder already exists it is a MODIFIED capability and needs a delta spec.
    - Cite the spec by file and anchor, with the FR-id when one exists (for example `FR-DOC-04`
      (`01_Product/01_FUNCTIONAL_REQUIREMENTS.md#fr-doc`)) so the citation resolves. Never cite a story id -
      stories do not exist.
    - Under Impact, name the affected Gradle modules explicitly (`:api`, `:document`, `:ui`, ...) and any
      new dependency, which must be Apache-2.0/MIT/BSD or a recorded exception.
    - "Set `skip_specs: true` in the change's `.openspec.yaml` when there is genuinely no user-observable
      behavior - build tooling, lint config, ArchUnit rules, CI wiring, packaging. Never invent a fake
      requirement to satisfy validation."
  specs:
    - "R1 - Write every requirement in EARS form; do not copy the FR sentence. Patterns: `The <system> SHALL
      <response>` (ubiquitous); `WHEN <trigger>, the <system> SHALL <response>` (event); `WHILE <state>, the
      <system> SHALL <response>` (state); `IF <condition>, THEN the <system> SHALL <response>` (unwanted
      behavior); `WHERE <feature is included>, the <system> SHALL <response>` (optional feature)."
    - R1 - Decompose a dense FR into several atomic EARS requirements rather than transcribing it. One
      requirement states one testable obligation. Several requirements may share the same `FR-*` citation,
      and that shared citation is what keeps coverage checkable across the split.
    - "R2 - Every requirement ends with a `**Source:**` block before its scenarios: the spec file and
      anchor it comes from, and an `In plain words:` sentence saying what the requirement means and why
      it matters. The pointer locates; the gloss explains. A Source block that is only ids is incomplete."
    - R3 - Scenarios use concrete values, never abstractions. Not "invalid input" but the actual string;
      not "an error" but `ErrorCode.validation`; not "a large file" but a stated size. If you cannot name a
      concrete value, the requirement is still too vague.
    - "Every requirement needs at least one scenario, and scenario headings MUST use exactly four hashes
      (`#### Scenario: <name>`). Three hashes fail silently."
    - Add a scenario for each ambiguity the FR leaves open - the order-insensitivity of a "multiset",
      what happens on empty input, which side wins a conflict. Surfacing those is the point of the
      rephrasing pass, not overhead.
    - No class names, no library names, no method signatures, no step-by-step implementation. A spec is a
      behavior contract; if the implementation can change without changing observable behavior, it does not
      belong here - put it in `design.md`.
    - When the correct behavior differs from `docs/specification/**`, fix that clause in the same change;
      a decision that is costly to reverse gets an ADR. Do not re-specify the spec silently here.
    - New capabilities open with a `## Purpose` section of one or two real sentences (50+ characters)
      describing what the capability is for.
  design:
    - Cite the governing ADR by number instead of re-arguing the decision, and OMIT design.md entirely when
      an existing ADR already settles everything. A design doc that only restates ADR-0007 is noise.
    - Write design.md only when the change is cross-cutting across modules, introduces a new external
      dependency, changes the persisted schema, touches a forward-compatibility seam (F1-F9), or contains a
      genuine ambiguity worth deciding before coding.
    - Name the concrete types, packages, and Gradle modules here - this is the one artifact where
      implementation detail belongs. Anchor them to `01_MODULE_INVENTORY.md`.
    - If the change takes an architecturally significant decision that no existing ADR covers, write the ADR
      under `docs/adr/` first and cite it - do not bury the decision in design.md.
    - Open Questions are for genuinely deferrable unknowns. Anything that would change the specs, the
      approach, or the task breakdown must be resolved before tasks.md is written.
  tasks:
    - "R4 - Every checkbox is a full sentence stating WHAT changes and WHY it matters, then the owning
      module. Shape: `- [ ] 2.1 <what changes>. <why it matters / what breaks otherwise>. -> :module`.
      A bare id such as `- [ ] 2.1 FR-DOC-04` is a defect: the reader must know what to do without opening
      another file. A checkbox is a claim, never evidence - the test and the running app are."
    - Group tasks under `## <n>. <group name>` headings and order them by dependency. Keep each task small
      enough to finish in one session.
    - "The FINAL task group is always the green gate, and it always contains: `./gradlew clean build check
      spotlessCheck` green across the WHOLE project with no pre-existing-failure exemption; the change's
      user-visible behaviour exercised in the running app; and `01_MODULE_INVENTORY.md` updated if a module
      or package was added."
    - Name the test type explicitly where the change implies one - WireMock at the HTTP seam for BOTH
      dialects (Ollama-native `/api/*` and OpenAI-compatible `/v1/*`) on provider work; a canonical-equal
      golden round-trip per format on document work; headless TestFX widget + screen/state +
      mockup-conformance on `:ui` work; real temp SQLite + Flyway on persistence work; EN/UK bundle parity
      on i18n work; a `liveLocal`-tagged case on provider work.
    - "Do not add tasks that reintroduce retired machinery: no `trace`/`traceCheck` Gradle task, no
      `docs/traceability.yaml`, no story file, no `Proves:` marker, no `// Covers:` marker, no
      requirement-id coverage script."

operations:
  apply:
    guidance:
      - "Read the Definition of Done in `AGENTS.md` before starting and treat it as the exit gate, not a
        formality: the gate green AND the change exercised in the running app."
      - "The whole-project clean gate is an implicit requirement of EVERY change: `./gradlew clean build
        check spotlessCheck` must pass with zero findings across the whole project, not just touched code.
        There is no pre-existing-failure exemption - if any mechanical check is red anywhere, the change is
        not done until it is fixed."
      - Run `./gradlew spotlessApply` before the gate; the pre-commit hook does the same.
      - "Add the test types the change implies (provider -> WireMock for both dialects; document -> golden
        canonical-equal round trip; pipeline -> e2e against a stub provider; `:ui` -> TestFX widget +
        screen/state + mockup conformance; i18n -> EN/UK bundle parity; persistence -> real temp SQLite +
        Flyway)."
      - Provider-related changes additionally add or update a `liveLocal`-tagged, env-gated test that skips
        cleanly when no local endpoint is configured. It never runs in CI.
      - ArchUnit boundary tests must be green - FX-free core, dependency direction, ports-not-concretes,
        no-http-outside-`:llm`, no-sql-outside-`:persistence`, api-framework-free, records-first,
        bootstrap-no-static-logger.
      - "`:ui` changes must match `docs/specification/mockups/ui-mockup.html` for each named screen, state,
        and theme, asserted structurally and by looked-up palette token."
      - The offline invariant must hold - no new background, scheduled, or unsolicited network call, and no
        telemetry. The only egress is user-triggered provider communication with the configured provider.
      - No secret may be persisted, logged, or placed in an `AppError`. Credentials stay env-var or keychain
        references resolved at call time.
      - Update `docs/implementation_plan/01_MODULE_INVENTORY.md` if the change adds a module or package.
      - Cite any ADR the change relies on and make sure it exists under `docs/adr/` with status `accepted`.
        A decision that is costly to reverse means a new ADR; a spec clause the code legitimately outgrew
        is edited in the same change.
      - "Do not create story files, `docs/traceability.yaml`, a `trace`/`traceCheck` Gradle task, or
        `Proves:` markers. That machinery is retired by ADR-0016."
  archive:
    guidance:
      - Confirm every task in `tasks.md` is checked and the whole-project green gate actually passed before
        archiving - report the command output rather than asserting it.
      - Summarize what moved into `openspec/specs/` and which capability folders were created or changed.
