namesStyle.title=Names & style
namesStyle.subtitle=The scan lists the names and terms it found in the book.\n1. Write the spelling you want in Target.\n2. Set Type and Gender, so the model picks the right forms.\n3. Switch Locked on for anything that must never change.\nOptional: skip it and names are built as the book is translated.
namesStyle.skip=Skip this and the app builds names on the fly as it translates.
namesStyle.skip.tip=This step is optional. Without a glossary, names are decided and remembered while the book is translated.
namesStyle.back=Back to Structure
namesStyle.back.tip=Goes back to the Structure step.
namesStyle.start=Start translation
namesStyle.start.tip=Starts the translation with this glossary and opens the Translating screen.
namesStyle.resume=Resume the run
namesStyle.resume.tip=Continues the paused or stopped translation with this glossary and opens the Translating step. A second translation is never started beside it.
namesStyle.toRun=Back to the run
namesStyle.toRun.tip=Opens the Translating step, where the translation under way is shown. A second translation is never started beside it.
namesStyle.glossary.title=Glossary — proposed
namesStyle.add=+ Add term
namesStyle.add.tip=Adds a term by hand: its source spelling, the target spelling, its type and gender, and whether it is locked.
namesStyle.modelScan=Model scan
namesStyle.modelScan.tip=Asks the chosen model to propose more names and terms. It only adds new, unlocked rows, each with a target suggested by the Book Brief's name policy and marked AI, and never changes existing rows. Needs a model chosen in Settings.
namesStyle.review=Review with model
namesStyle.review.tip=Asks the chosen model whether each unlocked row with no target, or with a target it suggested, is really a name, then suggests a target for each by the Book Brief's name policy. Rows it judges ordinary words are removed, and a type or gender still unset takes its guess. Suggested targets are marked AI until you accept them. Locked rows and targets you chose are never changed, and nothing changes unless every request answers. Needs a model chosen in Settings.
namesStyle.modelStop=Stop
namesStyle.modelStop.tip=Stops the model scan or review under way. The glossary keeps what it had.
namesStyle.search=Search terms and targets
namesStyle.search.tip=Shows only the rows whose term or target contains this text. Press Escape to clear it.
namesStyle.import=Import…
namesStyle.import.tip=Reads a CSV file with the header term,target,type,gender,locked. Rows are matched to existing terms by the term, ignoring case.
namesStyle.export=Export…
namesStyle.export.tip=Saves the table as a CSV file, so the same names can be reused for another book of a series.
namesStyle.column.source=Source term
namesStyle.column.source.tip=The name or term as it appears in the book. Click the header to sort by it.
namesStyle.column.type=Type
namesStyle.column.type.tip=What kind of term it is: character, place, term, title or other. The model uses this as context. Click the header to sort by it.
namesStyle.column.target=Target
namesStyle.column.target.tip=The spelling to use in the translation. Empty means not decided yet. Saved when you press Enter or leave the field.
namesStyle.column.gender=Gender
namesStyle.column.gender.tip=Used for grammatical agreement in the target language. Unknown is fine when it does not matter. A gender marked (suggested) comes from a short built-in list of first names; choose a value to confirm or change it. Click the header to sort by it.
namesStyle.column.locked=Locked
namesStyle.column.locked.tip=Forces this exact target spelling everywhere it appears. A locked term needs a target. Click the header to sort by it.
namesStyle.column.flags=Check
namesStyle.column.flags.tip=Rows that need a look: no target yet, or a term that looks like printing text or an ordinary word rather than a name. Click the header to list the likeliest junk first.
namesStyle.flag.noTarget=No target
namesStyle.flag.noTarget.tip=This term has no target spelling. The model will choose one while translating, and may spell it differently each time.
namesStyle.flag.junk=Likely junk
namesStyle.flag.junk.tip=This term looks like printing text, shouting or an everyday word with a capital rather than a name. Remove its row if it is not one.
namesStyle.remove=Remove
namesStyle.remove.tip=Removes this row from the glossary. It cannot be undone.
namesStyle.empty=No names yet — run Model scan or add a term.
namesStyle.empty.filtered=No name matches the search.
namesStyle.recurring.empty=No recurring terms yet — use Find recurring terms or add one.
namesStyle.recurring.title=Recurring terms
namesStyle.recurring.note=Words and titles the book repeats that must be rendered the same way every time, such as master, Mr or pentacle. Unlike the glossary, which holds the names and terms you decide and applies them exactly, these follow the rendering the book already uses most, or the one you type. While translating, the model reports the rendering it used for each one, and renderings are also learned from the translated text itself. A term the book renders several ways stays blank until one rendering clearly wins. Model scan lets the model pick such words from the book; Review with model drops entries that are not worth tracking.
namesStyle.recurring.find=Find recurring terms
namesStyle.recurring.find.tip=Scans the book's running text for titles and common words it repeats and adds each new one below, without a rendering. Nothing is changed or removed. Works without a model.
namesStyle.recurring.modelScan=Model scan
namesStyle.recurring.modelScan.tip=Shows the model the book's frequent words and adds the ones it says must be rendered the same way every time: titles, roles, objects and terms of the book's world. It only adds rows; nothing is added if a request fails.
namesStyle.recurring.modelReview=Review with model
namesStyle.recurring.modelReview.tip=Asks the model whether each listed term is worth keeping consistent and removes the ones it drops. A term whose rendering you typed is never removed.
