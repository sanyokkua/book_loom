# Book brief screen and the state shared with every screen that needs an open book
brief.title=Book brief
brief.subtitle=This primes the translator's tone for the whole book. Most fields are filled from the file — just review.
brief.card.languages=Languages
brief.suggest=Suggest with model
brief.suggest.tip=Reads the opening of the book and fills in genre, register, narrative voice, audience and narrator for you to review. It changes only these fields.
brief.suggest.done=The model filled in the style fields. Review them before you continue.
brief.suggest.noModel=Choose a provider and model in Settings first.
brief.card.tone=Tone & style
brief.card.policies=Translation policies
brief.card.also=Also translate
brief.card.quality=Quality vs speed
brief.card.quality.tip=Fast uses larger chunks and no reviewer. Balanced adds a reviewer that checks each chunk and fixes what it finds in place. Max quality uses small chunks, a second reviewer pass and a backward-consistency pass, and is the slowest.
brief.soon=not used yet
brief.source.label=Source language
brief.source.label.tip=The language the book is written in. Filled from the file when it declares one; type a name or a language tag to change it.
brief.source.undeclared=The book does not declare a language. Choose the source language to continue.
brief.target.label=Target language
brief.target.required=Required: choose the language to translate into.
brief.target.untested=Untested language: its translation rules are not tested yet, so the general rules are used.
brief.target.untested.tip=Quotation marks, gender, forms of address and false friends are written down and tested per language. This language has none yet, so the model gets only general advice. Translation works; check the result more closely.
brief.target.label.tip=The language to translate into. Type to search, or enter any language name or tag.
brief.tone.genre=Genre
brief.tone.genre.tip=Helps the model choose fitting vocabulary and rhythm. Pick from the list or type your own.
brief.tone.genre.prompt=Choose or type, e.g. Gothic novel
brief.tone.register=Register
brief.tone.register.tip=How formal the translation should sound: literary and formal, neutral, or casual and conversational.
brief.register.formal=Formal / literary
brief.register.neutral=Neutral
brief.register.casual=Casual
brief.tone.voice=Narrative voice / era notes
brief.tone.voice.tip=Free-form notes for the translator, such as the era or the narrator's manner. They become part of the instructions the model receives, so keep them short.
brief.tone.voice.prompt=e.g. early-19th-century English, elevated diction
brief.tone.audience=Audience
brief.tone.audience.tip=Who will read the translation. It guides word choice and how simple or dense the language should be.
brief.tone.audience.prompt=e.g. general adult readers
brief.tone.narrator=Narrator
brief.tone.narrator.tip=Who tells the story. For a first-person narrator, pick the gender too: Ukrainian and other languages show it in past-tense verbs, and BookLoom then checks the narrator's own words against it.
brief.narrator.unspecified=Not stated
brief.narrator.first=First person
brief.narrator.third=Third person
brief.tone.narrator.gender=Narrator gender
brief.tone.narrator.gender.tip=The first-person narrator's gender. A character who speaks in quotes keeps their own gender. Available once the narrator is in first person.
brief.narrator.gender.unknown=Not stated
brief.narrator.gender.male=Male
brief.narrator.gender.female=Female
brief.policy.names=Character & place names
brief.policy.names.tip=What to do with names of people and places: translate them, write them in the target alphabet, or keep the original spelling.
brief.policy.foreign=Foreign-language passages
brief.policy.foreign.tip=What to do with passages in a third language inside the book: keep them as they are, translate them, or translate and add a note.
brief.policy.foreign.hint=The default keeps a foreigner sounding foreign (Elvish, Latin…).
brief.policy.footnotes=Footnotes
brief.policy.footnotes.tip=Whether footnote text is translated or kept in the original language.
brief.policy.units=Units
brief.policy.units.tip=Whether measures such as miles and pounds stay as written or are converted to metric.
brief.policy.balance=Faithful ↔ natural balance
brief.policy.balance.tip=Left follows the wording and sentence structure of the book as closely as the target language allows. Right lets the translator reshape sentences for natural, idiomatic prose while keeping the meaning. The slider works in five steps: 0–19, 20–39, 40–59, 60–79 and 80–100.
brief.policy.balance.hint=literal · balanced · free
brief.help.names.translate=Uses the natural name in the target language: the established form where one exists, and a translation by meaning for speaking names such as nicknames and titles. Falls back to spelling by sound.
brief.help.names.transliterate=Writes every name in the target alphabet by its sound and never translates its meaning. A real place or person with an established name there keeps it. This is the default.
brief.help.names.keepOriginal=Leaves names exactly as written in the source. Glossary rows then work as ordinary terms.
brief.help.foreign.keep=Passages deliberately written in another language (Elvish, Latin…) stay untouched. This is the default.
brief.help.foreign.translate=Translates them like the rest of the book.
brief.help.foreign.translateNote=Translates them and adds the original wording in parentheses right after.
brief.help.footnotes.translate=Footnotes and endnotes are translated.
brief.help.footnotes.keep=Footnote text stays in the source language.
brief.help.units.keep=Measures stay as written (miles, pounds, feet).
brief.help.units.metric=Measurements in the text are converted to metric (kilometres, kilograms, metres).
brief.help.register.formal=Elevated, literary wording: full sentences, no slang, polite forms of address.
brief.help.register.neutral=Plain, standard wording that suits most books. This is the default.
brief.help.register.casual=Conversational wording: contractions, colloquial words, everyday forms of address.
brief.help.narrator.unspecified=The story is not told by a character, or you do not know. The narrator's own words are not checked for gender.
brief.help.narrator.first=A character tells the story as "I". The target language may show the narrator's gender in verbs, so choose the gender below.
brief.help.narrator.third=The story is told from outside, as "he/she/they". The narrator has no gender to match.
brief.help.gender.unknown=The narrator's gender is not set; BookLoom will not correct the narrator's verbs.
brief.help.gender.male=The narrator is male: past-tense verbs and adjectives of the narrator's own words take masculine forms.
brief.help.gender.female=The narrator is female: past-tense verbs and adjectives of the narrator's own words take feminine forms.
