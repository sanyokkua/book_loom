brief.narrator.notice=The book is narrated in the first person — choose the narrator's gender.
brief.narrator.notice.tip=BookLoom read the source and found that its narration says "I". Pick Male or Female so the translation's past-tense words agree with the narrator. BookLoom has preselected First person, which you can change; the gender stays unset until you choose.
