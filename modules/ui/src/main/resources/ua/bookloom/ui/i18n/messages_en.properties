error.code.title={0, select, auth {The AI model refused the key} timeout {The AI model took too long} ratelimited {The AI model asked to slow down} unreachable {The AI model does not answer} modelnotfound {The AI model was not found} discoveryfailed {The list of models could not be read} modelunavailable {The chosen AI model is not available} upstream {The AI model's program failed} missingcredential {The key is missing} contextwindow {The text is too long for the AI model} emptycompletion {The AI model gave an empty answer} cancelled {Stopped} validation {This could not be done} internal {Something went wrong} busy {Busy right now} other {Something went wrong}}
error.code.message={0, select, auth {The key was not accepted. Check it in Settings › Providers.} timeout {No answer came in time. Try again in a moment.} ratelimited {Too many requests were sent. Wait a little, then try again.} unreachable {Nothing answers at the AI model's address. Check that its program is open.} modelnotfound {The AI model's program does not know this model. Choose another in Settings.} discoveryfailed {The AI model's program answered, but its list of models could not be read.} modelunavailable {The model this translation uses is not offered now. Open its program or choose another model.} upstream {The AI model's program reported an error of its own. Try again in a moment.} missingcredential {The environment variable that holds the key is not set. Check it in Settings › Providers.} contextwindow {The request does not fit the model's context window. Send less text or choose a larger window.} emptycompletion {The AI model answered with nothing. Try again, or choose another model.} cancelled {It was stopped before it finished.} validation {Something in the input or the book is not valid. The details say what.} internal {An unexpected failure stopped it. The details and the log say more.} busy {Another task is using it now. Try again when it ends.} other {An unexpected failure stopped it. The details and the log say more.}}
error.reason.message={0, select, folder_missing {The folder to save into does not exist. Create it or choose another folder.} access_denied {BookLoom may not write to this folder. Choose another folder or allow writing to it.} read_only {The folder, the file or the disk is read-only. Choose a folder on a disk you can write to.} disk_full {There is not enough free space on the disk. Free some space or choose another disk.} not_utf8 {The file is not saved as UTF-8 text. Save it as CSV in UTF-8 and import it again.} csv_header {The first line must name the columns term, target, type, gender and locked, each once.} other {Something went wrong. The details say more.}}
