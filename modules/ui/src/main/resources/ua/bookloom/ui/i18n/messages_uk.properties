brief.source.use.tip=Встановлює мовою оригіналу ту, яку модель знайшла в прочитаних уривках. Більше нічого не змінюється.
brief.source.undeclared=З «Авто» мову визначить модель за текстом, а чужомовний фрагмент, написаний тим самим письмом, що й книга, залишається на розсуд моделі. Оберіть мову оригіналу, якщо знаєте її.
brief.target.label=Мова перекладу
brief.target.required=Обовʼязково: оберіть мову, на яку перекладати.
brief.target.untested=Неперевірена мова: її правила перекладу ще не перевірено, тому діють загальні правила.
brief.target.untested.tip=Лапки, рід, форми звертання та хибні друзі перекладача записані й перевірені для кожної мови окремо. Для цієї мови їх ще немає, тому модель отримує лише загальні поради. Переклад працює; перевіряйте результат уважніше.
brief.target.label.tip=Мова, на яку перекладати. Введіть для пошуку або впишіть будь-яку назву чи тег мови.
brief.tone.genre=Жанр
brief.tone.genre.tip=Допомагає моделі добрати доречну лексику й ритм. Оберіть зі списку або впишіть власний жанр.
