brief.card.title=Назва й автор
brief.bookTitle=Назва
brief.bookTitle.tip=Назва книжки мовою перекладу. Її перекладають разом із книжкою; змініть її тут, і той самий текст буде записано всюди, де стоїть назва: у властивостях книжки, у змісті, на титульній сторінці та в запропонованій назві файлу.
brief.bookAuthor=Автор
brief.bookAuthor.tip=Ім'я автора мовою перекладу. Його перекладають разом із книжкою; змініть його тут, і те саме написання буде у властивостях книжки, у ключі сортування за автором і в запропонованій назві файлу.
brief.bookTitle.source=Оригінал: {0}
brief.bookTitle.hint=З'являється, коли книжку перекладено. Назва може мати значення, якого модель не вловила, тому перевірте її й за потреби виправте тут.
export.title.hint=Назва й автор у назві файлу та в книжці беруться з Опису книжки; змінюйте їх там.
