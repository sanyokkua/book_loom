brief.card.quality=Якість чи швидкість
brief.card.quality.tip=Швидко: більші шматки й без рецензента. Збалансовано: додається рецензент, що перевіряє кожен шматок і виправляє знайдене на місці. Максимальна якість: малі шматки, другий прохід рецензента й зворотна перевірка узгодженості; найповільніше: на одній тестовій книзі з малою локальною моделлю — приблизно на п’яту частину менше помилок, ніж Збалансовано, за приблизно в 1,8 раза довший час.
