# 15e.14 narrator detection
brief.narrator.notice=Книга розповідається від першої особи — оберіть стать оповідача.
brief.narrator.notice.tip=BookLoom прочитав оригінал і побачив, що в оповіді є «я». Оберіть «Чоловіча» або «Жіноча», щоб слова минулого часу в перекладі узгоджувалися з оповідачем. BookLoom уже обрав «Перша особа», це можна змінити; стать залишається невизначеною, доки ви її не оберете або доки «Запропонувати за допомогою моделі» не знайде її у словах книги.
dialog.narrator.title=Хто розповідає?
dialog.narrator.text=Книга розповідається від першої особи. Оберіть стать оповідача, щоб дієслова й прикметники перекладу з нею узгоджувалися.
dialog.narrator.male=Чоловіча
dialog.narrator.male.tip=Вказує в Описі книги оповідача від першої особи чоловічої статі й починає переклад.
dialog.narrator.female=Жіноча
dialog.narrator.female.tip=Вказує в Описі книги оповідача від першої особи жіночої статі й починає переклад.
dialog.narrator.unknown=Не вказано — почати все одно
dialog.narrator.unknown.tip=Починає переклад без статі оповідача; модель тримається статі, яку показує оригінал, і перевірка статі не виконується.
dialog.narrator.back=Назад
dialog.narrator.back.tip=Закриває це запитання без початку перекладу, щоб вказати оповідача в Описі книги.
dialog.genders.title=Персонажі без статі
dialog.genders.text={0, plural, one {Цей персонаж часто згадується} few {Ці персонажі часто згадуються} many {Ці персонажі часто згадуються} other {Ці персонажі часто згадуються}} у книжці, але стать не вказано, тому дієслова й прикметники про них можуть вийти не в тому роді. Вкажіть її в «Імена та стиль» або почніть так і виправте пізніше: наступний експорт заново перекладе ці сегменти.
