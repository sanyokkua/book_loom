brief.suggest.noModel=Спершу оберіть постачальника й модель у налаштуваннях.
brief.evidence.quoted=«{0}» · {1, plural, one {# з {2} зразків збігається} few {# з {2} зразків збігаються} many {# з {2} зразків збігаються} other {# з {2} зразків збігаються}}
brief.evidence.agreed={0, plural, one {# з {1} зразків збігається} few {# з {1} зразків збігаються} many {# з {1} зразків збігаються} other {# з {1} зразків збігаються}}
brief.evidence.agreed.tip=Модель прочитала два окремі зразки книги. Тут видно, скільки з них дали цю відповідь, і слова з книги, які вона навела. Поле заповнюється, лише коли обидва зразки збігаються.
brief.evidence.uncertain=Невпевнено
brief.evidence.uncertain.tip=Два зразки книги не збіглися щодо цього поля або цитату моделі не знайдено в книзі, тож пропозиція залишила його без змін. Оберіть значення самі.
brief.card.tone=Тон і стиль
brief.card.policies=Правила перекладу
brief.card.also=Також перекладати
brief.card.quality=Якість чи швидкість
brief.card.quality.tip=Швидко: більші шматки й без рецензента. Збалансовано: додається рецензент, що перевіряє кожен шматок і виправляє знайдене на місці. Максимальна якість: малі шматки, другий прохід рецензента й зворотна перевірка узгодженості; найповільніше.
brief.soon=поки не використовується
brief.source.label=Мова оригіналу
brief.source.label.tip=Мова, якою написано книгу. Заповнюється з файлу, якщо він її вказує; введіть назву або тег мови, щоб змінити.
brief.source.undeclared=Книга не зазначає мову. Оберіть мову оригіналу, щоб продовжити.
brief.target.label=Мова перекладу
brief.target.required=Обовʼязково: оберіть мову, на яку перекладати.
brief.target.untested=Неперевірена мова: її правила перекладу ще не перевірено, тому діють загальні правила.
brief.target.untested.tip=Лапки, рід, форми звертання та хибні друзі перекладача записані й перевірені для кожної мови окремо. Для цієї мови їх ще немає, тому модель отримує лише загальні поради. Переклад працює; перевіряйте результат уважніше.
brief.target.label.tip=Мова, на яку перекладати. Введіть для пошуку або впишіть будь-яку назву чи тег мови.
brief.tone.genre=Жанр
brief.tone.genre.tip=Допомагає моделі добрати доречну лексику й ритм. Оберіть зі списку або впишіть власний жанр.
brief.tone.genre.prompt=Оберіть або введіть, напр., готичний роман
brief.tone.register=Регістр
brief.tone.register.tip=Наскільки офіційно має звучати переклад: літературно й урочисто, нейтрально чи невимушено.
brief.register.formal=Формальний / літературний
brief.register.neutral=Нейтральний
brief.register.casual=Розмовний
brief.tone.voice=Голос оповіді та епоха
brief.tone.voice.tip=Довільні нотатки для перекладача, наприклад епоха чи манера оповідача. Вони стають частиною інструкцій для моделі, тож пишіть коротко.
brief.tone.voice.prompt=напр., англійська початку XIX століття, піднесена лексика
brief.tone.audience=Цільова аудиторія
brief.tone.audience.tip=Хто читатиме переклад. Це впливає на добір слів і на те, наскільки простою чи щільною буде мова.
brief.tone.narrator=Оповідач
brief.tone.narrator.tip=Хто розповідає історію. Для оповідача від першої особи вкажіть ще й стать: українська та інші мови показують її в дієсловах минулого часу, і BookLoom перевіряє слова оповідача на відповідність.
brief.narrator.unspecified=Не вказано
brief.narrator.first=Перша особа
brief.narrator.third=Третя особа
brief.tone.narrator.gender=Стать оповідача
brief.tone.narrator.gender.tip=Стать оповідача від першої особи. Персонаж, що говорить у лапках, зберігає власну стать. Доступно, коли оповідач від першої особи.
brief.narrator.gender.unknown=Не вказано
brief.narrator.gender.male=Чоловіча
brief.narrator.gender.female=Жіноча
brief.narrator.gender.suggested={0} (припущення)
brief.narrator.gender.suggested.tip=Пропозиція стилю знайшла стать оповідача в книзі: інший персонаж називає оповідача на ім’я або звертається до нього «пане», «пані» чи подібно. Перевірте цитату нижче; оберіть стать, щоб змінити її.
brief.tone.audience.prompt=напр., широке коло дорослих читачів
brief.policy.names=Імена й топоніми
brief.policy.names.tip=Що робити з іменами людей і назвами місць: перекладати, записувати літерами цільової мови чи лишати оригінальне написання.
brief.policy.foreign=Уривки іншими мовами
brief.policy.foreign.tip=Що робити з уривками третьою мовою всередині книги: лишати як є, перекладати або перекладати з приміткою.
brief.policy.foreign.hint=За замовчуванням чужомовні репліки лишаються чужомовними (ельфійська, латина…).
brief.policy.footnotes=Виноски
brief.policy.footnotes.tip=Чи перекладати текст приміток, чи лишати його мовою оригіналу.
brief.policy.units=Одиниці виміру
brief.policy.units.tip=Чи лишати міри, як-от милі й фунти, як написано, чи переводити в метричні.
brief.policy.balance=Вірність ↔ природність
brief.policy.balance.tip=Ліворуч — триматися слів і будови речень книги так близько, як дозволяє цільова мова. Праворуч — вільно перебудовувати речення заради природної, ідіоматичної мови зі збереженням змісту. Повзунок має п’ять ступенів: 0–19, 20–39, 40–59, 60–79 і 80–100.
brief.policy.balance.hint=буквально · зважено · вільно
brief.help.names.translate=Використовує природну назву цільовою мовою: усталену форму, якщо вона є, і переклад за змістом для промовистих імен, як-от прізвиська й титули. Якщо такої немає, передає звучання літерами.
brief.help.names.transliterate=Записує кожне ім’я літерами цільової мови за звучанням і не перекладає його значення. Справжнє місце чи особа з усталеною там назвою зберігає її. Це типовий вибір.
brief.help.names.keepOriginal=Залишає імена точно так, як у джерелі. Рядки глосарія тоді працюють як звичайні терміни.
brief.help.foreign.keep=Уривки, свідомо написані іншою мовою (ельфійська, латина…), лишаються без змін. Це типовий вибір.
brief.help.foreign.translate=Перекладає їх так само, як решту книги.
brief.help.foreign.translateNote=Перекладає їх і додає оригінальне формулювання в дужках одразу після перекладу.
brief.help.footnotes.translate=Виноски й кінцеві примітки перекладаються.
brief.help.footnotes.keep=Текст приміток лишається мовою джерела.
brief.help.units.keep=Міри лишаються як написано (милі, фунти, фути).
brief.help.units.metric=Міри в тексті переводяться в метричні (кілометри, кілограми, метри).
brief.help.register.formal=Піднесена, літературна лексика: повні речення, без сленгу, ввічливі звертання.
brief.help.register.neutral=Простий, стандартний виклад, що підходить більшості книг. Це типовий вибір.
brief.help.register.casual=Розмовна лексика: скорочення, просторічні слова, буденні звертання.
brief.help.narrator.unspecified=Оповідь веде не персонаж, або ви не знаєте, хто. Слова оповідача не перевіряються на рід.
brief.help.narrator.first=Персонаж розповідає від першої особи («я»). Цільова мова може виражати стать оповідача в дієсловах, тому оберіть стать нижче.
brief.help.narrator.third=Історія розповідається ззовні, від третьої особи. Оповідач не має статі, яку треба узгоджувати.
brief.help.gender.unknown=Стать оповідача не задано; BookLoom не виправлятиме дієслів оповідача.
brief.help.gender.male=Оповідач — чоловік: дієслова минулого часу й прикметники в мовленні оповідача мають чоловічий рід.
brief.help.gender.female=Оповідач — жінка: дієслова минулого часу й прикметники в мовленні оповідача мають жіночий рід.
