namesStyle.acceptAll.tip=Підтверджує як ваші всі переклади, які запропонувала модель (позначені ШІ). Підтверджений переклад під час перекладу застосовується точно, і наступна перевірка моделлю його вже не замінить. Пропозиція, яку не переглянули до початку перекладу, править лише за підказку.
