brief.suggest=✦ Заповнити з книги
brief.suggest.tip=Питає, що модель знає про книжку, читає кілька уривків з різних місць історії, а тоді визначає жанр, регістр, голос оповіді, аудиторію й оповідача, щоб ви їх переглянули. Поле заповнюється, лише коли більшість уривків збігається або це підтверджує те, що модель знає про цю книжку. Змінює лише ці поля.
