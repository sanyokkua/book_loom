namesStyle.confirmGenders.tip=Робить вашою кожну припущену стать персонажа (позначену «припущення»). Підтверджена стать зберігається під час перекладу, і наступна перевірка моделлю її не замінить. Список результатів дозволяє це скасувати.
namesStyle.accept=Прийняти пропозицію
namesStyle.accept.tip=Підтверджує цей запропонований переклад як ваш. Те саме робить Enter у полі без змін; інший введений переклад або закріплення рядка теж роблять його вашим.
