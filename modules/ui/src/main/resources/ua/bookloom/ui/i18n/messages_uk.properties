structure.segments.hint=Сегменти вибраної частини в порядку читання — такими їх побачить переклад. Позначка на кшталт 1/3 — запланований блок, у якому чернетка цього сегмента. Лінія над рядком відкриває новий блок. Виберіть рядок, щоб прочитати його повністю.
