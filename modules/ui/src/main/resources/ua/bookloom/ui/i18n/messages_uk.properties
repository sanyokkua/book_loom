export.consistency.title=Завершальна перевірка узгодженості
export.consistency.note=Перед записом книги модель перекладає кожен позначений або сумнівний сегмент ще раз і зберігає новий текст, лише якщо він кращий, потім перечитує кожен такий абзац разом з абзацами до і після нього та виправляє імена, терміни, рід і закінчення, що не збігаються; за найвищої якості перечитується кожен абзац. Відповідь, що прибрала б лапки, речення чи ім’я, відхиляється. Також повертає термін глосарія, який ви змінили пізніше. Ваші власні правки не змінюються.
export.consistency.title.tip=Виконується перед записом книги й потребує вибраної моделі. Спершу позначені та сумнівні сегменти перекладаються ще раз, і новий переклад зберігається, лише якщо він кращий і нічого не втрачає. Потім кожен виправлений, позначений або сумнівний абзац (за найвищої якості — кожен абзац) звіряється з абзацами до і після нього, показаними як оригінал і переклад, з вашим глосарієм, повторюваними термінами, персонажами та стислим змістом; модель виправляє розбіжності в іменах, термінах, роді й закінченнях. Термін глосарія, який ви змінили після використання, підставляється, а рядки, де стать персонажа стала відома, перекладаються заново. Сегменти, які ви редагували, лишаються такими, як ви їх написали.
