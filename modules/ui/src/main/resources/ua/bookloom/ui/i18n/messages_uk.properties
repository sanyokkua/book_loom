export.consistency.note=Рекомендовано. Перечитує сегменти, які потребували виправлень, поруч із сусідніми.
export.consistency.title.tip=Виконується перед записом книги й потребує вибраної моделі. Спершу сегменти для перегляду та сумнівні перекладаються ще раз, і новий переклад зберігається, лише якщо він кращий і нічого не втрачає. Потім кожен виправлений, сумнівний або для перегляду абзац (за найвищої якості — кожен абзац тексту, який зворотна перевірка ще не підтвердила; навігація та вступні сторінки — ніколи) звіряється з абзацами до і після нього, показаними як оригінал і переклад, з вашим глосарієм, повторюваними термінами, персонажами та стислим змістом; модель виправляє розбіжності в іменах, термінах, роді й закінченнях. Термін глосарія, який ви змінили після використання, підставляється, а рядки, де стать персонажа стала відома, перекладаються заново. Сегменти, які ви редагували, лишаються такими, як ви їх написали.
