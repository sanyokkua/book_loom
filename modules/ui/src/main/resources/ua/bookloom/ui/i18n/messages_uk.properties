brief.narrator.gender.suggested.tip=Пропозиція стилю знайшла стать оповідача в книзі: інший персонаж називає оповідача на ім’я або звертається до нього «пане», «пані» чи подібно. Перевірте цитату нижче; оберіть стать, щоб змінити її.
brief.tone.audience.prompt=напр., широке коло дорослих читачів
brief.policy.names=Імена й топоніми
brief.policy.names.tip=Що робити з іменами людей і назвами місць: перекладати, записувати літерами цільової мови чи лишати оригінальне написання.
brief.policy.foreign=Уривки іншими мовами
brief.policy.foreign.tip=Що робити з уривками третьою мовою всередині книги: лишати як є, перекладати або перекладати з приміткою.
brief.policy.foreign.hint=За замовчуванням чужомовні репліки лишаються чужомовними (ельфійська, латина…).
brief.policy.footnotes=Виноски
brief.policy.footnotes.tip=Чи перекладати текст приміток, чи лишати його мовою оригіналу.
brief.policy.units=Одиниці виміру
brief.policy.units.tip=Чи лишати міри, як-от милі й фунти, як написано, чи переводити в метричні.
brief.policy.balance=Вірність ↔ природність
brief.policy.balance.tip=Ліворуч — триматися слів і будови речень книги так близько, як дозволяє цільова мова. Праворуч — вільно перебудовувати речення заради природної, ідіоматичної мови зі збереженням змісту. Повзунок має п’ять ступенів: 0–19, 20–39, 40–59, 60–79 і 80–100.
brief.policy.balance.hint=буквально · зважено · вільно
brief.help.names.translate=Використовує природну назву цільовою мовою: усталену форму, якщо вона є, і переклад за змістом для промовистих імен, як-от прізвиська й титули. Якщо такої немає, передає звучання літерами.
brief.help.names.transliterate=Записує кожне ім’я літерами цільової мови за звучанням і не перекладає його значення. Справжнє місце чи особа з усталеною там назвою зберігає її. Це типовий вибір.
brief.help.names.keepOriginal=Залишає імена точно так, як у джерелі. Рядки глосарія тоді працюють як звичайні терміни.
brief.help.foreign.keep=Уривки, свідомо написані іншою мовою (ельфійська, латина…), лишаються без змін. Це типовий вибір.
brief.help.foreign.translate=Перекладає їх так само, як решту книги.
brief.help.foreign.translateNote=Перекладає їх і додає оригінальне формулювання в дужках одразу після перекладу.
brief.help.footnotes.translate=Виноски й кінцеві примітки перекладаються.
brief.help.footnotes.keep=Текст приміток лишається мовою джерела.
brief.help.units.keep=Міри лишаються як написано (милі, фунти, фути).
brief.help.units.metric=Міри в тексті переводяться в метричні (кілометри, кілограми, метри).
brief.help.register.formal=Піднесена, літературна лексика: повні речення, без сленгу, ввічливі звертання.
brief.help.register.neutral=Простий, стандартний виклад, що підходить більшості книг. Це типовий вибір.
brief.help.register.casual=Розмовна лексика: скорочення, просторічні слова, буденні звертання.
brief.help.narrator.unspecified=Оповідь веде не персонаж, або ви не знаєте, хто. Слова оповідача не перевіряються на рід.
brief.help.narrator.first=Персонаж розповідає від першої особи («я»). Цільова мова може виражати стать оповідача в дієсловах, тому оберіть стать нижче.
brief.help.narrator.third=Історія розповідається ззовні, від третьої особи. Оповідач не має статі, яку треба узгоджувати.
brief.help.gender.unknown=Стать оповідача не задано; BookLoom не виправлятиме дієслів оповідача.
brief.help.gender.male=Оповідач — чоловік: дієслова минулого часу й прикметники в мовленні оповідача мають чоловічий рід.
brief.help.gender.female=Оповідач — жінка: дієслова минулого часу й прикметники в мовленні оповідача мають жіночий рід.
brief.option.translate=Перекладати
