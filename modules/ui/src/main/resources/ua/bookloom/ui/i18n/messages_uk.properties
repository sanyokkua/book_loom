brief.tone.voice.tip=Довільні нотатки для перекладача, наприклад епоха чи манера оповідача. Вони стають частиною інструкцій для моделі, тож пишіть коротко.
brief.tone.voice.prompt=напр., англійська початку XIX століття, піднесена лексика
brief.tone.audience=Цільова аудиторія
brief.tone.audience.tip=Хто читатиме переклад. Це впливає на добір слів і на те, наскільки простою чи щільною буде мова.
brief.tone.narrator=Оповідач
brief.tone.narrator.tip=Хто розповідає історію. Для оповідача від першої особи вкажіть ще й стать: українська та інші мови показують її в дієсловах минулого часу, і BookLoom перевіряє слова оповідача на відповідність.
brief.narrator.unspecified=Не вказано
