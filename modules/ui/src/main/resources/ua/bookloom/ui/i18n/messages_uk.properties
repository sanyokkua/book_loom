namesStyle.recurring.helpLink=Як це працює
namesStyle.recurring.helpLink.tip=Показує або ховає, як повторювані терміни отримують переклад.
namesStyle.recurring.help=BookLoom зберігає переклад, який книга вживає найчастіше, або той, що ви впишете. Слово, перекладене по-різному, лишається порожнім, доки один варіант явно не переможе.
namesStyle.recurring.modelScan.tip=Спершу знаходить в основному тексті книги звертання та поширені слова, що повторюються, без моделі, потім показує моделі частотні слова книги й додає ті, які, за її словами, мають перекладатися щоразу однаково: звертання, ролі, предмети й терміни світу книги. Лише додає рядки; якщо запит не вдався, від моделі нічого не додається. Потрібна модель, обрана в налаштуваннях.
namesStyle.recurring.modelReview.tip=Питає модель, чи варто відстежувати кожен термін зі списку, і прибирає ті, які вона відкидає. Термін, відтворення якого ви ввели, не прибирається ніколи.
namesStyle.recurring.modelScanned={0, plural, one {Модель додала # повторюваний термін.} few {Модель додала # повторювані терміни.} many {Модель додала # повторюваних термінів.} other {Модель додала # повторюваного терміну.}}
namesStyle.recurring.modelSkipped=Знайдено в тексті. Крок із моделлю пропущено: оберіть модель у налаштуваннях моделі, щоб його виконати.
namesStyle.recurring.modelReviewed={0, plural, one {Модель прибрала # термін, який не варто відстежувати.} few {Модель прибрала # терміни, які не варто відстежувати.} many {Модель прибрала # термінів, які не варто відстежувати.} other {Модель прибрала # терміну, які не варто відстежувати.}}
namesStyle.recurring.suggest.tip=Просить обрану модель дати відповідник для кожного терміна, що його ще не має, за налаштуваннями картки книги. Пропозиція — лише підказка, доки чернетка нею не скористається або ви її не зміните. Потрібна модель, обрана в налаштуваннях.
namesStyle.recurring.add.prompt=Додати слово чи звертання
namesStyle.recurring.add.prompt.tip=Введіть слово чи звертання, що повторюється в книзі, і натисніть Enter або «Додати». Це для слова, яке сканування не відрізняє від інших, наприклад такого, що завжди пишеться з малої літери.
namesStyle.recurring.add=+ Додати
namesStyle.recurring.add.tip=Відкриває невелику картку для слова чи звертання, що повторюється в книзі, і додає його до списку без відповідника.
namesStyle.recurring.import=Імпорт...
namesStyle.recurring.import.tip=Читає файл CSV із заголовком term,target. Термін, що є у списку без вашого відповідника, отримує відповідник із файлу, відповідник, який ви ввели чи імпортували, зберігається, новий термін додається, а термін, що вже є в глосарії, відхиляється.
namesStyle.recurring.export=Експорт...
