structure.check.failedCounts=Перевірку циклу не пройдено — структуру не збережено ({0} з {1, plural, one {# сегмента} few {# сегментів} many {# сегментів} other {# сегмента}})
structure.check.unavailable=Перевірку циклу не вдалося виконати.
structure.check.idsOk=Усі ідентифікатори зображень, шрифтів і посилань збережено
structure.check.idsMissing=Ідентифікатори, втрачені після циклу: {0}
structure.check.oversized={0, plural, one {# сегмент перевищує бюджет чанка — його буде розбито за реченнями й зібрано назад.} few {# сегменти перевищують бюджет чанка — їх буде розбито за реченнями й зібрано назад.} many {# сегментів перевищують бюджет чанка — їх буде розбито за реченнями й зібрано назад.} other {# сегмента перевищують бюджет чанка — їх буде розбито за реченнями й зібрано назад.}}
namesStyle.title=Імена та стиль
namesStyle.subtitle=Сканування перелічує імена й терміни, які знайшло в книзі.\n1. Впишіть бажане написання в колонку «Переклад».\n2. Задайте «Тип» і «Рід», щоб модель добирала правильні форми.\n3. Увімкніть «Закріплено» для всього, що не має змінюватися ніколи.\nНеобов’язково: пропустіть, і імена складатимуться під час перекладу книги.
namesStyle.skip=Пропустіть це, і застосунок складатиме імена просто під час перекладу.
namesStyle.skip.tip=Цей крок необовʼязковий. Без глосарію імена визначаються й запамʼятовуються під час перекладу книги.
namesStyle.back=Назад до структури
namesStyle.back.tip=Повертає до кроку «Структура».
namesStyle.start=Почати переклад
namesStyle.start.tip=Запускає переклад із цим глосарієм і відкриває екран «Переклад».
namesStyle.resume=Продовжити переклад
namesStyle.resume.tip=Продовжує призупинений чи зупинений переклад із цим глосарієм і відкриває крок «Переклад». Другий переклад поруч із ним ніколи не починається.
namesStyle.toRun=Повернутися до перекладу
namesStyle.toRun.tip=Відкриває крок «Переклад», де видно поточний переклад. Другий переклад поруч із ним ніколи не починається.
namesStyle.glossary.title=Глосарій — запропоновано
namesStyle.add=+ Додати термін
namesStyle.add.tip=Додає термін уручну: його початкове написання, переклад, тип і рід, а також чи закріплений він.
namesStyle.modelScan=Сканування моделлю
namesStyle.modelScan.tip=Просить обрану модель запропонувати ще імена й терміни. Додає лише нові незакріплені рядки, кожен із перекладом, запропонованим за правилом імен з картки книги й позначеним ШІ, і ніколи не змінює наявні рядки. Потрібна модель, обрана в налаштуваннях.
namesStyle.review=Перевірити моделлю
namesStyle.review.tip=Просить обрану модель визначити, чи кожен незакріплений рядок без перекладу або із запропонованим нею перекладом справді є іменем, а потім запропонувати переклад для кожного за правилом імен з картки книги. Рядки, які модель вважає звичайними словами, вилучаються, а ще не заданий тип чи рід отримує її здогад. Запропоновані переклади позначено ШІ, доки ви їх не приймете. Закріплені рядки й обрані вами переклади ніколи не змінюються, і нічого не змінюється, доки не відповідять усі запити. Потрібна модель, обрана в налаштуваннях.
namesStyle.modelStop=Зупинити
namesStyle.modelStop.tip=Зупиняє сканування чи перевірку моделлю. Глосарій лишається таким, яким був.
namesStyle.search=Пошук термінів і перекладів
namesStyle.search.tip=Показує лише рядки, чий термін або переклад містить цей текст. Натисніть Escape, щоб очистити.
namesStyle.import=Імпорт…
namesStyle.import.tip=Читає файл CSV із заголовком term,target,type,gender,locked. Рядки зіставляються з наявними термінами за терміном без урахування регістру.
namesStyle.export=Експорт…
namesStyle.export.tip=Зберігає таблицю як файл CSV, щоб ті самі імена можна було використати для іншої книги серії.
namesStyle.column.source=Вихідний термін
namesStyle.column.source.tip=Імʼя або термін так, як вони трапляються в книзі. Клацніть заголовок, щоб упорядкувати за ним.
namesStyle.column.type=Тип
namesStyle.column.type.tip=Який це термін: персонаж, місце, термін, титул чи інше. Модель використовує це як контекст. Клацніть заголовок, щоб упорядкувати за ним.
namesStyle.column.target=Переклад
namesStyle.column.target.tip=Написання для перекладу. Порожньо означає, що ще не визначено. Зберігається, коли ви натискаєте Enter або полишаєте поле.
namesStyle.column.gender=Рід
namesStyle.column.gender.tip=Потрібен для граматичного узгодження в мові перекладу. «Невідомо» підходить, коли це не важливо. Рід із позначкою (припущення) узято з короткого вбудованого списку імен; оберіть значення, щоб підтвердити або змінити його. Клацніть заголовок, щоб упорядкувати за ним.
namesStyle.column.locked=Закріплено
namesStyle.column.locked.tip=Примусово використовує саме це написання скрізь, де воно трапляється. Закріплений термін потребує перекладу. Клацніть заголовок, щоб упорядкувати за ним.
namesStyle.column.flags=Перевірити
namesStyle.column.flags.tip=Рядки, які варто переглянути: ще без перекладу або термін, схожий на друковану службову фразу чи звичайне слово, а не на ім’я. Клацніть заголовок, щоб спершу показати найімовірніше сміття.
namesStyle.flag.noTarget=Без перекладу
namesStyle.flag.noTarget.tip=Для цього терміна не вказано написання. Модель обере його під час перекладу й може щоразу писати по-різному.
namesStyle.flag.junk=Ймовірно сміття
namesStyle.flag.junk.tip=Цей термін схожий на друковану службову фразу, слово великими літерами або звичайне слово з великої літери, а не на ім’я. Видаліть його рядок, якщо це не ім’я.
namesStyle.remove=Вилучити
namesStyle.remove.tip=Вилучає цей рядок із глосарію. Скасувати це не можна.
namesStyle.empty=Імен ще немає — запустіть «Скан моделлю» або додайте термін.
namesStyle.empty.filtered=Жодне ім’я не відповідає пошуку.
namesStyle.recurring.empty=Повторюваних термінів ще немає — натисніть «Знайти повторювані терміни» або додайте свій.
namesStyle.recurring.title=Повторювані терміни
namesStyle.recurring.note=Слова й звертання, що повторюються в книзі й мають перекладатися щоразу однаково, як-от master, Mr чи pentacle. На відміну від глосарія, який містить імена й терміни, що ви визначаєте, і застосовує їх точно, ці слова йдуть за відтворенням, яке книга вже найчастіше вживає, або за тим, яке ви введете. Під час перекладу модель повідомляє, яке відтворення вжила для кожного, а відтворення також вивчаються з самого перекладеного тексту. Термін, який книга відтворює по-різному, лишається порожнім, доки одне відтворення явно не переважить. «Сканування моделлю» дає моделі вибрати такі слова з книги; «Перевірка моделлю» прибирає записи, які не варто відстежувати.
namesStyle.recurring.find=Знайти повторювані терміни
namesStyle.recurring.find.tip=Переглядає основний текст книги й додає нижче звертання та поширені слова, що повторюються, кожне без відповідника. Нічого не змінюється й не вилучається. Працює без моделі.
namesStyle.recurring.modelScan=Сканування моделлю
namesStyle.recurring.modelScan.tip=Показує моделі частотні слова книги й додає ті, які, за її словами, мають перекладатися щоразу однаково: звертання, ролі, предмети й терміни світу книги. Лише додає рядки; якщо запит не вдався, нічого не додається.
namesStyle.recurring.modelReview=Перевірка моделлю
namesStyle.recurring.modelReview.tip=Питає модель, чи варто відстежувати кожен термін зі списку, і прибирає ті, які вона відкидає. Термін, відтворення якого ви ввели, не прибирається ніколи.
namesStyle.recurring.modelScanned={0, plural, one {Модель додала # повторюваний термін.} few {Модель додала # повторювані терміни.} many {Модель додала # повторюваних термінів.} other {Модель додала # повторюваного терміну.}}
namesStyle.recurring.modelReviewed={0, plural, one {Модель прибрала # термін, який не варто відстежувати.} few {Модель прибрала # терміни, які не варто відстежувати.} many {Модель прибрала # термінів, які не варто відстежувати.} other {Модель прибрала # терміну, які не варто відстежувати.}}
namesStyle.recurring.suggest=Запропонувати відповідники
namesStyle.recurring.suggest.tip=Просить обрану модель дати відповідник для кожного терміна, що його ще не має, за налаштуваннями картки книги. Пропозиція — лише підказка, доки чернетка нею не скористається або ви її не зміните. Потрібна модель, обрана в налаштуваннях.
namesStyle.recurring.add.prompt=Додати слово чи звертання
namesStyle.recurring.add.prompt.tip=Введіть слово чи звертання, що повторюється в книзі, і натисніть Enter або «Додати». Це для слова, яке сканування не відрізняє від інших, наприклад такого, що завжди пишеться з малої літери.
namesStyle.recurring.add=+ Додати
namesStyle.recurring.add.tip=Додає введене слово чи звертання до списку нижче, без відповідника.
namesStyle.recurring.column.term=Термін
namesStyle.recurring.column.term.tip=Початкове слово чи звертання, про яке питають модель, незалежно від регістру.
namesStyle.recurring.column.rendering=Відповідник
namesStyle.recurring.column.rendering.tip=Відповідник, який наступні запити просять зберігати: ваш, якщо ви його ввели, інакше виявлений у перекладеному тексті, інакше найуживаніший досі, інакше пропозиція моделі. Введіть інший і натисніть Enter, щоб обрати його; очистьте поле, щоб повернутися до найуживанішого.
namesStyle.recurring.column.seen=Вжито
namesStyle.recurring.column.seen.tip=Кожен відповідник, яким чернетки скористалися для цього терміна, звірений із перекладеним текстом, і скільки разів. Відповідник, виявлений у перекладеному тексті, показано з кількістю сегментів. Два відповідники тут означають, що книга називає те саме по-різному.
namesStyle.recurring.column.actions=Дії
namesStyle.recurring.column.actions.tip=Перенесіть термін до глосарію або вилучіть його зі списку.
namesStyle.recurring.seen.none=ще не вжито
namesStyle.recurring.seen.learned={0} ×{1} (виявлено за текстом)
namesStyle.recurring.promote=До глосарію
namesStyle.recurring.promote.tip=Переносить цей термін до глосарію з його відповідником як перекладом, щоб його застосовували точно, а не лише узгоджували. Там його можна й закріпити.
namesStyle.recurring.remove=Вилучити
namesStyle.recurring.remove.tip=Вилучає цей термін зі списку. Запити більше не просять узгоджувати його.
namesStyle.recurring.noModelTerms=Оберіть модель у налаштуваннях провайдера, щоб сканувати чи перевіряти повторювані терміни.
namesStyle.recurring.noModel=Оберіть модель у налаштуваннях провайдера, щоб запропонувати відповідники.
namesStyle.recurring.suggested={0, plural, one {Відповідник має # повторюваний термін.} few {Відповідник мають # повторювані терміни.} many {Відповідник мають # повторюваних термінів.} other {Відповідник має # повторюваного терміна.}}
namesStyle.recurring.duplicate={0} уже є в глосарії або в списку
namesStyle.lockNeedsTarget=Закріплений термін потребує перекладу.
namesStyle.duplicate={0} уже є в глосарії
namesStyle.noModel=Оберіть модель у налаштуваннях провайдера, щоб запустити сканування моделлю.
namesStyle.noModelReview=Оберіть модель у налаштуваннях провайдера, щоб перевірити імена.
namesStyle.modelProgress=Очікування моделі · запит {0} · спроба {1} з {2}
namesStyle.modelStopped=Запит до моделі зупинено. Глосарій не змінено.
namesStyle.reviewed=Перевірку моделлю завершено: вилучено {0, plural, one {# рядок} few {# рядки} many {# рядків} other {# рядка}}, оновлено {1, plural, one {# рядок} few {# рядки} many {# рядків} other {# рядка}}, запропоновано {2, plural, one {# переклад} few {# переклади} many {# перекладів} other {# перекладу}}.
namesStyle.suggesting=Пропонуємо переклади {0}/{1}
namesStyle.acceptAll=Прийняти всі
namesStyle.acceptAll.tip=Підтверджує як ваші всі переклади, які запропонувала модель (позначені ШІ). Підтверджений переклад під час перекладу застосовується точно, і наступна перевірка моделлю його вже не замінить.
namesStyle.accept=Прийняти пропозицію
namesStyle.accept.tip=Підтверджує цей запропонований переклад як ваш. Те саме робить Enter у полі без змін; інший введений переклад або закріплення рядка теж роблять його вашим.
namesStyle.suggestedBadge=ШІ
namesStyle.suggestedBadge.tip=Запропоновано моделлю й ще не підтверджено. Під час перекладу його подано як підказку, яку модель може відмінювати, а не застосовано точно. Прийміть, змініть або закріпіть його, щоб зробити своїм; наступна перевірка моделлю може його замінити.
namesStyle.suggestionsUnreviewed={0, plural, one {# запропонований переклад не переглянуто} few {# запропоновані переклади не переглянуто} many {# запропонованих перекладів не переглянуто} other {# запропонованого перекладу не переглянуто}}; їх буде використано як підказки.
namesStyle.import.done=Імпортовано {0, plural, one {# рядок} few {# рядки} many {# рядків} other {# рядка}}.
namesStyle.import.malformed={1, plural, one {Некоректний рядок} few {Некоректні рядки} many {Некоректні рядки} other {Некоректні рядки}}: {0}.
namesStyle.import.refused={1, plural, one {Відхилений рядок} few {Відхилені рядки} many {Відхилені рядки} other {Відхилені рядки}} (закріплено без перекладу): {0}.
namesStyle.export.done=Глосарій записано до {0}.
namesStyle.type.character=персонаж
namesStyle.type.place=місце
namesStyle.type.term=термін
namesStyle.type.title=титул
namesStyle.type.other=інше
namesStyle.gender.female=жіночий
namesStyle.gender.male=чоловічий
namesStyle.gender.neuter=середній
namesStyle.gender.unknown=невідомо
dialog.addTerm.title=Додати термін до глосарія
dialog.addTerm.subtitle=Вихідний → переклад + тип + закріплення
dialog.addTerm.source=Вихідний термін
dialog.addTerm.source.tip=Імʼя або термін так, як вони трапляються в книзі.
dialog.addTerm.target=Переклад
dialog.addTerm.target.tip=Написання для перекладу. Залиште порожнім, якщо ще не визначилися.
dialog.addTerm.type=Тип
dialog.addTerm.type.tip=Який це термін: персонаж, місце, термін, титул чи інше. Модель використовує це як контекст.
dialog.addTerm.gender=Рід (для узгодження)
dialog.addTerm.gender.tip=Потрібен для граматичного узгодження в мові перекладу. «Невідомо» підходить, коли це не важливо.
dialog.addTerm.lock=Закріпити — це написання скрізь
dialog.addTerm.lock.tip=Примусово використовує саме це написання скрізь. Закріплений термін потребує перекладу.
dialog.addTerm.cancel=Скасувати
dialog.addTerm.cancel.tip=Закриває це вікно, нічого не додаючи.
dialog.addTerm.confirm=Додати термін
dialog.addTerm.confirm.tip=Додає термін до глосарію. Термін, що вже є в глосарії, буде відхилено.
dialog.addTerm.required=Введіть вихідний термін.

# Translating dashboard: the controls, the figures, the log and the banner of each run state
translating.title=Переклад
translating.start=Почати переклад
translating.start.tip=Починає переклад книги з першого сегмента, щодо якого ще не ухвалено рішення.
translating.pause=Призупинити
translating.pause.tip=Призупиняє переклад. Поточний запит скасовується й повторюється після відновлення; ухвалене не втрачається.
translating.resume=Відновити
translating.resume.tip=Продовжує призупинений запуск з того місця, де він зупинився.
translating.stop=Зупинити
translating.stop.tip=Негайно завершує запуск. Ухвалені сегменти зберігаються, доки застосунок не закрито, а новий запуск продовжить із першого незавершеного.
translating.count.accepted=прийнято
translating.count.flagged=позначено
translating.count.remaining=залишилось
