translating.subtitle=Перебіг зберігається по ходу роботи. «Продовжити переклад» продовжить з місця зупинки, навіть після перезапуску.
translating.strip.secondLook.tip=Прийняті сегменти, які остання перевірка готової книги ще ставить під сумнів: текст мовою оригіналу, зайва лапка, слово з літер різних абеток, подвоєне слово, заповнювач у тексті або пропущене ім'я з глосарія. Відкрийте їх у вікні перегляду фільтром «Варто переглянути ще раз».
