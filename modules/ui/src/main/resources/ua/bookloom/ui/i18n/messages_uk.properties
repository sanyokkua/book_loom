dialog.genders.start=Почати так
dialog.genders.start.tip=Починає переклад із невказаною статтю цих персонажів; сегменти, що від неї залежать, чекають і згадуються в експорті.
dialog.genders.back=Назад
dialog.genders.back.tip=Закриває це запитання без запуску, щоб указати стать в «Імена та стиль».
