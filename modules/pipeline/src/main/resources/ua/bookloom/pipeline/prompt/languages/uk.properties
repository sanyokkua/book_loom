# Ukrainian as the target or the source; owner-reviewed. Lines starting with # never reach the model.
status=tested
quotes=«…» for speech, „…“ inside; never “…”.
genderCheck=uk
# Letters a name's last stem letter swaps within before a suffix (Прага, Празькі; Франк, Франці), and entries written from>to for the vowel that closes the stem (Опір, Опором; камінь, каменя); used by the name checks.
stemAlternations=гзж кцч хсш і>о і>е
# The dialogue convention (15j.J9): a speech closed by » and a dash attribution loses the English quote's full stop («Хвилинку», — сказав він). A match is a sentence boundary the counter adds when the source closed that quote with . ! or ?; the lookbehind keeps a quote that kept its own mark out of it.
dialogueAttribution=(?<![.!?…])»,?[\\s\\u00A0]+[—–]
# Russian-only letters: a Ukrainian word holding one is a leak from Russian (бэкона, кобыли); used by the alphabet check.
forbiddenLetters=ыъэё
# Endings of the oblique case forms: of the forms a learned rendering took, one with none of them is the dictionary form (земля, not землі).
obliqueEndings=і и ів ам ами ах ям ями ях ові еві єві ою ею єю ом ем єм у ю ї
# Particles and negations that carry mood or polarity: an agreement or gender edit may neither add nor drop one (міг би, не пішла).
# Voiced and voiceless consonants a name's final letter swaps between (Майлз, Майлс); used by the audit's spelling-variant scan.
voicingPairs=бп вф гк дт жш зс
functionWords=би б не ні ніколи ніде ніхто нічого ж же та
agreement=Past-tense verbs and adjectives agree with the subject's gender and number (він пішов, вона пішла).
pitfalls.1=Do not copy the source's word order or passive; no russisms (брати участь, not приймати участь).
reviewerChecks.1=Quotes are «…» and balanced; a hyphen never stands for a dash.
reviewerChecks.2=Every past-tense verb and adjective matches its subject's gender and number.
sourceNotes.1=Past-tense verbs and adjectives show gender (пішов he, пішла she): keep it; ти is informal, ви formal.
names.convention=Follow the Ukrainian orthography's practical transcription of foreign names: write the name as it sounds, H as Г (Harrow → Гарроу), keep a double consonant of the original (Harry → Гаррі), and end it as Ukrainian would (-ія for -ia, Victoria → Вікторія).
# The first-person subject pronouns of narration; see en.properties.
firstPersonPronouns=я Я
# The narrator's own «я + past-tense verb» (15i.T5): one pattern whose group "female" (-ла, -лась, -лася) or "male" (-в, -вся) says the gender the ending shows. Up to three particles or adverbs may stand between the pronoun and the verb, never punctuation; a few words that end in -в without being a past tense are left out. The run counts it outside quotes and dialogue to infer an unstated narrator's gender.
firstPersonPast=(?<![\\p{L}\\p{M}'’ʼ-])[Яя](?:\\s+(?:не|ні|б|би|ж|же|й|і|вже|ще|лише|тільки|тоді|потім|тихо|швидко|просто|одразу|знову|теж|також|нарешті|ніколи|завжди|майже|там|тут|ось|тепер|навіть|зовсім|аж|все)){0,3}\\s+(?:(?<female>\\p{L}+(?:лась|лася|ла))|(?!(?:знов|лев|любов|кров|церков|нів)(?![\\p{L}\\p{M}'’ʼ-]))(?<male>\\p{L}{2,}(?:вся|в)))(?![\\p{L}\\p{M}'’ʼ-])
# Third-person subject pronouns that show a character's gender (B6): a name followed by one of them in the same or the next sentence, outside speech and with no other name between, is that gender's evidence.
femalePronouns=вона
malePronouns=він
# Object and possessive forms (15h.A2): they often name somebody else, so they count only when a name has too few subject pronouns and none of those contradicts them.
femaleObjectPronouns=її неї їй ній нею
maleObjectPronouns=його нього йому ньому ним
# Russian words that slip into Ukrainian text, each with its Ukrainian replacement (15h.A5): the check names the exact word.
foreignWords=тоже>теж чтобы>щоб только>тільки очень>дуже когда>коли если>якщо потому>тому тогда>тоді сейчас>зараз здесь>тут почему>чому даже>навіть

# Endings that make a plural of a name (15h.A6): a name candidate that is another candidate plus one of these is its alias, not a name of its own.
pluralSuffixes=и і ів
# Words that address a man or a woman (15h.G2), term>male or term>female: a quote in which a character addresses the narrator with one shows the narrator's gender to the brief suggestion.
addressTerms=пане>male добродію>male хлопче>male синку>male брате>male дядьку>male пані>female панночко>female дівчино>female доню>female сестро>female тітонько>female

# The forms of "you" a speech must not mix (15i.T6): ти-forms in any case, Ви-forms listed capitalised because a lower-case ви is as often the plural; one quoted speech that has both earns one directed fix.
informalAddress=ти тебе тобі тобою твій твого твоєму твоїм твоя твоєї твоїй твоєю твою твоє твої твоїх твоїми
formalAddress=Ви Вас Вам Вами Ваш Вашого Вашому Вашим Ваша Вашої Вашій Вашою Вашу Ваше Ваші Ваших Вашими

# Whether this language declines proper names (15i.N6): where it does, a suggested rendering cannot be locked, since the text needs its case forms; where it does not, a verified name can be locked.
namesInflect=true

# Endings only a declined form has, never a nominative (15j.J4): Валдором for Valdor. -а, -у and -і are left out: Анна, Павло and Джессі are dictionary forms. -ів ends a nominative too (Львів), so it counts only after a stem as long as the source word.
nonNominativeEndings=ові еві єві ом ем єм ою ею єю ами ями ах ях ів

# Letters a transliteration of a Latin name may open with (15i.N6), written source>letters: the opening letter or digraph of each source word, the longest key first. Only the opening is judged, never the rest of a word; a letter with no row cannot be judged.
translit=a>ае b>б c>ксц d>д e>еєіюи f>ф g>гґдж h>гх i>іиаєй j>джйяюхє k>к l>л m>м n>н o>о p>п q>к r>р s>сшзц t>тцч u>уюа v>вф w>ву x>кзхс y>яюєйіи z>зцж sh>ш ch>чкшхц th>т ph>ф kh>х zh>ж
