# Ukrainian as the target or the source; owner-reviewed. Lines starting with # never reach the model.
status=tested
quotes=«…» for speech, „…“ inside; never “…”.
genderCheck=uk
# Letters a name's last stem letter swaps within before a suffix (Прага, Празькі; Франк, Франці), and entries written from>to for the vowel that closes the stem (Сокіл, Соколом; камінь, каменя); used by the name checks.
stemAlternations=гзж кцч хсш і>о і>е
# The dialogue convention (15j.J9): a speech closed by » and a dash attribution loses the English quote's full stop («Хвилинку», — сказав він). A match is a sentence boundary the counter adds when the source closed that quote with . ! or ?; the lookbehind keeps a quote that kept its own mark out of it.
dialogueAttribution=(?<![.!?…])»,?[\\s\\u00A0]+[—–]
# Russian-only letters: a Ukrainian word holding one is a leak from Russian (бэкона, кобыли); used by the alphabet check.
forbiddenLetters=ыъэё
# Endings of the oblique case forms: of the forms a learned rendering took, one with none of them is the dictionary form (земля, not землі).
obliqueEndings=і и ів ам ами ах ям ями ях ові еві єві ою ею єю ом ем єм у ю ї
# Particles and negations that carry mood or polarity: an agreement or gender edit may neither add nor drop one (міг би, не пішла).
# Voiced and voiceless consonants a name's final letter swaps between (Майлз, Майлс); used by the audit's spelling-variant scan.
voicingPairs=бп вф гк дт жш зс
negationWords=не ні ніколи ніде ніхто нікого нікому ніким нічого нічому нічим
agreement=Past-tense verbs and adjectives agree with the subject's gender and number (він пішов, вона пішла).
pitfalls.1=Do not copy the source's word order or passive; no russisms (брати участь, not приймати участь).
# The book rules the context builder sends when the book needs them (design D9); under rule.<key> so the language-rules
# section that today's prompts carry is unchanged.
rule.dialogue=Keep the source's dialogue form: a dash line stays a dash line (— Ходімо, — сказала вона); quoted speech goes in «…».
rule.address=Choose ти or ви by the relationship and keep it for the whole conversation.
rule.numbers=12 000 with a space; a decimal comma (3,5).
reminder.dialogue=Dialogue lines start with «— ».
# A few lines of natural Ukrainian prose, invented, shown when the pair has no examples of its own.
illustration=«Ну що ж, — сказала вона, — побачимо». Ось і п’ятниця.

sourceNotes.1=Past-tense verbs and adjectives show gender (пішов he, пішла she): keep it; ти is informal, ви formal.
names.convention=Follow the Ukrainian orthography's practical transcription of foreign names: write the name as it sounds, H as Г (Harrow → Гарроу), keep a double consonant of the original (Harry → Гаррі), and end it as Ukrainian would (-ія for -ia, Victoria → Вікторія).
# The first-person subject pronouns of narration; see en.properties.
firstPersonPronouns=я Я
# Third-person subject pronouns that show a character's gender (B6): a name followed by one of them in the same or the next sentence, outside speech and with no other name between, is that gender's evidence.
femalePronouns=вона
malePronouns=він
# Object and possessive forms (15h.A2): they often name somebody else, so they count only when a name has too few subject pronouns and none of those contradicts them.
femaleObjectPronouns=її неї їй ній нею
maleObjectPronouns=його нього йому ньому ним

# Endings that make a plural of a name (15h.A6): a name candidate that is another candidate plus one of these is its alias, not a name of its own.
pluralSuffixes=и і ів
# Words that address a man or a woman (15h.G2), term>male or term>female: a quote in which a character addresses the narrator with one shows the narrator's gender to the brief suggestion.
addressTerms=пане>male добродію>male хлопче>male синку>male брате>male дядьку>male пані>female панночко>female дівчино>female доню>female сестро>female тітонько>female

# The forms of "you" a speech must not mix (15i.T6): ти-forms in any case, Ви-forms listed capitalised because a lower-case ви is as often the plural; one quoted speech that has both earns one directed fix.
informalAddress=ти тебе тобі тобою твій твого твоєму твоїм твоя твоєї твоїй твоєю твою твоє твої твоїх твоїми
formalAddress=Ви Вас Вам Вами Ваш Вашого Вашому Вашим Ваша Вашої Вашій Вашою Вашу Ваше Ваші Ваших Вашими
# The Book Brief's choices (design D6), default first: apostrophes; quotation-mark styles as four marks each
# (outer open, outer close, inner open, inner close). The address row reads informalAddress and formalAddress.
briefApostrophes=’ ʼ '
briefQuotes=«»„“ „“‚‘

# Whether this language declines proper names (15i.N6): where it does, a suggested rendering cannot be locked, since the text needs its case forms; where it does not, a verified name can be locked.
namesInflect=true

# Endings only a declined form has, never a nominative (15j.J4): Корвелом for Korvel. -а, -у and -і are left out: Анна, Павло and Джессі are dictionary forms. -ів ends a nominative too (Львів), so it counts only after a stem as long as the source word.
nonNominativeEndings=ові еві єві ом ем єм ою ею єю ами ями ах ях ів

# Letters a transliteration of a Latin name may open with (15i.N6), written source>letters: the opening letter or digraph of each source word, the longest key first. Only the opening is judged, never the rest of a word; a letter with no row cannot be judged.
translit=a>ае b>б c>ксц d>д e>еєіюи f>ф g>гґдж h>гх i>іиаєй j>джйяюхє k>к l>л m>м n>н o>о p>п q>к r>р s>сшзц t>тцч u>уюа v>вф w>ву x>кзхс y>яюєйіи z>зцж sh>ш ch>чкшхц th>т ph>ф kh>х zh>ж

# How a name declines; see ru.properties for the row shape. <ending>|<gender>>voc: <ending> is the vocative.
nameParadigms.1=C|m: а у ом ові
nameParadigms.2=C|m>voc: е
nameParadigms.3=ов|m: ова ову овим овим
nameParadigms.4=ов|m>voc: ове
nameParadigms.5=ова|f: ової ову овою
nameParadigms.6=ова|f>voc: ова
nameParadigms.7=ий|m: ого ому им ому
nameParadigms.8=ій|m: ія ію ієм ієві
nameParadigms.9=ій|m>voc: ю
nameParadigms.10=й|m: я ю єм єві
nameParadigms.11=й|m>voc: ю
nameParadigms.12=о|m: а ові ом
nameParadigms.13=о|m>voc: е
nameParadigms.14=а|f: и і у ою
nameParadigms.15=а|f>voc: о
nameParadigms.16=я|f: і ю ею
nameParadigms.17=я|f>voc: е
nameParadigms.18=indeclinable|any: о е и у іх ко
# The vowel о or е becomes і in a closed syllable (Сокіл → Сокола), and a fleeting е becomes a soft sign (Лев → Льва).
nameAlternations=о/е>і fleeting-е>ь
# The rows whose declension shows a gender by itself; -а and -я are left out (Микола and Ілля are men).
paradigmGender=C ов ова ий ій й о
nounEndings=ь ів ям ями ях ам ами ах ою ею єю ом ем єм у ю а я и і е є ї
pastFemale=ла лась лася
pastMale=в вся
pastMaleIrregular=ніс віз ліг помер
shortAdjFemale=рада повинна
shortAdjMale=рад повинен
# The neuter past endings: a verb that shows neither a man nor a woman.
pastNeuter=ло лось лося
# Particles and adverbs that may stand between a subject and its past-tense verb (я теж не спав).
pastSkipWords=не ні б би ж же й і вже ще лише тільки тоді потім тихо швидко просто одразу знову теж також нарешті ніколи завжди майже там тут ось тепер швидше якось навіть зовсім аж все
# Words that end like a past tense and are not one.
pastNotVerbs=мало чимало число село тіло діло світло скло зло весло крило дно лев любов кров церков морков львів нів дарів знов
addressPositions=у від для без до з
stripStressMarks=true
# A convention the target language declares: its values and the one chosen by default (hard g in a foreign name).
conventions=hardG
convention.hardG.choices=г ґ
convention.hardG.default=г

# The worked examples of the names-pass prompts in Ukrainian, each from a different invented book (see generic.properties).
prepExample.termReading.1=[1] [[Отілія]] поклала весло. Вона глянула на очерет. → {"window":1,"quote":"Вона глянула на очерет","usage":"name","kind":"person","gender":"female"}
prepExample.termReading.2=[2] «[[Корвел]] прийде?» — спитала вона. → {"window":2,"quote":"none","usage":"name","kind":"person","gender":"none"}
prepExample.termReading.3=[3] [[Белвік]] спав, а його рибалки були в морі. → {"window":3,"quote":"none","usage":"name","kind":"place","gender":"none"}
prepExample.termReading.4=[4] [[Утім]], ніхто не відчинив дверей. → {"window":4,"quote":"none","usage":"word","kind":"other","gender":"none"}
prepExample.termReading.reply={"windows":[{"window":1,"quote":"Вона глянула на очерет","usage":"name","kind":"person","gender":"female"},{"window":2,"quote":"none","usage":"name","kind":"person","gender":"none"}],"speaking":false,"brand":false,"explainsName":0}
prepExample.lexiconReading.1=[1] На північному гребені запалили [[сигнальне вогнище]]. → {"window":1,"quote":"запалили сигнальне вогнище","usage":"term"}
prepExample.lexiconReading.2=[2] Вона поставила [[відро]] біля порога. → {"window":2,"quote":"поставила відро біля порога","usage":"word"}
prepExample.lexiconReading.3=[3] [[Кістяну браму]] зачиняли в сутінках. → {"window":3,"quote":"Кістяну браму зачиняли","usage":"name"}
prepExample.lexiconReading.reply={"windows":[{"window":1,"quote":"запалили сигнальне вогнище","usage":"term"},{"window":2,"quote":"сигнальне вогнище догоріло","usage":"term"}],"senses":1,"rendering":""}
prepExample.prescan.1=- "Ну" opening "Ну, от і все." → not a name: leave it out.
prepExample.prescan.2=- "Сава Корнійчук" in "Сава Корнійчук усміхнувся гостям." → {"term":"Сава Корнійчук","type":"person","gender":"male","note":"a merchant","confidence":0.9}
prepExample.prescan.3=- "Ель-Барун" in "Вони поїхали далі, в Ель-Барун." → {"term":"Ель-Барун","type":"place","gender":"unknown","note":"a town","confidence":0.8}
prepExample.prescan.reply={"terms":[{"term":"Сава Корнійчук","type":"person","gender":"male","note":"a merchant","confidence":0.9}]}
prepExample.reviewTerms.1=- "Утім" — 120×, [1] "Утім, може, річ була в погоді." → {"term":"Утім","verdict":"not-a-name","type":"other","gender":"unknown","windows":[1],"evidence":"Утім, може, річ була в погоді"}
prepExample.reviewTerms.2=- "Сава Корнійчук" — [1] "«Він запізнюється», — сказав Сава Корнійчук.", [2] "Сава Корнійчук усміхнувся. Він підняв келих." → {"term":"Сава Корнійчук","verdict":"name","type":"person","gender":"male","windows":[2],"evidence":""}
prepExample.reviewTerms.3=- "Ель-Барун" — [1] "Вони поїхали далі, в Ель-Барун." → {"term":"Ель-Барун","verdict":"name","type":"place","gender":"unknown","windows":[1],"evidence":""}
prepExample.reviewTerms.reply={"verdicts":[{"term":"Утім","verdict":"not-a-name","type":"other","gender":"unknown","windows":[1],"evidence":"Утім, може, річ була в погоді"},{"term":"Сава Корнійчук","verdict":"name","type":"person","gender":"male","windows":[2],"evidence":""}]}

# Block 12 of a proofread call (design D15 "Call"), with the source language's genitive by its tag.
proofreadInstruction=Ти коректор перекладу з {{sourceLanguageGenitive}} на українську. Кожен елемент <s> містить оригінал абзацу й поточний переклад: виправ у перекладі лише те, що хибне, і змінюй якомога менше.
proofreadInstruction.noSource=Ти коректор перекладу українською. Кожен елемент <s> містить оригінал абзацу й поточний переклад: виправ у перекладі лише те, що хибне, і змінюй якомога менше.
proofreadRules=- Виправ хибний чи пропущений зміст, неправильну форму імені, неузгоджений рід або слово, залишене мовою оригіналу.\n- Збережи кожну позначку ⟦…⟧ рівно один раз.\n- Правильне речення залиш без жодних змін; не переписуй його стиль.\n- Рядки до й після елементів лише для читання: не відповідай на них.
