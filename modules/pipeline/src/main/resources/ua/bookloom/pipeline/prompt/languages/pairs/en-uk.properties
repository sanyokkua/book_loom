# English -> Ukrainian: gender recovery, names and the worked examples. Lines starting with # never reach the model.
pitfalls.1=English hides gender: choose Ukrainian past-tense forms from the glossary or the nearest clue (he, she); else avoid a gendered form.
reviewerChecks.1=Check each gendered Ukrainian form against its person.
