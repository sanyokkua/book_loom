batchExample.1=“Don’t move, ⟦g0⟧,” she said. ⇒ «Не рухайся, ⟦g0⟧», — сказала вона.\n1881 ⇒ 1881\nShe ran to the door and opened it. ⇒ Вона підбігла до дверей і відчинила їх.
