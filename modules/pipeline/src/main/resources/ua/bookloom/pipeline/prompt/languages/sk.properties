# Slovak. Conservative, well-known rules drafted for native-speaker review: untested until the language has a corpus run.
status=untested
quotes=„…“ for speech, ‚…‘ inside them; »…« is also accepted.
dialogue=Speech in „…“, with the tag after a comma: „Poď sem,“ povedala.
agreement=Past-tense verbs show the subject's gender (urobil, urobila); nouns, adjectives and numerals agree in case, gender and number.
address=Choose ty or vy by the relationship and keep it for the whole conversation.
numbers=12 000 with a space; a decimal comma (3,5).
pitfalls.1=Watch false friends: čerstvý is "fresh", pozor "attention".
reviewerChecks.1=Check case endings and the gender of past-tense verbs.
sourceNotes.1=A past-tense verb shows gender (urobil he, urobila she); a subject pronoun is often dropped; vy is formal or plural.
