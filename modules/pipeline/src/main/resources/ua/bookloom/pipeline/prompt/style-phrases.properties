default.line=Neutral, faithful literary prose: keep the author's register, sentence rhythm and paragraph breaks; use the standard modern orthography of the target language.
Register.FORMAL_LITERARY=Register: formal and literary; prefer elevated, careful diction.
Register.NEUTRAL=Register: neutral; plain, standard literary language.
Register.CASUAL=Register: casual and conversational; prefer everyday, relaxed wording.
balance.band1=Balance: stay as close to the source wording and syntax as the target language allows.
balance.band2=Balance: lean literal; keep the source's structure unless it reads unnaturally.
balance.band3=Balance: weigh fidelity and natural flow equally.
balance.band4=Balance: lean natural; reshape sentences freely when it reads better, keeping the meaning.
balance.band5=Balance: favor natural, idiomatic target-language prose over the source's wording, keeping the meaning.
NamePolicy.TRANSLATE=Names: translate personal and place names into their target-language equivalents where one exists.
NamePolicy.TRANSLITERATE=Names: transliterate personal and place names into the target language's script.
NamePolicy.KEEP_ORIGINAL=Names: keep personal and place names exactly as written in the source.
ForeignPassagePolicy.KEEP=If a passage is deliberately in a language other than {source}, keep it verbatim; do not translate it.
ForeignPassagePolicy.TRANSLATE=Translate any passage written in another language than {source} into the target language like the rest of the text.
ForeignPassagePolicy.TRANSLATE_WITH_NOTE=Translate any passage written in another language than {source} into the target language, and add its original wording in parentheses right after the translation.
FootnotePolicy.TRANSLATE=Footnotes and endnotes: translate their text like the rest of the book.
FootnotePolicy.KEEP=Footnotes and endnotes: keep their text verbatim in the source language.
UnitPolicy.KEEP=Units: keep measurements as written in the source.
UnitPolicy.METRIC=Units: convert measurements given in prose to metric units.
