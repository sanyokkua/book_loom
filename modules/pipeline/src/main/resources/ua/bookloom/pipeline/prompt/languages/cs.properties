# Czech. Conservative, well-known rules drafted for native-speaker review: untested until the language has a corpus run.
status=untested
quotes=„…“ for speech, ‚…‘ inside them; »…« is also accepted.
dialogue=Speech in „…“, with the tag after a comma: „Pojď sem,“ řekla.
agreement=Past-tense verbs show the subject's gender (udělal, udělala); nouns, adjectives and numerals agree in case, gender and number.
address=Choose ty or vy by the relationship and keep it for the whole conversation.
numbers=12 000 with a space; a decimal comma (3,5).
pitfalls.1=Watch false friends: čerstvý is "fresh", pozor "attention", zápach "stench".
reviewerChecks.1=Check case endings and the gender of past-tense verbs.
sourceNotes.1=A past-tense verb shows gender (udělal he, udělala she); a subject pronoun is often dropped; vy is formal or plural.
# Third-person subject pronouns that show a character's gender (B6): a name followed by one of them in the same or the next sentence, outside speech and with no other name between, is that gender's evidence.
femalePronouns=ona
malePronouns=on
# Object and possessive forms (15h.A2): they often name somebody else, so they count only when a name has too few subject pronouns and none of those contradicts them.
femaleObjectPronouns=ji jí její ní
maleObjectPronouns=ho mu jeho jemu jím něj něho

# Endings that make a plural of a name (15h.A6): a name candidate that is another candidate plus one of these is its alias, not a name of its own.
pluralSuffixes=y i ů
# Words that address a man or a woman (15h.G2), term>male or term>female: a quote in which a character addresses the narrator with one shows the narrator's gender to the brief suggestion.
addressTerms=pane>male chlapče>male synku>male paní>female slečno>female dcerko>female
