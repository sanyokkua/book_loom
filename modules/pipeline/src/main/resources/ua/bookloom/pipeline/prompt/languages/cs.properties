# Czech. Conservative, well-known rules drafted for native-speaker review: untested until the language has a corpus run.
status=untested
quotes=„…“ for speech, ‚…‘ inside them; »…« is also accepted.
dialogue=Speech in „…“, with the tag after a comma: „Pojď sem,“ řekla.
agreement=Past-tense verbs show the subject's gender (udělal, udělala); nouns, adjectives and numerals agree in case, gender and number.
address=Choose ty or vy by the relationship and keep it for the whole conversation.
numbers=12 000 with a space; a decimal comma (3,5).
pitfalls.1=Watch false friends: čerstvý is "fresh", pozor "attention", zápach "stench".
reviewerChecks.1=Check case endings and the gender of past-tense verbs.
sourceNotes.1=A past-tense verb shows gender (udělal he, udělala she); a subject pronoun is often dropped; vy is formal or plural.
# Third-person subject pronouns that show a character's gender (B6): a name followed by one of them in the same or the next sentence is that gender's evidence. Object forms (her, його) are left out because they usually name somebody else.
femalePronouns=ona
malePronouns=on
