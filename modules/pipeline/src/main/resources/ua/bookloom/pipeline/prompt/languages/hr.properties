# Croatian. Conservative, well-known rules drafted for native-speaker review: untested until the language has a corpus run.
status=untested
quotes=„…“ for speech, »…« inside them.
dialogue=Speech in „…“, with the tag after a comma: „Dođi ovamo“, rekla je.
agreement=Past-tense verbs show the subject's gender (napravio, napravila); nouns, adjectives and numerals agree in case, gender and number; use the vocative for address.
address=Choose ti or vi by the relationship and keep it for the whole conversation.
numbers=12 000 with a space; a decimal comma (3,5).
pitfalls.1=Watch false friends: zrak is "air", rok "deadline", tvornica "factory".
reviewerChecks.1=Check case endings and the gender of past-tense verbs.
sourceNotes.1=A past-tense verb shows gender (napravio he, napravila she); a subject pronoun is often dropped; vi is formal or plural.
