# Portuguese. Conservative, well-known rules drafted for native-speaker review: untested until the language has a corpus run.
status=untested
quotes=«…» for speech, “…” inside them.
dialogue=A dialogue line opens with a travessão: — Vem cá — disse ela.
agreement=Adjectives agree in gender and number with their noun; the verb agrees with its subject.
address=Choose tu, você or o senhor/a senhora by the relationship and keep it for the whole conversation.
pitfalls.1=Follow the variant of the target tag (pt-BR or pt-PT) in spelling and vocabulary.
pitfalls.2=Watch false friends: pretender is "to intend", esquisito "odd", assistir "to attend", livraria "bookshop".
reviewerChecks.1=Check agreement and that one variant is kept throughout.
sourceNotes.1=A subject pronoun is often dropped; the verb ending and adjectives show person and gender.

# Endings that make a plural of a name (15h.A6): a name candidate that is another candidate plus one of these is its alias, not a name of its own.
pluralSuffixes=s es
# Words that address a man or a woman (15h.G2), term>male or term>female: a quote in which a character addresses the narrator with one shows the narrator's gender to the brief suggestion.
addressTerms=senhor>male rapaz>male menino>male senhora>female menina>female moça>female
