# English as the target or the source; owner-reviewed. Lines starting with # never reach the model.
status=tested
quotes=“…” for speech, ‘…’ inside them; the comma and the full stop go inside the closing mark.
dialogue=A new paragraph for each speaker; the tag follows the speech: “Come here,” she said.
apostrophe=Write ’ in don’t and the writer’s.
hyphen=Unspaced em dash — like this — for a break.
agreement=Subject and verb agree in number; keep one tense within a scene; he, she, it and their forms follow the person's gender.
pitfalls.1=No calques of the source's word order or idiom; use the natural English phrase.
pitfalls.2=Make the subject clear when the source drops it (Ukrainian, Russian, Polish, Spanish often do).
reviewerChecks.1=Flag a literal idiom or a calque; check he/she against the source's gendered verb or noun.
sourceNotes.1=I, you, they and past-tense verbs show no gender, and you may be formal or plural: use the glossary or the scene.
# The first-person subject pronouns of narration (15e.14): a book whose sentences outside quotes often have one is narrated as "I". Only languages that rarely drop the subject are listed; a language with none is never asked about its narrator.
firstPersonPronouns=I
