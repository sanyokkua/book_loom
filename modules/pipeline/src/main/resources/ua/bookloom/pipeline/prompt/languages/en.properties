# English as the target or the source; owner-reviewed. Lines starting with # never reach the model.
status=tested
quotes=“…” for speech, ‘…’ inside them; the comma and the full stop go inside the closing mark.
dialogue=A new paragraph for each speaker; the tag follows the speech: “Come here,” she said.
apostrophe=Write ’ in don’t and the writer’s.
hyphen=Unspaced em dash — like this — for a break.
agreement=Subject and verb agree in number; keep one tense within a scene; he, she, it and their forms follow the person's gender.
pitfalls.1=No calques of the source's word order or idiom; use the natural English phrase.
pitfalls.2=Make the subject clear when the source drops it (Ukrainian, Russian, Polish, Spanish often do).
reviewerChecks.1=Flag a literal idiom or a calque; check he/she against the source's gendered verb or noun.
sourceNotes.1=I, you, they and past-tense verbs show no gender, and you may be formal or plural: use the glossary or the scene.
# The first-person subject pronouns of narration (15e.14): a book whose sentences outside quotes often have one is narrated as "I". Only languages that rarely drop the subject are listed; a language with none is never asked about its narrator.
firstPersonPronouns=I
# Third-person subject pronouns that show a character's gender (B6): a name followed by one of them in the same or the next sentence, outside speech and with no other name between, is that gender's evidence.
femalePronouns=she herself
malePronouns=he himself
# Object and possessive forms (15h.A2): they often name somebody else, so they count only when a name has too few subject pronouns and none of those contradicts them.
femaleObjectPronouns=her hers
maleObjectPronouns=him his

# Endings that make a plural of a name (15h.A6): a name candidate that is another candidate plus one of these is its alias, not a name of its own.
pluralSuffixes=s es
# Noun-phrase words (15i.N5 junk): a capitalised word the book writes after a determiner in nearly every use is a common
# noun or an adjective, not a person's name, when it also stands after an indefinite article before a noun (a
# nationality: "a Velarian porter"), when the subject pronoun that follows it is a plural one (a group), or when it is
# the plural of another capitalised word. "her" and "that" are left out: they also stand before a name as a pronoun.
determiners=the a an every each another this these those my your his its our their
indefiniteArticles=a an every each another
pluralPronouns=they themselves
# Words that join two capitalised runs into one name (15i.N8): "Tower of Arlen", "Keeper of the Grey Gate".
nameJoiners=of
# A firm is a name, a connecting word and a tail word (15i.N8): "Pell and Sons" is one candidate.
firmJoiners=and
firmTails=Son Sons Brothers Co Company
# Words that end a title made of several capitalised words (Prime Minister): such a term is a title entry, not a character (15j.J10).
officeTitles=minister president chancellor emperor empress governor mayor ambassador
# Words that address a man or a woman (15h.G2), term>male or term>female: a quote in which a character addresses the narrator with one shows the narrator's gender to the brief suggestion.
addressTerms=sir>male mister>male lad>male sonny>male ma'am>female madam>female missus>female lass>female missy>female

# Forms of address that show the gender of the person addressed (15i.N2): "Mrs Venn" is never joined to a man's name, "Mr Venn" never to a woman's. A title not listed (Doctor, Captain) shows none and joins either.
femaleTitles=mrs miss ms madam madame lady queen princess duchess mistress aunt widow
maleTitles=mr sir lord king prince duke earl baron master uncle

# Whether this language declines proper names (15i.N6): where it does, a suggested rendering cannot be locked, since the text needs its case forms; where it does not, a verified name can be locked.
namesInflect=false

# Articles that open a name without being a word of it (The Hague): the name check leaves them out.
articles=the
# Final letters after which a name does not end in a consonant sound (15j.J4): such a name may end in -а or -у in a target that declines names.
openNameFinals=aeiouyhw
