# The rules of a language with no file of its own, and the data every language shares: the name-rendering lines of the
# glossary's suggestion call and the examples shown when no pair or language file has any. Lines starting with # never
# reach the model. A missing required key stops loading, so nothing goes unstated.
status=untested
quotes=Use the quotation marks, dashes and number formats that printed books in the target language use.
agreement=Make verbs, adjectives, pronouns and numerals agree with their nouns in gender, number and case, as the target language requires.
pitfalls.1=Translate idioms by sense, not word by word, and use one rendering for each name.
pitfalls.2=Write only in the target language's own alphabet; leave no source-language word except a name or a kept passage.
reviewerChecks.1=Flag a sentence that reads as a word-for-word copy of the source.

# How the suggestion call renders names, one rule per Book Brief name policy. {target} is the target language's English
# name and {convention} its spelling convention for foreign names: the target's own names.convention, else this one.
names.policy.TRANSLATE=- Names: use the natural {target} equivalent a published translation would print — the established {target} name of a real place or person, the {target} form of a given name that has one, a translation by meaning of a speaking name or a nickname. Transliterate a name only when it has no such equivalent: {convention}
names.policy.TRANSLITERATE=- Names of people and places: spell them in {target} by their sound; never translate what they mean. {convention} A real place or person with an established {target} name keeps that name.
names.policy.KEEP_ORIGINAL=- Every listed row is a term, not a name: translate it into {target} by meaning, as a dictionary would.
names.terms=- A name made of ordinary words (an organisation, an institution, a named object) and a domain term are translated by meaning, whatever the rule for names.
names.convention=Spell the name the way an educated native translator would print it, using {target}'s standard conventions for foreign names.

# Language-independent examples. A "pairs" key lists the opening and closing token of each pair in the example before
# it, so the example test can check that both sides wrap words. Every Reply keeps the Source's tokens, in order.
example.1=Source: 1881\nReply: {"target":"1881"}
example.2=Source: * * *\nReply: {"target":"* * *"}
example.3=Source: ⟦g0⟧\nReply: {"target":"⟦g0⟧"}
example.4=Source: ⟦g0⟧XIV⟦g1⟧\nReply: {"target":"⟦g0⟧XIV⟦g1⟧"}
example.4.pairs=⟦g0⟧ ⟦g1⟧

# The suggestion call's example; only "no suggestion" is literal in every language.
nameExample=- Well — other — "Well, I never."\nA valid reply:\n{"suggestions":[{"term":"Well","target":"","gender":"unknown"}]}
