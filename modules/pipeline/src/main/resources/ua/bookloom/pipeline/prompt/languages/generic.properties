# The rules of a language with no file of its own, and the data every language shares: the name-rendering lines of the
# glossary's suggestion call and the examples shown when no pair or language file has any. Lines starting with # never
# reach the model. A missing required key stops loading, so nothing goes unstated.
status=untested
quotes=Use the quotation marks, dashes and number formats that printed books in the target language use.
agreement=Make verbs, adjectives, pronouns and numerals agree with their nouns in gender, number and case, as the target language requires.
pitfalls.1=Translate idioms by sense, not word by word, and use one rendering for each name.
pitfalls.2=Write only in the target language's own alphabet; leave no source-language word except a name or a kept passage.

# The book rules of the context builder's fixed part (design D9), each sent only when the book needs it: a target file
# states its own under rule.<key> (or the plain rule key), and a target without one gets these.
rule.marks=⟦gN⟧ marks stand for formatting, links or kept passages: copy each mark of an item exactly once inside that item, around the translation of the words it wraps; never add, drop or move one.
rule.dialogue=Keep every line of dialogue a line of dialogue, in the target language's dialogue punctuation, and keep clear who speaks.
rule.address=Keep one form of address, familiar or polite, between two characters for the whole conversation.
rule.numbers=Keep every number's value; write numbers in the target language's number format.
rule.inflect=Glossary names decline in the target language: decline them to fit, keep the stem.
# The reminder that ends a call's last message: at most three lines, each only when an item needs it. {gender} is
# male or female.
reminder.marks=Keep every ⟦…⟧ mark exactly once.
reminder.dialogue=Keep each dialogue line in the target language's dialogue punctuation.
reminder.narrator=The narrator ("I") is {gender}: write the narrator's own words in that gender.
# The heading of a target-only illustration, shown when the pair has no examples of its own. {target} is the target
# language's English name.
illustration.label=Natural {target} prose, to show the style only; never copy it into a translation:

# How the suggestion call renders names, one rule per Book Brief name policy. {target} is the target language's English
# name and {convention} its spelling convention for foreign names: the target's own names.convention, else this one.
names.policy.TRANSLATE=- Names (translate or adapt names): give the {target} form of a name that has one, and translate a name made of ordinary words or a nickname by its meaning. A real place or person with an established {target} name keeps that name. Spell any other name by its sound: {convention}
names.policy.TRANSLITERATE=- Names of people and places: spell them in {target} by their sound, as the name is pronounced, even a name made of ordinary words; never translate what a name means, and put that meaning in "meaning" instead. {convention} A real place or person with an established {target} name keeps that name. A nickname that is a plain word ("the Owl") is translated as a word. This holds for a name, not for an ordinary word that names a place or a thing (Earth, Moon, Sun): such a word is translated, as a dictionary has it.
names.policy.KEEP_ORIGINAL=- Every listed row is a term, not a name: translate it into {target} by meaning, as a dictionary would.
names.terms=- A name made of ordinary words (an organisation, an institution, a named object) and a domain term are translated by meaning, whatever the rule for names.
names.convention=Spell the name the way an educated native translator would print it, using {target}'s standard conventions for foreign names.

# Language-independent examples. A "pairs" key lists the opening and closing token of each pair in the example before
# it, so the example test can check that both sides wrap words. Every Reply keeps the Source's tokens, in order.
example.1=Source: 1881\nReply: {"target":"1881"}
example.2=Source: * * *\nReply: {"target":"* * *"}
example.3=Source: ⟦g0⟧\nReply: {"target":"⟦g0⟧"}
example.4=Source: ⟦g0⟧XIV⟦g1⟧\nReply: {"target":"⟦g0⟧XIV⟦g1⟧"}
example.4.pairs=⟦g0⟧ ⟦g1⟧

# The batch draft's examples, protocol-neutral: one "source ⇒ target" line per item, one example per key. Every item
# keeps its own tokens; the number-only line must always come back unchanged.
batchExample.1=1881 ⇒ 1881\n* * * ⇒ * * *\n⟦g0⟧XIV⟦g1⟧ ⇒ ⟦g0⟧XIV⟦g1⟧

# The suggestion call's example; only "no suggestion" is literal in every language.
nameExample=- Well — other — "Well, I never."\nA valid reply:\n{"suggestions":[{"term":"Well","target":"","meaning":""}]}

# The worked examples of the names-pass prompts (term-reading, lexicon-reading, prescan, review-terms), each from a
# different invented book; a language file sets its own in its own language, and a language that sets none gets these.
# prepExample.<kind>.N is one example line, prepExample.<kind>.reply the valid reply the prompt ends with.
prepExample.termReading.1=[1] [[Ottoline]] set down the oar. She looked at the reeds. → {"window":1,"quote":"She looked at the reeds","usage":"name","kind":"person","gender":"female"}
prepExample.termReading.2=[2] “Is [[Corvel]] coming?” she asked. → {"window":2,"quote":"none","usage":"name","kind":"person","gender":"none"}
prepExample.termReading.3=[3] [[Bellwick]] slept, and her fishermen were out at sea. → {"window":3,"quote":"none","usage":"name","kind":"place","gender":"none"}
prepExample.termReading.4=[4] [[Still]], nobody answered the door. → {"window":4,"quote":"none","usage":"word","kind":"other","gender":"none"}
prepExample.termReading.reply={"windows":[{"window":1,"quote":"She looked at the reeds","usage":"name","kind":"person","gender":"female"},{"window":2,"quote":"none","usage":"name","kind":"person","gender":"none"}],"speaking":false,"brand":false,"explainsName":0}
prepExample.lexiconReading.1=[1] They lit the [[signal fire]] on the north ridge. → {"window":1,"quote":"lit the signal fire","usage":"term"}
prepExample.lexiconReading.2=[2] A [[bank]] of fog lay on the river. → {"window":2,"quote":"A bank of fog","usage":"word"}
prepExample.lexiconReading.3=[3] [[Marrow Gate]] was shut at dusk. → {"window":3,"quote":"Marrow Gate was shut","usage":"name"}
prepExample.lexiconReading.reply={"windows":[{"window":1,"quote":"lit the signal fire","usage":"term"},{"window":2,"quote":"the signal fire burned low","usage":"term"}],"senses":1,"rendering":""}
prepExample.prescan.1=- "Well" opening "Well, I never." → not a name: leave it out.
prepExample.prescan.2=- "Garrick Ashdown" in "Garrick Ashdown smiled at his guests." → {"term":"Garrick Ashdown","type":"person","gender":"male","note":"a merchant","confidence":0.9}
prepExample.prescan.3=- "El-Barun" in "They rode on to El-Barun." → {"term":"El-Barun","type":"place","gender":"unknown","note":"a town","confidence":0.8}
prepExample.prescan.reply={"terms":[{"term":"Garrick Ashdown","type":"person","gender":"male","note":"a merchant","confidence":0.9}]}
prepExample.reviewTerms.1=- "Still" — 120×, [1] "Still, perhaps it was the weather." → {"term":"Still","verdict":"not-a-name","type":"other","gender":"unknown","windows":[1],"evidence":"Still, perhaps it was the weather"}
prepExample.reviewTerms.2=- "Garrick Ashdown" — [1] "\\"He is late,\\" said Garrick Ashdown.", [2] "Garrick Ashdown smiled. He raised his glass." → {"term":"Garrick Ashdown","verdict":"name","type":"person","gender":"male","windows":[2],"evidence":""}
prepExample.reviewTerms.3=- "El-Barun" — [1] "They rode on to El-Barun." → {"term":"El-Barun","verdict":"name","type":"place","gender":"unknown","windows":[1],"evidence":""}
prepExample.reviewTerms.reply={"verdicts":[{"term":"Still","verdict":"not-a-name","type":"other","gender":"unknown","windows":[1],"evidence":"Still, perhaps it was the weather"},{"term":"Garrick Ashdown","verdict":"name","type":"person","gender":"male","windows":[2],"evidence":""}]}

# Block 12 of a proofread call (design D15 "Call"): the minimal-edit instruction and at most five rules, one per line.
# {{sourceLanguage}} and {{targetLanguage}} are the languages' English names; a target language's own file may give its
# own instruction, naming the source through {{sourceLanguageGenitive}} from its languageGenitive.<tag> keys.
proofreadInstruction=You proofread a translation from {{sourceLanguage}} into {{targetLanguage}}. Each <s> item gives a paragraph's source and its current translation: correct only what is wrong in the translation and change as little as you can.
proofreadInstruction.noSource=You proofread a translation into {{targetLanguage}}. Each <s> item gives a paragraph's source and its current translation: correct only what is wrong in the translation and change as little as you can.
proofreadRules=- Fix a meaning that is wrong or missing, a name in the wrong form, a gender that does not agree, or a word left in the source language.\n- Keep every ⟦…⟧ mark exactly once.\n- Leave a correct sentence exactly as it is; never restyle it.\n- The lines before and after the items are read-only: never answer them.
