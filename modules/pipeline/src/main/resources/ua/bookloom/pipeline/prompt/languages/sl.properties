# Slovenian. Conservative, well-known rules drafted for native-speaker review: untested until the language has a corpus run.
status=untested
quotes=„…“ for speech, ‚…‘ inside them; »…« is also accepted.
dialogue=Speech in „…“, with the tag after a comma: „Pridi sem,“ je rekla.
agreement=Past participles show the subject's gender (naredil, naredila); nouns, adjectives and pronouns agree in case, gender and number; two things take the dual (dva stola).
address=Choose ti or vi by the relationship and keep it for the whole conversation.
numbers=12 000 with a space; a decimal comma (3,5).
pitfalls.1=Watch false friends: rok is a "deadline" (leto is "year"), pozor "attention".
reviewerChecks.1=Check case endings, the dual and the gender of past participles.
sourceNotes.1=A past participle shows gender (naredil he, naredila she); a subject pronoun is often dropped; the dual is used for two.

# Endings that make a plural of a name (15h.A6): a name candidate that is another candidate plus one of these is its alias, not a name of its own.
pluralSuffixes=i
# Words that address a man or a woman (15h.G2), term>male or term>female: a quote in which a character addresses the narrator with one shows the narrator's gender to the brief suggestion.
addressTerms=gospod>male fant>male gospa>female gospodična>female dekle>female
