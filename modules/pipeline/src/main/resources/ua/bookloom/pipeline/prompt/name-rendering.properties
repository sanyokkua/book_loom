# How the glossary's suggestion call renders names, one rule per Book Brief name policy. {target} is the target
# language's English name and {convention} its spelling convention for foreign names: the line for the target's primary
# language subtag, else convention.default. A missing key stops loading, so no policy goes unstated.
policy.TRANSLATE=- Names: use the natural {target} equivalent a published translation would print — the established {target} name of a real place or person, the {target} form of a given name that has one, a translation by meaning of a speaking name or a nickname. Transliterate a name only when it has no such equivalent: {convention}
policy.TRANSLITERATE=- Names of people and places: spell them in {target} by their sound; never translate what they mean. {convention} A real place or person with an established {target} name keeps that name.
policy.KEEP_ORIGINAL=- Every listed row is a term, not a name: translate it into {target} by meaning, as a dictionary would.
terms=- A name made of ordinary words (an organisation, an institution, a named object) and a domain term are translated by meaning, whatever the rule for names.
convention.default=Spell the name the way an educated native translator would print it, using {target}'s standard conventions for foreign names.
convention.uk=Follow the Ukrainian orthography's practical transcription of foreign names: write the name as it sounds, H as Г (Harrow → Гарроу), keep a double consonant of the original (Harry → Гаррі), and end it as Ukrainian would (-ія for -ia, Victoria → Вікторія).
