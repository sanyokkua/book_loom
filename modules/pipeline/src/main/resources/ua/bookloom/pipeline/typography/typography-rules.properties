# Per-language typography beyond the quote marks (those live in checks/quote-pairs.properties, the one table of quote
# conventions). "*" is the line of a language with no line of its own: it fixes apostrophes, the ellipsis and the space
# before a mark, and never rewrites quotes. A mark is listed in no-space-before only when no language that uses it
# takes a space there; French keeps its space before ? ! ; so its line is shorter. ":" is left out because a ratio
# ("3 : 1") is written with the space.
*.apostrophe=’
*.no-space-before=,.;!?…
fr.no-space-before=,.…
# Speech repairs that need the source paragraph (plan B7): "comma-outside-quote" moves a comma written inside a closing
# quote to just after it before a dash (a quote, comma, dash: Ukrainian); "repair-speech" turns on the mixed-quote,
# opening-quote, split-speech, stray-quote and sentence-case rewrites. Off for every language not listed.
*.comma-outside-quote=false
*.repair-speech=false
uk.comma-outside-quote=true
uk.repair-speech=true
