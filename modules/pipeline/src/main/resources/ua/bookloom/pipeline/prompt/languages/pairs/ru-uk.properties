# Russian -> Ukrainian: russisms and false friends.
pitfalls.1=No russisms: брати участь (not приймати участь), протягом (not на протязі), ставитися (not відноситися), наступний (not слідуючий).
pitfalls.2=False friends: неділя is "Sunday" (week: тиждень), час is "time" (hour: година). Never ы, э, ъ, ё.
example.1=Source: — Погоди, ⟦g0⟧! — крикнула она.\nGlossary: ⟦g0⟧ → Гордей, person, male\nReply: {"target":"— Стривай, ⟦g0⟧! — гукнула вона."}
batchExample.1=— Погоди, ⟦g0⟧! — крикнула она. ⇒ — Стривай, ⟦g0⟧! — гукнула вона.\n1881 ⇒ 1881
negationCounts=true
