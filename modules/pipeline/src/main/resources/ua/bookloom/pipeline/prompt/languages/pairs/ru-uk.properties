# Russian -> Ukrainian: russisms and false friends.
pitfalls.1=No russisms: брати участь (not приймати участь), протягом (not на протязі), ставитися (not відноситися), наступний (not слідуючий).
pitfalls.2=False friends: неділя is "Sunday" (week: тиждень), час is "time" (hour: година). Never ы, э, ъ, ё.
reviewerChecks.1=No Russian word, letter or calque remains in the Ukrainian.
example.1=Source: — Погоди, ⟦g0⟧! — крикнула она.\nGlossary: ⟦g0⟧ → Гордей, person, male\nReply: {"target":"— Стривай, ⟦g0⟧! — гукнула вона."}
batchExample.1=— Погоди, ⟦g0⟧! — крикнула она. ⇒ — Стривай, ⟦g0⟧! — гукнула вона.\n1881 ⇒ 1881
negationCounts=true
nameExample.TRANSLITERATE=- Эдвин — person, male — «Эдвин поднялся по лестнице.»\n- Уэльс — place — «Они ехали через Уэльс под дождём.»\nA valid reply:\n{"suggestions":[{"term":"Эдвин","target":"Едвін","gender":"male"},{"term":"Уэльс","target":"Уельс","gender":"male"}]}
nameExample.TRANSLATE=- Серебряный ручей — place — «Они разбили лагерь у Серебряного ручья.»\n- Эдвин — person, male — «Эдвин поднялся по лестнице.»\nA valid reply:\n{"suggestions":[{"term":"Серебряный ручей","target":"Срібний Струмок","gender":"male"},{"term":"Эдвин","target":"Едвін","gender":"male"}]}
nameExample.KEEP_ORIGINAL=- Gordon Hall — place — «Они встретились у Gordon Hall.»\n- Эдвин — person, male — «Эдвин поднялся по лестнице.»\nA valid reply:\n{"suggestions":[{"term":"Gordon Hall","target":"Gordon Hall","gender":"male"},{"term":"Эдвин","target":"Едвін","gender":"male"}]}
