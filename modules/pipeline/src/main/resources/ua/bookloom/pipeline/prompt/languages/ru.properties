# Russian as the target or the source; owner-reviewed. Lines starting with # never reach the model.
status=tested
quotes=«…» for speech and titles, „…“ inside them.
dialogue=Keep the source's form: quoted speech stays in «…»; a dash dialogue keeps its dash (— Иди сюда, — сказала она).
# Particles and negations that carry mood or polarity: an agreement or gender edit may neither add nor drop one (мог бы, не пошла).
# Voiced and voiceless consonants a name's final letter swaps between (Майлз, Майлс); used by the audit's spelling-variant scan.
voicingPairs=бп вф гк дт жш зс
negationWords=не ни никогда нигде никто ничего
moodWords=бы б же ли
agreement=Past-tense verbs agree with the subject's gender and number (он пошёл, она пошла); adjectives, numerals and nouns agree in case.
address=Choose ты or вы by the relationship and keep it for the whole conversation.
numbers=12 000 with a space; a decimal comma (3,5).
pitfalls.1=No English word order or passive; prefer the active, natural phrasing.
pitfalls.2=Write only Russian letters; never і, ї, є, ґ or Ukrainian words (use потому что, not тому що).
reviewerChecks.1=Every past-tense verb and adjective matches its subject's gender and number.
reviewerChecks.2=No Ukrainian letter or word has leaked in.
sourceNotes.1=Russian past-tense verbs and adjectives show gender (пошёл he, пошла she): keep it in the translation.
sourceNotes.2=ты is informal, вы formal or plural.
# The first-person subject pronouns of narration; see en.properties.
firstPersonPronouns=я Я
# Third-person subject pronouns that show a character's gender (B6): a name followed by one of them in the same or the next sentence, outside speech and with no other name between, is that gender's evidence.
femalePronouns=она
malePronouns=он
# Object and possessive forms (15h.A2): they often name somebody else, so they count only when a name has too few subject pronouns and none of those contradicts them.
# им and ним are left out: they also mean "them".
femaleObjectPronouns=её ее неё нее ей ней ею нею
maleObjectPronouns=его него ему нему

# Endings that make a plural of a name (15h.A6): a name candidate that is another candidate plus one of these is its alias, not a name of its own.
pluralSuffixes=ы и ов
# Words that address a man or a woman (15h.G2), term>male or term>female: a quote in which a character addresses the narrator with one shows the narrator's gender to the brief suggestion.
addressTerms=сударь>male господин>male парень>male сынок>male братец>male дружище>male сударыня>female госпожа>female барышня>female девушка>female дочка>female сестрица>female

# Whether this language declines proper names (15i.N6): where it does, a suggested rendering cannot be locked, since the text needs its case forms; where it does not, a verified name can be locked.
namesInflect=true

# Letters that belong to Ukrainian only: a Russian target never holds one, so a draft with one is blocked and repaired.
forbiddenLetters=іїєґ
# The forms of "you" a speech must not mix; the formal ones are capitalised because a lower-case вы is as often the plural.
informalAddress=ты тебя тебе тобой тобою твой твоего твоему твоим твоя твоей твоей твою твоё твои твоих твоими
formalAddress=Вы Вас Вам Вами Ваш Вашего Вашему Вашим Ваша Вашей Вашу Ваше Ваши Ваших Вашими
# Abbreviated titles a name may follow; the dot belongs to the word.
honorifics=г-н г-жа проф. д-р

# How a name declines (read the other way round to find a form's possible nominatives). A row is
# nameParadigms.N=<ending>|<gender>: <the endings of the other cases>; C stands for a consonant, "indeclinable" for the
# closed class of endings a name never changes.
nameParadigms.1=ов|m: ова ову овым ове
nameParadigms.2=ова|f: овой ову
nameParadigms.3=ой|m: ого ому ым ом
nameParadigms.4=ий|m: ия ию ием ии
nameParadigms.5=ия|f: ии ию ией
nameParadigms.6=C|m: а у ом е
nameParadigms.7=а|f: ы е у ой ою
nameParadigms.8=indeclinable|any: о и у ых их ко
# An adjective surname (Градовский, Градовского) declines like an adjective; the row beside -ий above is a first name's.
nameParadigms.9=ий|m: ого ому им ом
# The rows whose declension shows a gender by itself (a consonant name with an attested genitive is a man's). -а is left
# out: Никита and Илья decline like a woman's name and are men.
paradigmGender=C ов ова ой ий ия
# The endings stripped from a noun to find its stem.
nounEndings=ь ей ем ём ю я а ы и у е ом ой
# A vocative that clips a name: the ending and what it becomes (∅ is nothing).
clippedVocative=а>∅ я>ь
# A man's surname ending and the woman's form of it.
femSurnameMap=ов>ова ев>ева ин>ина ский>ская
# The verb and short-adjective endings that show a gender (read from the words after a name).
pastFemale=ла лась лася
pastMale=л лся
pastMaleIrregular=мог нёс вёз лёг умер
shortAdjFemale=рада должна
shortAdjMale=рад должен
# The neuter past endings: a verb that shows neither a man nor a woman.
pastNeuter=ло лось
# Particles and adverbs that may stand between a subject and its past-tense verb (я тоже не спал).
pastSkipWords=не ни б бы ж же и тоже также уже ещё лишь только тогда потом тихо быстро просто сразу снова опять наконец никогда всегда почти там тут вот теперь даже совсем вдруг молча медленно долго
# Words that end like a past tense and are not one.
pastNotVerbs=стол пол угол зал бал вол тыл ил дел тел сила мила скала игла мгла стрела смола метла пчела школа дела тела чела мало село тело дело число стекло зло весло крыло
# The words that put a person in a clause as the one spoken to.
addressPositions=у от для без до из
# Stress marks (acute, grave) are removed from every text this language takes in.
stripStressMarks=true
# An invented sentence and the answer the names-pass reading gives for it.
readingExample=Окно: «Мирослава вернулась поздно. Она не стала зажигать свет.»
readingExample.answer={"quote":"Она не стала","usage":"person","gender":"female"}
